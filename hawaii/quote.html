<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#3182F6">
<meta name="author" content="플래닛투어 PLANITTOUR">
<meta name="copyright" content="Copyright (c) 2026 플래닛투어 (PLANITTOUR). All rights reserved.">
<meta name="robots" content="noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLANITTOUR 플래닛투어 · 하와이 신혼여행 안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* 유럽 시스템과 동일한 색 */
  --pp:#3182F6; --ppD:#1B64DA; --ppL:#E8F3FF; --ppLL:#F4F9FF; --ppB:#D5E4FA;
  --hero:#E8F3FF;
  --blue:#3182F6; --blueL:#F4F9FF;
  --red:#F04452; --redL:#FEECEE;
  --amber:#C79A20; --amberL:#FFF8E6;
  --gold:#E8B931;
  --g900:#191F28; --g800:#26303B; --g700:#333D4B; --g600:#4E5968;
  --g500:#6B7684; --g400:#8B95A1; --g300:#B0B8C1;
  --g200:#E5E8EB; --g100:#F2F4F6; --g50:#F9FAFB; --w:#fff;
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --r:16px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--g100);color:var(--g900);font-family:var(--font);
  font-size:16px;line-height:1.7;letter-spacing:-.3px;padding-bottom:72px;overflow-x:hidden}
img,figure,table{max-width:100%}
button,select,input,textarea{font-family:var(--font)}
button{min-height:44px;cursor:pointer}
a{color:var(--pp)}

.wrap{max-width:840px;margin:0 auto;background:var(--w);min-height:100vh}
@media(min-width:900px){.wrap{max-width:900px}}

/* ── 상단 히어로 ── */
.hero{background:var(--hero);padding:26px 22px 24px;border-bottom:1px solid var(--ppB)}
@media(min-width:900px){.hero{padding:32px 36px 30px}}
.hero .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;background:var(--w);
  border:1px solid var(--ppB);border-radius:999px;color:var(--g500);font-size:12.5px;font-weight:800;
  letter-spacing:-.2px}
.hero h1{margin-top:11px;font-size:clamp(24px,6.4vw,30px);line-height:1.3;font-weight:900;
  letter-spacing:-1.2px;color:var(--g900)}
.hero p{margin-top:6px;font-size:14.5px;color:var(--g600);letter-spacing:-.4px}
.logo{height:28px;width:auto;max-width:170px;object-fit:contain;display:block;margin-bottom:12px}
.logotext{display:block;font-size:15px;font-weight:800;letter-spacing:1.2px;color:var(--ppD);margin-bottom:12px}

/* ── 섹션 ── */
.sec{padding:26px 22px 4px}
@media(min-width:900px){.sec{padding:34px 36px 4px}}
.sec-h{margin-bottom:14px}
.sec-h h2{font-size:clamp(19px,5vw,22px);font-weight:900;letter-spacing:-.8px;
  display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:'';width:7px;height:20px;background:var(--pp);border-radius:999px;flex:0 0 auto}
.sec-h p{margin-top:5px;font-size:14px;color:var(--g500);letter-spacing:-.35px;line-height:1.65}
.eyebrow{font-size:12px;font-weight:800;color:var(--pp);letter-spacing:1px;margin-bottom:3px}

.card{background:var(--w);border:1px solid var(--ppB);border-radius:var(--r);
  padding:18px 20px;margin-bottom:10px}
.card.flat{background:var(--ppLL)}
.note{background:var(--blueL);border:1px solid #DCE8D6;border-radius:16px;padding:13px 15px;
  font-size:13.5px;color:var(--g700);letter-spacing:-.3px;line-height:1.75;margin-top:10px}
.note b{color:var(--blue);font-weight:800}
.warn{background:var(--redL);border-radius:14px;padding:12px 14px;font-size:13.5px;
  color:#C0353F;letter-spacing:-.3px;line-height:1.7;margin-top:9px}
.warn strong{font-weight:800}

/* ── 폼 ── */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label{display:block;font-size:13.5px;font-weight:700;color:var(--g600);
  margin-bottom:5px;letter-spacing:-.3px}
.lbnote{font-size:12px;font-weight:500;color:var(--g400);margin-left:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
  width:100%;font-size:15px;padding:12px 13px;border-radius:12px;border:1px solid var(--g200);
  background:var(--w);color:var(--g900);letter-spacing:-.35px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pp);outline-offset:-2px;border-color:transparent}
select{cursor:pointer}
.field small{display:block;font-size:12.5px;color:var(--g400);margin-top:5px;letter-spacing:-.2px;line-height:1.6}
.readbox{background:var(--ppL);border-radius:12px;padding:12px 14px;font-size:15px;
  font-weight:700;color:var(--g900);letter-spacing:-.4px}
.namerow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:480px){.namerow{grid-template-columns:1fr}}

/* 필수 표시 */
.rq{position:relative;display:block}
.rq>input,.rq>select{border:2px solid var(--red);background:#FFF7F8}
.rq::before{content:'필수';position:absolute;top:-8px;left:10px;z-index:2;background:var(--red);
  color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;line-height:1.5;
  pointer-events:none}
.rq.ok>input,.rq.ok>select{border:1.5px solid #2E9E5B;background:#F4FBF6}
.rq.ok::before{content:'\2713';background:#2E9E5B;width:18px;height:18px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px}

/* ── 선택 카드 ── */
.pickrow{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.pickrow{grid-template-columns:1fr}}
.pickcard{background:var(--w);border:1.5px solid var(--g200);border-radius:16px;padding:15px 16px;
  cursor:pointer;transition:.15s;display:block}
.pickcard.on{border-color:var(--pp);background:var(--ppLL);box-shadow:0 3px 14px rgba(110,75,139,.12)}
.pickcard input{display:none}
.pickcard b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.5px;color:var(--g900)}
.pickcard em{display:block;font-style:normal;font-size:13px;color:var(--g500);margin-top:3px;
  letter-spacing:-.3px;line-height:1.6}
.pickcard.on b{color:var(--ppD)}

/* ── 호텔 ── */
.hotelbar{display:grid;gap:7px;grid-template-columns:1fr 1fr;margin-bottom:9px}
@media(min-width:640px){.hotelbar{grid-template-columns:repeat(4,1fr)}}
.hotelbar select{width:100%;min-width:0}
.filterchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:12.5px;font-weight:600;background:var(--w);border:1px solid var(--g200);
  color:var(--g500);padding:8px 13px;border-radius:100px;cursor:pointer;min-height:0;letter-spacing:-.3px}
.chip.on{background:var(--ppL);border-color:var(--pp);color:var(--ppD);font-weight:700}
.htcount{font-size:12.5px;color:var(--g400);margin-bottom:9px;letter-spacing:-.2px}
.ht-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ht-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:var(--g100);color:var(--g500)}
.ht-tag.ov{background:#E0F2FE;color:#0369A1}
.ht-tag.zone{background:var(--g100);color:var(--g600)}
.htlist{display:grid;gap:9px}
.htcard{border:1.5px solid var(--g200);border-radius:16px;padding:14px 15px;background:var(--w);
  cursor:pointer;transition:.15s}
.htcard.on{border-color:var(--pp);background:var(--ppLL);box-shadow:0 3px 14px rgba(110,75,139,.12)}
.ht-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ht-h b{font-size:15.5px;font-weight:800;letter-spacing:-.5px}
.ht-h .en{font-size:12.5px;color:var(--g400);letter-spacing:-.2px}
.ht-g{font-size:11.5px;font-weight:800;background:var(--g100);color:var(--g600);
  padding:2px 8px;border-radius:6px}
.ht-src{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px}
.ht-src.src-red{background:#FEE2E2;color:#C0353F}
.ht-src.src-purple{background:#EDE9FE;color:#6D28D9}
.ht-meta{font-size:13px;color:var(--g500);letter-spacing:-.3px;margin-top:5px;line-height:1.65}
.ht-meta b{color:var(--g700);font-weight:700}
.ht-note{font-size:12.5px;color:var(--amber);letter-spacing:-.2px;margin-top:5px;font-weight:600}
.ht-imgs{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:7px;overflow-x:auto;
  scroll-snap-type:x mandatory;border-radius:12px;margin-top:10px;scrollbar-width:none}
.ht-imgs::-webkit-scrollbar{display:none}
@media(min-width:600px){.ht-imgs{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}}
.ht-imgs figure{margin:0;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--g100);
  scroll-snap-align:start}
.ht-imgs img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--g50);border:1.5px dashed var(--g200);border-radius:12px;
  aspect-ratio:4/3;text-align:center;padding:12px}
.ph b{font-size:12.5px;font-weight:700;color:var(--pp)}
.ph span{font-size:11px;color:var(--g400);margin-top:3px;word-break:break-all}

/* ── 옵션 ── */
.optlist{display:grid;gap:8px}
.optcard{border:1.5px solid var(--g200);border-radius:16px;padding:14px 15px;background:var(--w);cursor:pointer}
.optcard.on{border-color:var(--pp);background:var(--ppLL)}
.opt-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opt-h b{font-size:15px;font-weight:800;letter-spacing:-.45px}
.opt-hot{font-size:10.5px;font-weight:800;background:#FEE2E2;color:#C0353F;padding:2px 7px;border-radius:5px}
.opt-p{margin-left:auto;font-size:15px;font-weight:800;color:var(--ppD)}
.opt-d{font-size:13px;color:var(--g500);margin-top:5px;letter-spacing:-.3px;line-height:1.65}
.opt-pre{font-size:10.5px;font-weight:800;background:#FFF3D6;color:#8A6A1E;padding:2px 7px;border-radius:5px}
.opt-ex{font-size:12px;color:var(--g400);margin-top:5px;letter-spacing:-.2px;line-height:1.6}

/* ── 일정표 ── */
.dayrow{border:1px solid var(--ppB);border-radius:var(--r);overflow:hidden;margin-bottom:10px;background:var(--w)}
.day-h{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.day-n{background:var(--pp);color:#fff;font-size:15px;font-weight:900;padding:7px 16px;
  border-radius:999px;flex:0 0 auto}
.day-t{flex:1;min-width:120px;font-size:16.5px;font-weight:900;letter-spacing:-.5px}
.day-k{font-size:13.5px;font-weight:800;color:var(--g500)}
.day-b{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--ppB)}
@media(min-width:640px){.day-b{grid-template-columns:1fr 130px}}
.day-main{font-size:15px;line-height:1.85;color:var(--g800)}
.day-main .li{padding-left:12px;position:relative}
.day-main .li::before{content:'·';position:absolute;left:2px;color:var(--g400)}
.tourbox{background:#F8F2FF;border:1px solid var(--ppB);border-radius:16px;padding:12px 14px;margin:9px 0}
.tourbox b{display:block;font-size:15.5px;font-weight:800;margin-bottom:5px}
.tourbox .li{font-size:14px;line-height:1.8}
.hotelmark{background:var(--ppL);border:1px solid var(--ppB);border-radius:14px;padding:9px 12px;
  margin-top:9px;font-size:14.5px;font-weight:800}
.hotelmark span{color:var(--pp);margin-right:6px}
.day-meal{font-size:14px;line-height:1.9;color:var(--g800)}
@media(min-width:640px){.day-meal{border-left:1px solid var(--ppB);padding-left:12px}}
@media(max-width:639px){.day-meal{border-top:1px solid var(--ppB);padding-top:9px}}
.day-meal strong{display:block;font-size:15px;font-weight:800;margin-bottom:3px}
.day-meal em{font-style:normal;color:var(--g500);font-weight:800;margin-right:5px}

/* ── 요약 카드 ── */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.sumgrid{grid-template-columns:repeat(4,1fr)}}
.sumcard{background:var(--ppL);border:1px solid var(--ppB);border-radius:18px;padding:12px 14px}
.sumcard dt{font-size:12.5px;color:var(--g500);font-weight:800}
.sumcard dd{margin-top:4px;font-size:15.5px;font-weight:900;letter-spacing:-.4px;line-height:1.4}

/* ── 금액 ── */
.pricebox{background:linear-gradient(160deg,#14202E 0%,#1B3A63 55%,var(--ppD) 100%);
  border-radius:var(--r);padding:28px 22px;color:#fff;text-align:center}
.pricebox>span{font-size:13.5px;color:#8FB4F5;letter-spacing:-.3px}
.pricebox b{display:block;font-size:clamp(38px,11vw,56px);font-weight:900;letter-spacing:-2.4px;
  line-height:1.1;margin:6px 0 2px}
.pricebox .krw{display:block;font-size:12.5px;font-weight:600;color:#7E94AE;letter-spacing:-.2px}
.pricebox em{display:block;font-style:normal;font-size:14.5px;font-weight:700;color:#8FB4F5;
  margin-top:12px;letter-spacing:-.35px}
.pricebox .krw2{display:block;font-size:11.5px;font-weight:500;color:#6B7F96;
  letter-spacing:-.2px;margin-top:1px}
.pricebox .fxnote{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);
  font-size:11.5px;color:#6B7F96;line-height:1.65}

/* ── 내부 정산 ── */
.inner{background:var(--g900);color:#fff;border-radius:var(--r);padding:18px 20px;margin-top:10px}
.inner h4{font-size:13px;font-weight:800;color:#7E8B9C;letter-spacing:-.2px;margin-bottom:10px}
.ir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09);
  font-size:14.5px;letter-spacing:-.35px}
.ir:last-child{border-bottom:0}
.ir span{color:#7E8B9C}
.ir b{font-weight:800}
.ir.big b{font-size:19px;color:#7FB0FF}
.ir.sub2{padding:3px 0;border-bottom:0}
.ir.sub2 span{padding-left:8px;font-size:13px;color:#5E6B7C}
.ir.sub2 b{font-size:13.5px;font-weight:600;color:#8E9CAD}

/* ── 슬라이더 ── */
.slider{margin-top:4px}
.slider input[type=range]{width:100%;accent-color:var(--pp);height:34px}
.slabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--g400);margin-top:-4px}

/* ── 리스트 ── */
.list{list-style:none;display:grid;gap:6px}
.list li{position:relative;padding-left:20px;font-size:14.5px;line-height:1.75;letter-spacing:-.35px}
.list li::before{position:absolute;left:0;top:0;font-weight:800}
.list.inc li::before{content:'✓';color:#2E9E5B}
.list.exc li::before{content:'−';color:var(--g300)}
.list li b{display:inline-block;min-width:42px;font-weight:800;margin-right:4px}
.grid.g2{display:grid;gap:9px}
@media(min-width:720px){.grid.g2{grid-template-columns:1fr 1fr}}
.card h3{font-size:16px;font-weight:900;margin-bottom:9px;letter-spacing:-.5px}

/* ── 아코디언 ── */
details{border:1px solid var(--ppB);border-radius:16px;margin-bottom:8px;overflow:hidden;background:var(--w)}
summary{padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:10px;letter-spacing:-.4px}
summary::-webkit-details-marker{display:none}
.sm-lab{flex:1;min-width:0}
.sm-lab small{display:block;font-size:12.5px;color:var(--g400);font-weight:500;margin-top:2px}
.chev{width:18px;height:18px;flex:0 0 auto;color:var(--g300);transition:.2s}
details[open] .chev{transform:rotate(180deg)}
.dbody{padding:0 16px 16px;font-size:14.5px;line-height:1.8;color:var(--g700)}
.dbody p{margin-bottom:9px}
.dbody strong{color:var(--g900);font-weight:800}

/* ── 툴 ── */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools button{font-size:13px;font-weight:600;background:var(--ppL);border:0;color:var(--ppD);
  padding:10px 14px;border-radius:10px;letter-spacing:-.3px}
.tools button.ghost{background:var(--g100);color:var(--g500)}
.cta{display:block;width:100%;font-size:16px;font-weight:800;background:var(--pp);border:0;color:#fff;
  padding:16px;border-radius:14px;letter-spacing:-.5px;margin-top:10px}
.cta.ghost{background:var(--w);color:var(--g700);border:1px solid var(--g200)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--g200);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:840px;margin:0 auto;display:flex;gap:9px;align-items:center}
.bottombar .st{flex:1;min-width:0;font-size:13px;color:var(--g500);letter-spacing:-.3px}
.bottombar .st b{color:var(--g900);font-weight:800}
.bottombar button{flex:0 0 auto;font-size:15px;font-weight:800;background:var(--pp);border:0;color:#fff;
  padding:13px 22px;border-radius:12px;letter-spacing:-.4px}

/* ── 링크 결과 ── */
.linkrow{background:var(--ppLL);border:1px solid var(--ppB);border-radius:16px;padding:14px 15px;margin-bottom:8px}
.linkrow b{display:block;font-size:14.5px;font-weight:800;margin-bottom:5px}
.linkrow .u{font-size:11.5px;color:var(--g400);word-break:break-all;line-height:1.6;margin-bottom:10px}
.linkrow .btns{display:flex;gap:6px}
.linkrow .btns button{flex:1;font-size:13px;font-weight:700;background:var(--pp);border:0;color:#fff;
  padding:11px;border-radius:10px}
.linkrow .btns button.ghost{background:var(--w);color:var(--g700);border:1px solid var(--g200)}
.msg{width:100%;min-height:120px;font-size:13.5px;padding:13px;border-radius:12px;
  border:1px solid var(--g200);background:var(--g50);line-height:1.7;resize:vertical}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);
  background:var(--g900);color:#fff;font-size:14px;font-weight:600;padding:12px 20px;
  border-radius:12px;opacity:0;pointer-events:none;transition:.24s;z-index:70;
  max-width:88vw;text-align:center;letter-spacing:-.3px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 모달 ── */

function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function $(id){ return document.getElementById(id); }
function gv(id){ var el = $(id); return el ? el.value : ''; }
function sv(id, v){ var el = $(id); if(el) el.value = v; }

function usd(n){ return '$' + (Math.round(Number(n) || 0)).toLocaleString('en-US'); }
function usd2(n){
  var v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2});
}
function krw(n){ return (Math.round(Number(n) || 0)).toLocaleString('ko-KR') + '원'; }
/* 고객 노출용 — 1,000원 단위 올림 */
function krwC(n){ return (Math.ceil((Number(n) || 0) / 1000) * 1000).toLocaleString('ko-KR') + '원'; }

function parseDate(v){
  if(!v) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
  if(!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function ymd(d){
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
var DOW = ['일','월','화','수','목','금','토'];
function fmtDate(d){
  if(!d) return '';
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')';
}
function fmtFull(d){
  if(!d) return '';
  return d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' +
    ('0' + d.getDate()).slice(-2) + ' (' + DOW[d.getDay()] + ')';
}

var __toastT = null;
function toast(msg){
  var el = $('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('on');
  if(__toastT) clearTimeout(__toastT);
  __toastT = setTimeout(function(){ el.classList.remove('on'); }, 2400);
}

/* ══════════════════════════════════════════
   요금 계산
   호텔 요금은 1박 객실 요금 → 1인 기준으로 나눕니다.
   ══════════════════════════════════════════ */
function calc(){
  var pax = Math.max(1, Number(gv('qpax')) || 2);
  var rooms = Math.ceil(pax / 2);
  var fx = Number(gv('fx')) || FX_DEFAULT;
  STATE.fx = fx;
  var margin = Number(gv('margin')) || MARGIN_DEFAULT;
  STATE.margin = margin;

  var lines = [];

  /* 호텔 — 1박 객실요금 × 박수 × 객실수 */
  var hotelUSD = 0;
  STATE.hotels.forEach(function(x){
    var n = Number(x.nights) || 0, r = Number(x.rate) || 0;
    if(!n || !r) return;
    var amt = n * r * rooms;
    hotelUSD += amt;
    lines.push({g:'숙박', d: x.hotel + ' ' + n + '박', q: n, unit: r, amt: amt});
  });

  /* 지상비 — 1인 고정 */
  var landUSD = LAND_FEE * pax;
  lines.push({g:'지상비', d:'하와이 지상비', q: pax, unit: LAND_FEE, amt: landUSD});

  /* 옵션 — 1인 요금 × 인원 */
  var optUSD = 0;
  STATE.options.forEach(function(i){
    var o = OPTIONS[i];
    if(!o || o.ask) return;   /* 개별 문의 상품은 금액에 넣지 않습니다 */
    var amt = o.p * pax;
    optUSD += amt;
    lines.push({g:'옵션', d: o.n, q: pax, unit: o.p, amt: amt});
  });

  var costUSD = hotelUSD + landUSD + optUSD;
  var marginUSD = margin * pax;
  var saleUSD = costUSD + marginUSD;

  /* 항공료 — 원화로 입력받아 1인 요금 × 인원 (달러 환산은 참고용) */
  var airKRW = (Number(STATE.air.fare) || 0) * pax;
  var localKRW = STATE.localAir.reduce(function(a, x){
    return a + (Number(x.fare) || 0) * pax; }, 0);
  var flightKRW = airKRW + localKRW;

  var money = {
    pax: pax, rooms: rooms, fx: fx,
    hotelUSD: hotelUSD, landUSD: landUSD, optUSD: optUSD,
    costUSD: costUSD, marginUSD: marginUSD, saleUSD: saleUSD,
    perUSD: saleUSD / pax,
    saleKRW: saleUSD * fx, perKRW: (saleUSD / pax) * fx,
    airKRW: airKRW, localKRW: localKRW, flightKRW: flightKRW,
    perAirKRW: flightKRW / pax,
    totalKRW: saleUSD * fx + flightKRW,
    perTotalKRW: (saleUSD * fx + flightKRW) / pax,
    lines: lines, nights: totalNights()
  };
  renderMoney(money);
  syncBottom(money);
  return money;
}

      '<div class="ir"><span>호텔 원가</span><b>' + usd(m.hotelUSD) + '</b></div>' +
      '<div class="ir"><span>지상비 (1인 ' + usd(LAND_FEE) + ')</span><b>' + usd(m.landUSD) + '</b></div>' +

      tour: TOUR_NORTH, after:['투어 종료 후 자유 일정'],
      hotel: true, meal:['조식 선택별','중식 새우트럭','석식 자유식']});
    /* 3일차 — 옵션 추천 */
    if(n >= 3){
      days.push({t:'하와이', k:'자유 일정',
        main:['전일 둘만의 자유일정'],
        tour: TOUR_OPTION, after:[],
        hotel: true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    }
    /* 나머지 자유일정 */
    for(var i = 3; i < n; i++){
      days.push({t:'하와이', k:'자유 일정',
        main:['전일 둘만의 자유일정'], tour:null, after:[],
        hotel: true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    }
  } else {
    /* 이웃섬 + 오아후 — 앞 2박은 이웃섬 */
    var iName = STATE.hotels.length && STATE.hotels[0].island !== '오아후'
      ? STATE.hotels[0].island : '빅아일랜드';
    days.push({t:'인천 → 하와이(오아후) → 하와이(' + iName + ')', k:'국제선 · 주내선',
      main:['인천 국제공항 출발',
            '호놀룰루 국제공항 도착 후 주내선 청사 개별 이동 후 환승',
            iName + ' 공항 도착',
            '공항에서 렌터카 픽업 후 호텔로 이동',
            '호텔 체크인 후 자유일정'],
      tour:null, after:[], hotel:true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    days.push({t:'하와이(' + iName + ')', k:'자유 일정',
      main:['전일 둘만의 자유일정'],
      tour: TOUR_BIG, after:[], hotel:true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    days.push({t:'하와이(' + iName + ') → 하와이(오아후)', k:'주내선 · 전용차량',
      main:['호텔 체크아웃 후 ' + iName + ' 공항으로 이동',
            '렌터카 반납 장소로 이동 후 반납',
            iName + ' 공항 출발',
            '오아후 공항 도착 후 주내선청사 배기지클레임 도착하여 가이드 미팅'],
      tour: TOUR_EAST, after:['호텔 체크인 (15:00 이후) 후 자유 일정'],
      hotel:true, meal:['조식 기내식','중식 테디스버거','석식 불포함']});
    days.push({t:'하와이', k:'북부 섬일주 관광',
      main:['오전 가이드 미팅 후'],
      tour: TOUR_NORTH, after:['투어 종료 후 자유 일정'],
      hotel:true, meal:['조식 선택별','중식 새우트럭','석식 자유식']});
    if(n >= 5){
      days.push({t:'하와이', k:'자유 일정',
        main:['전일 둘만의 자유일정'], tour: TOUR_OPTION, after:[],
        hotel:true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    }
    for(var j = 5; j < n; j++){
      days.push({t:'하와이', k:'자유 일정',
        main:['전일 둘만의 자유일정'], tour:null, after:[],
        hotel:true, meal:['조식 선택별','중식 자유식','석식 자유식']});
    }
  }

  /* 마지막 이동일 + 한국 도착 */
  days.push({t:'하와이', k:'전용차량 · 국제선',
    main:['호텔 체크아웃 후 가이드 미팅','공항으로 이동','호놀룰루 국제공항 출발'],
    tour:null, after:[], hotel:false, meal:['조식 선택별','중식 기내식','석식 기내식']});
  days.push({t:'하와이 → 인천', k:'',
    main:['인천 국제공항 도착'], tour:null, after:[], hotel:false, meal:null});

  /* 날짜 · 호텔 배정 */
  var hotelSeq = [];
  STATE.hotels.forEach(function(x){
    for(var k = 0; k < (Number(x.nights) || 0); k++) hotelSeq.push(x.hotel);
  });
  days.forEach(function(x, i){
    x.i = i + 1;
    x.d = d(i);
    x.hotelName = x.hotel ? (hotelSeq[i] || '') : '';
  });
  return days;
}

function defaultQno(){
  var d = new Date();
  return 'HW-' + String(d.getFullYear()).slice(2) +
    ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-01';
}
function defaultValid(){
  var d = new Date(); d.setDate(d.getDate() + 7);
  return d.getFullYear() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' +
    ('0' + d.getDate()).slice(-2) + ' 18시까지';
}

function renderPkg(){
  var el = $('pkgrow');
  if(!el) return;
  el.innerHTML = PACKAGES.map(function(p){
    return '<label class="pickcard' + (STATE.pkg === p.id ? ' on' : '') + '" onclick="setPkg(\'' + p.id + '\')">' +
      '<b>' + esc(p.n) + '</b><em>' + esc(p.d) + ' · 최소 ' + p.minN + '박</em></label>';
  }).join('');
}
function setPkg(id){
  STATE.pkg = id;
  renderPkg();
  if(id === 'combo' && STATE.island === '오아후') { STATE.island = '빅아일랜드'; renderIslandSel(); }
  renderHotelList(); calc();
}

function onIsland(v){
  STATE.island = v;
  STATE.zone = '';   /* 섬마다 위치 구분이 달라 초기화합니다 */
  renderIslandSel(); renderHotelList();
}
function renderIslandSel(){
  var a = $('islandSel'), b = $('gradeSel'), c = $('zoneSel'), d = $('ovSel');
  if(c){
    c.innerHTML = '<option value="">전체 위치</option>' +
      zoneList(STATE.island).map(function(z){
        return '<option value="' + z + '"' + (STATE.zone === z ? ' selected' : '') + '>' +
          zoneLabel(STATE.island, z) + '</option>';
      }).join('');
  }
  if(d){
    d.innerHTML = '<option value="">오션뷰 전체</option>' +
      '<option value="1"' + (STATE.ov === '1' ? ' selected' : '') + '>오션뷰 가능</option>' +
      '<option value="0"' + (STATE.ov === '0' ? ' selected' : '') + '>오션뷰 없음</option>';
  }
  if(a){
    a.innerHTML = ISLANDS.map(function(i){
      return '<option' + (STATE.island === i ? ' selected' : '') + '>' + i + '</option>';
    }).join('');
  }
  if(b){
    var gs = [''];
    Object.values(HOTELS).flat().forEach(function(h){ if(gs.indexOf(h.g) < 0) gs.push(h.g); });
    gs.sort(function(x, y){ return (parseFloat(x) || 0) - (parseFloat(y) || 0); });
    b.innerHTML = gs.map(function(g){
      return '<option value="' + g + '"' + (STATE.grade === g ? ' selected' : '') + '>' +
        (g ? g + '급' : '전체 등급') + '</option>';
    }).join('');
  }
}

function renderHotelList(){
  var el = $('htlist');
  if(!el) return;
  var all = HOTELS[STATE.island] || [];
  var list = all.filter(function(h){
    if(STATE.grade && h.g !== STATE.grade) return false;
    if(STATE.zone && h.zone !== STATE.zone) return false;
    if(STATE.ov !== '' && String(h.ov || 0) !== STATE.ov) return false;
    return true;
  });
  renderChips();
  var cnt = $('htcount');
  if(cnt){
    var on = (STATE.grade || STATE.zone || STATE.ov !== '');
    cnt.textContent = list.length + '개' + (on ? ' (전체 ' + all.length + '개 중)' : '');
  }
  if(!list.length){ el.innerHTML = '<div class="empty">해당 조건의 호텔이 없습니다. 필터를 조정해 보세요.</div>'; return; }
  el.innerHTML = list.map(function(h){
    var on = STATE.hotels.some(function(x){ return x.hotel === h.n; });
    return '<div class="htcard' + (on ? ' on' : '') + '" onclick="toggleHotel(\'' + esc(h.n).replace(/'/g,"\\'") + '\')">' +
      '<div class="ht-h"><b>' + esc(h.kr) + '</b><span class="en">' + esc(h.n) + '</span>' +
      '<span class="ht-g">' + esc(h.g) + '</span>' +
      (h.src !== 'both' ? '<span class="ht-src ' + SRC_COLOR[h.src] + '">' + SRC_LABEL[h.src] + '</span>' : '') +
      '</div>' +
      '<div class="ht-meta"><b>위치</b> ' + esc(h.loc) +
      (h.room ? ' · <b>객실</b> ' + esc(h.room) : '') + '</div>' +
      (h.feat ? '<div class="ht-meta">' + esc(h.feat) + '</div>' : '') +
      '<div class="ht-tags">' +
        (h.zone ? '<span class="ht-tag zone">' + zoneLabel(STATE.island, h.zone) + '</span>' : '') +
        (h.ov ? '<span class="ht-tag ov">오션뷰 가능</span>' : '') +
      '</div>' +
      (h.note ? '<div class="ht-note">⚠ ' + esc(h.note) + '</div>' : '') +
      '</div>';
  }).join('');
}

function renderChips(){
  var el = $('chips');
  if(!el) return;
  var chips = [{k:'ov', v:'1', t:'오션뷰'}];
  zoneList(STATE.island).slice(0, 3).forEach(function(z){
    chips.push({k:'zone', v:z, t:zoneLabel(STATE.island, z)});
  });
  chips.push({k:'grade', v:'4성', t:'4성급'});
  chips.push({k:'grade', v:'5성', t:'5성급'});
  var any = STATE.grade || STATE.zone || STATE.ov !== '';
  el.innerHTML = chips.map(function(c){
    var on = String(STATE[c.k]) === c.v;
    return '<button type="button" class="chip' + (on ? ' on' : '') +
      '" onclick="setFilter(\'' + c.k + '\',\'' + c.v + '\')">' + c.t + '</button>';
  }).join('') +
  (any ? '<button type="button" class="chip" onclick="clearFilter()">필터 해제</button>' : '');
}
function setFilter(k, v){
  STATE[k] = (String(STATE[k]) === v) ? (k === 'ov' ? '' : '') : v;
  renderIslandSel(); renderHotelList();
}
function clearFilter(){
  STATE.grade = ''; STATE.zone = ''; STATE.ov = '';
  renderIslandSel(); renderHotelList();
}

function toggleHotel(name){
  var i = -1;
  STATE.hotels.forEach(function(x, k){ if(x.hotel === name) i = k; });
  if(i >= 0) STATE.hotels.splice(i, 1);
  else {
    var f = hotelByName(name);
    STATE.hotels.push({island: f ? f.island : STATE.island, hotel: name, nights: 0, rate: 0});
  }
  renderHotelList(); renderPicked(); renderLocalAir(); calc();
}
function removePicked(i){ STATE.hotels.splice(i, 1); renderHotelList(); renderPicked(); renderLocalAir(); calc(); }
function movePicked(i, dir){
  var j = i + dir;
  if(j < 0 || j >= STATE.hotels.length) return;
  var t = STATE.hotels[i]; STATE.hotels[i] = STATE.hotels[j]; STATE.hotels[j] = t;
  renderPicked(); calc();
}
function setNights(i, v){ STATE.hotels[i].nights = Number(v) || 0; renderPicked(); onDep(); calc(); }
function setRate(i, v){ STATE.hotels[i].rate = Number(v) || 0; calc(); }

function renderPicked(){
  var el = $('pickedHotels');
  if(!el) return;
  if(!STATE.hotels.length){
    el.innerHTML = '<div class="empty">위에서 호텔을 눌러 선택하세요</div>';
    return;
  }
  el.innerHTML = STATE.hotels.map(function(x, i){
    var f = hotelByName(x.hotel);
    var h = f ? f.h : null;
    return '<div class="card" style="padding:14px 15px;margin-bottom:8px">' +
      '<div class="ht-h" style="margin-bottom:8px">' +
      '<b>' + esc(h ? h.kr : x.hotel) + '</b>' +
      '<span class="ht-g">' + esc(x.island) + (h ? ' · ' + h.g : '') + '</span>' +
      '<span style="margin-left:auto;display:flex;gap:3px">' +
      '<button type="button" onclick="movePicked(' + i + ',-1)" style="min-height:0;width:26px;height:26px;padding:0;border:0;border-radius:7px;background:var(--g100);color:var(--g500);font-weight:700">↑</button>' +
      '<button type="button" onclick="movePicked(' + i + ',1)" style="min-height:0;width:26px;height:26px;padding:0;border:0;border-radius:7px;background:var(--g100);color:var(--g500);font-weight:700">↓</button>' +
      '<button type="button" onclick="removePicked(' + i + ')" style="min-height:0;width:26px;height:26px;padding:0;border:0;border-radius:7px;background:var(--redL);color:var(--red);font-weight:700">×</button>' +
      '</span></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:7px">' +
      '<input type="number" min="0" max="30" placeholder="박" value="' + (x.nights || '') +
        '" oninput="setNights(' + i + ',this.value)">' +
      '<input type="number" min="0" step="1" placeholder="1박 객실 요금 ($)" value="' + (x.rate || '') +
        '" oninput="setRate(' + i + ',this.value)">' +
      '</div>' +
      (x.nights && x.rate
        ? '<div style="font-size:12.5px;color:var(--g500);margin-top:6px">' +
          x.nights + '박 × ' + usd(x.rate) + ' = <b style="color:var(--g900)">' +
          usd(x.nights * x.rate * Math.ceil((Number(gv('qpax')) || 2) / 2)) + '</b></div>'
        : '') +
      '</div>';
  }).join('');
}

function renderOptions(){
  var el = $('optlist');
  if(!el) return;
  el.innerHTML = OPTIONS.map(function(o, i){
    var on = STATE.options.indexOf(i) > -1;
    return '<div class="optcard' + (on ? ' on' : '') + '" onclick="toggleOpt(' + i + ')">' +
      '<div class="opt-h"><b>' + esc(o.n) + '</b>' +
      (o.hot ? '<span class="opt-hot">강추</span>' : '') +
      (o.pre ? '<span class="opt-pre">사전예약</span>' : '') +
      '<span class="opt-p">' + (o.ask ? '개별 문의' : usd(o.p)) + '</span></div>' +
      '<div class="opt-d">' + esc(o.d) + '</div>' +
      (o.exc ? '<div class="opt-ex">현지 지불 · ' + esc(o.exc) + '</div>' : '') +
      '</div>';
  }).join('');
}
function toggleOpt(i){
  var k = STATE.options.indexOf(i);
  if(k >= 0) STATE.options.splice(k, 1); else STATE.options.push(i);
  renderOptions(); calc();
}

function onDep(){
  var d = parseDate(gv('depDate'));
  markRq('depDate', !!d);
  var n = totalNights();
  var el = $('spanHint');
  if(el){
    if(d && n){
      var back = addDays(d, n + 1);
      el.textContent = fmtFull(d) + ' 출발 ~ ' + fmtFull(back) + ' 도착 · ' + n + '박 ' + (n + 2) + '일';
    } else {
      el.textContent = '호텔 박수를 입력하면 여행 기간이 계산됩니다';
    }
  }
  calc();
}
function tripSpan(){
  var d = parseDate(gv('depDate'));
  var n = totalNights();
  if(!d || !n) return '';
  var back = addDays(d, n + 1);
  return fmtFull(d) + ' 출발 ~ ' + fmtFull(back) + ' 도착 · ' + n + '박 ' + (n + 2) + '일';
}

function renderAir(){
  var a = $('airOut'), b = $('airBack');
  if(a){
    a.innerHTML = '<option value="">가는 편 선택</option>' +
      FLIGHTS_INTL.filter(function(f){ return f.from === '인천'; }).map(function(f){
        return '<option value="' + f.no + '"' + (STATE.air.out === f.no ? ' selected' : '') + '>' +
          f.air + ' ' + f.no + (f.dep ? ' · ' + f.dep + ' → ' + f.arr : '') + '</option>';
      }).join('');
  }
  if(b){
    b.innerHTML = '<option value="">오는 편 선택</option>' +
      FLIGHTS_INTL.filter(function(f){ return f.to === '인천'; }).map(function(f){
        return '<option value="' + f.no + '"' + (STATE.air.back === f.no ? ' selected' : '') + '>' +
          f.air + ' ' + f.no + (f.dep ? ' · ' + f.dep + ' → ' + f.arr + ' +1일' : '') + '</option>';
      }).join('');
  }
  syncAirInfo();
}
function flightByNo(no){
  for(var i = 0; i < FLIGHTS_INTL.length; i++) if(FLIGHTS_INTL[i].no === no) return FLIGHTS_INTL[i];
  return null;
}
function setAir(dir, v){ STATE.air[dir] = v; syncAirInfo(); calc(); }
function setAirFare(v){ STATE.air.fare = Number(v) || 0; calc(); }
function syncAirInfo(){
  var el = $('airInfo');
  if(!el) return;
  var o = flightByNo(STATE.air.out), b = flightByNo(STATE.air.back);
  if(!o && !b){ el.innerHTML = ''; return; }
  var h = '';
  if(o) h += '<div><b>가는 편</b> ' + esc(o.air + ' ' + o.no) +
    (o.dep ? ' · ' + o.dep + ' 인천 출발 → ' + o.arr + ' 호놀룰루 도착 (당일)' : '') +
    (o.days ? ' · ' + esc(o.days) : '') + '</div>';
  if(b) h += '<div><b>오는 편</b> ' + esc(b.air + ' ' + b.no) +
    (b.dep ? ' · ' + b.dep + ' 호놀룰루 출발 → ' + b.arr + ' 인천 도착 (익일)' : '') +
    (b.days ? ' · ' + esc(b.days) : '') + '</div>';
  el.innerHTML = h;
}

/* 주내선 */
function renderLocalAir(){
  var el = $('localAirCard');
  if(!el) return;
  var islands = [];
  STATE.hotels.forEach(function(x){
    if(x.island !== '오아후' && islands.indexOf(x.island) < 0) islands.push(x.island);
  });
  var h = '<div class="field" style="margin-bottom:' + (STATE.localAir.length ? '10px' : '0') + '">' +
    '<label>주내선 · 이웃섬 이동 <span class="lbnote">선택</span></label>';
  if(!islands.length){
    h += '<small>이웃섬 호텔을 선택하면 해당 노선이 여기에 나타납니다. 오아후만 가시면 필요 없습니다.</small>';
  } else {
    h += '<div class="airrow"><select id="localSel">' +
      '<option value="">노선 추가</option>' +
      islands.map(function(is){
        return (ISLAND_AIRPORT[is] || []).map(function(dest){
          return '<option value="' + esc(dest) + '">호놀룰루 ↔ ' + esc(dest) + '</option>';
        }).join('');
      }).join('') +
      '</select><button type="button" class="addbtn" onclick="addLocalAir()">추가</button></div>';
  }
  h += '</div>';
  if(STATE.localAir.length){
    h += STATE.localAir.map(function(x, i){
      var f = FLIGHTS_LOCAL.filter(function(y){ return y.to === x.route; })[0];
      return '<div class="localrow">' +
        '<div class="lr-h"><b>호놀룰루 ↔ ' + esc(x.route) + '</b>' +
        (f ? '<span>' + esc(f.air) + ' · ' + esc(f.t) + '</span>' : '') +
        '<button type="button" onclick="removeLocalAir(' + i + ')">×</button></div>' +
        '<input type="number" min="0" step="10000" placeholder="1인 왕복 항공료 (원)" value="' +
        (x.fare || '') + '" oninput="setLocalFare(' + i + ',this.value)">' +
        (f && f.n ? '<small>' + esc(f.n) + '</small>' : '') +
        '</div>';
    }).join('');
  }
  el.innerHTML = h;
}
function addLocalAir(){
  var v = gv('localSel');
  if(!v){ toast('노선을 골라주세요'); return; }
  if(STATE.localAir.some(function(x){ return x.route === v; })){ toast('이미 추가된 노선입니다'); return; }
  STATE.localAir.push({route: v, fare: 0});
  renderLocalAir(); calc();
}
function removeLocalAir(i){ STATE.localAir.splice(i, 1); renderLocalAir(); calc(); }
function setLocalFare(i, v){ STATE.localAir[i].fare = Number(v) || 0; calc(); }

/* 만료 기준일 — YYMMDD. 비우면 발행일 + 7일 */
function expiryKey(){
  var v = parseDate(gv('qvalidD'));
  if(!v){ v = new Date(); v.setDate(v.getDate() + 7); }
  return String(v.getFullYear()).slice(2) +
    ('0' + (v.getMonth() + 1)).slice(-2) + ('0' + v.getDate()).slice(-2);
}
function isExpired(key){
  if(!key || key.length !== 6) return false;
  var d = new Date(2000 + Number(key.slice(0,2)), Number(key.slice(2,4)) - 1, Number(key.slice(4,6)));
  d.setHours(23, 59, 59);
  return new Date() > d;
}

function packTrip(){
  var m = calc();
  var o = {
    n: customerName(),
    p: m.pax,
    k: STATE.pkg,
    s: gv('depDate').replace(/-/g, '').slice(2),
    q: [gv('qno'), (gv('qvalid') || '').trim() || defaultValid(), Math.round(m.saleUSD), m.fx,
        expiryKey(), (gv('staff') || '').trim()],
    h: STATE.hotels.filter(function(x){ return x.nights > 0; }).map(function(x){
      return [x.island, x.hotel, x.nights];
    }),
    o: STATE.options.slice()
  };
  /* 항공 — 요금이 있을 때만 담습니다 */
  if(STATE.air.out || STATE.air.back || STATE.air.fare){
    o.a = [STATE.air.out || '', STATE.air.back || '', Number(STATE.air.fare) || 0];
  }
  if(STATE.localAir.length){
    o.la = STATE.localAir.map(function(x){ return [x.route, Number(x.fare) || 0]; });
  }
  var a = (gv('fn') || '').trim(), b = (gv('fn2') || '').trim();
  if(a && b) o.n2 = [a, b];
  return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));
}

function unpackTrip(){
  var raw = null;
  try{
    var m = /[#?&]d=([^&]+)/.exec(location.hash + location.search);
    if(!m) return null;
    raw = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  }catch(e){ return null; }
  if(!raw) return null;

  var s = raw.s;
  var start = (s && s.length === 6)
    ? new Date(2000 + Number(s.slice(0,2)), Number(s.slice(2,4)) - 1, Number(s.slice(4,6)))
    : null;

  STATE.pkg = raw.k || 'oahu';
  STATE.hotels = (raw.h || []).map(function(x){
    return {island: x[0], hotel: x[1], nights: x[2], rate: 0};
  });
  STATE.options = raw.o || [];
  STATE.air = raw.a ? {out: raw.a[0], back: raw.a[1], fare: raw.a[2]} : {out:'', back:'', fare:0};
  STATE.localAir = (raw.la || []).map(function(x){ return {route: x[0], fare: x[1]}; });

  var qq = raw.q || [];
  var pax = raw.p || 2;
  var fx = qq[3] || FX_DEFAULT;
  var saleUSD = qq[2] || 0;

  return {
    n: raw.n || '', n2: raw.n2 || null, pax: pax, start: start,
    no: qq[0] || '', valid: qq[1] || '', saleUSD: saleUSD, fx: fx,
    expired: isExpired(qq[4]), staff: qq[5] || '',
    perUSD: saleUSD / pax, saleKRW: saleUSD * fx, perKRW: (saleUSD / pax) * fx,
    nights: STATE.hotels.reduce(function(a, x){ return a + x.nights; }, 0),
    hotels: STATE.hotels, options: STATE.options, pkg: STATE.pkg,
    air: STATE.air, localAir: STATE.localAir,
    airKRW: (STATE.air.fare || 0) * pax,
    localKRW: STATE.localAir.reduce(function(a, x){ return a + (x.fare || 0) * pax; }, 0),
    perAirKRW: ((STATE.air.fare || 0) +
      STATE.localAir.reduce(function(a, x){ return a + (x.fare || 0); }, 0))
  };
}

function baseUrl(){
  var v = (gv('fb') || '').trim();
  if(v) return v.split('#')[0];
  return location.href.split('#')[0];
}

function validateQuote(){
  var errs = [], warns = [];
  if(!customerName()) errs.push('신랑 또는 신부 성함을 입력해 주세요');
  if(!parseDate(gv('depDate'))) errs.push('한국 출발일을 입력해 주세요');
  if(!STATE.hotels.length) errs.push('호텔을 선택해 주세요');
  var n = totalNights();

/* ══════════════════════════════════════════
   발행 기록
   화면에서만 유지됩니다. 파일로 저장해 두세요.
   ══════════════════════════════════════════ */
var LOG = [];

function pushLog(m, url, code){
  LOG.unshift({
    t: new Date().toLocaleString('ko-KR', {hour12:false}),
    no: gv('qno'),
    name: customerName(),
    pax: m.pax,
    staff: staffName(),
    costUSD: Math.round(m.costUSD),
    saleUSD: Math.round(m.saleUSD),
    marginUSD: Math.round(m.marginUSD),
    airKRW: Math.round(m.flightKRW || 0),
    fx: m.fx,
    valid: (gv('qvalid') || '').trim() || defaultValid(),
    url: url, code: code
  });
  renderLog();
}

function renderLog(){
  var el = $('loglist');
  if(!el) return;
  var w = $('logwarn');
  if(w) w.style.display = LOG.length ? '' : 'none';
  if(!LOG.length){
    el.innerHTML = '<div class="empty">발행한 견적서가 없습니다</div>';
    return;
  }
  el.innerHTML = LOG.map(function(x, i){
    return '<div class="logrow"><div class="l1"><span class="no">' + esc(x.no) + '</span>' +
      '<span class="amt">' + usd(x.saleUSD) + '</span></div>' +
      '<div class="l2">' + esc(x.name) + ' · ' + x.pax + '명 · 수익 ' + usd(x.marginUSD) +
      (x.staff ? ' · ' + esc(x.staff) : '') + '</div>' +
      '<div class="l3">' + esc(x.t) + ' · 원가 ' + usd(x.costUSD) +
      (x.airKRW ? ' · 항공 ' + krw(x.airKRW) : '') +
      ' · 환율 ' + x.fx.toLocaleString('ko-KR') + ' · 유효 ' + esc(x.valid) + '</div>' +
      (x.code
        ? '<div class="l4">' +
          '<button type="button" onclick="reloadFromLog(' + i + ')">이 견적 불러오기</button>' +
          '<button type="button" class="gh" onclick="copyText(\'' +
            String(x.url).replace(/'/g, "\\'") + '\')">링크 복사</button>' +
          '<button type="button" class="gh" onclick="window.open(\'' +
            String(x.url).replace(/'/g, "\\'") + '\',\'_blank\')">열기</button>' +
          '</div>'
        : '') + '</div>';
  }).join('');
}

function reloadFromLog(i){
  var x = LOG[i];
  if(!x || !x.code){ toast('복원할 정보가 없습니다'); return; }
  if(!confirm(x.no + ' 견적을 불러옵니다.\n\n지금 입력하신 내용은 사라집니다.\n계속할까요?')) return;
  location.hash = '#q=1&d=' + x.code + '&edit=1';
  location.reload();
}

function exportLog(){
  if(!LOG.length){ toast('발행 기록이 없습니다'); return; }
  var head = '발행일시,견적번호,고객명,인원,담당자,매입원가USD,고객청구액USD,수익USD,항공료KRW,환율,유효기간,견적서링크,복원코드\n';
  var body = LOG.map(function(x){
    return [x.t, x.no, x.name, x.pax, x.staff || '', x.costUSD, x.saleUSD, x.marginUSD,
            x.airKRW || 0, x.fx, x.valid, x.url || '', x.code || '']
      .map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + head + body], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '하와이견적발행기록_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(LOG.length + '건을 파일로 저장했습니다');
}

function importLog(input){
  var file = input.files[0];
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var lines = String(r.result).replace(/^\ufeff/, '').split(/\r?\n/).filter(Boolean).slice(1);
      var add = lines.map(function(l){
        var v = l.match(/("([^"]|"")*"|[^,]*)/g).filter(function(x, i){ return i % 2 === 0; })
                 .map(function(x){ return x.replace(/^"|"$/g, '').replace(/""/g, '"'); });
        return {t:v[0], no:v[1], name:v[2], pax:v[3], staff:v[4],
                costUSD:Number(v[5]) || 0, saleUSD:Number(v[6]) || 0, marginUSD:Number(v[7]) || 0,
                airKRW:Number(v[8]) || 0, fx:Number(v[9]) || FX_DEFAULT,
                valid:v[10], url:v[11], code:v[12]};
      });
      var seen = {}, merged = [];
      add.concat(LOG).forEach(function(x){
        var k = (x.no || '') + '|' + (x.t || '');
        if(seen[k]) return;
        seen[k] = 1; merged.push(x);
      });
      merged.sort(function(a, b){ return String(b.t).localeCompare(String(a.t)); });
      var dup = (add.length + LOG.length) - merged.length;
      LOG = merged;
      renderLog();
      toast(add.length + '건을 불러왔습니다' + (dup ? ' (중복 ' + dup + '건 제외)' : ''));
    }catch(e){ toast('파일을 읽지 못했습니다'); }
    input.value = '';
  };
  r.readAsText(file, 'utf-8');
}

      x.after.forEach(function(l){ h += '<div class="li">' + esc(l) + '</div>'; });

  /* 추천 옵션 */
  var rest = OPTIONS.map(function(o, i){ return i; }).filter(function(i){ return T.options.indexOf(i) < 0; });
  if(rest.length){
    h += '<section class="sec"><div class="sec-h"><div class="eyebrow">' + no() + '</div>' +

    rest.forEach(function(i){
      var o = OPTIONS[i];
      h += '<details><summary><span class="sm-lab">' + esc(o.n) +
        (o.hot ? ' <span class="opt-hot">강추</span>' : '') +
        (o.pre ? ' <span class="opt-pre">사전예약</span>' : '') +
        '<small>' + esc(o.d) + ' · ' + (o.ask ? '개별 문의' : usd(o.p) + ' / 1인') + '</small></span>' +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary>' +
        '<div class="dbody">' +
        (o.detail ? '<p>' + esc(o.detail) + '</p>' : '') +
        (o.inc ? '<p><strong>포함</strong><br>' + esc(o.inc) + '</p>' : '') +
        (o.exc ? '<div class="warn"><strong>현지 지불 · 불포함</strong><br>' + esc(o.exc) + '</div>' : '') +
        (o.note ? '<p style="font-size:13px;color:var(--g500);margin-top:9px">' + esc(o.note) + '</p>' : '') +

    h += '<div class="card" style="margin-top:10px"><h3>예약 시 참고사항</h3><ul class="list exc" style="list-style:none">' +

      '</ul></div>';
    h += '<div class="note">상기 유료 일정은 현지 사정에 의해 사전 고지 없이 변동될 수 있습니다.</div></section>';
  }

  /* 이웃섬 주의 */
  if(T.pkg === 'combo'){
    h += '<section class="sec"><div class="sec-h"><div class="eyebrow">' + no() + '</div>' +
      '<h2>이웃섬 결합 시 확인사항</h2></div><div class="card"><ul class="list exc" style="list-style:none">' +
      COMBO_NOTE.map(function(x){ return '<li style="padding-left:12px">' + esc(x) + '</li>'; }).join('') +

  /* 꼭 확인 */
  h += '<section class="sec"><div class="note"><b>꼭 확인해 주세요</b><br>' +

  /* 저작권 */
  h += '<section class="sec"><div class="copybox"><b>저작권 안내</b>' +
    '<p>' + COPY.full + '</p><p style="color:var(--g400);font-size:12.5px">' + COPY.law + '</p>' +
    '<div class="copyline">' + COPY.line + '</div></div></section>';

  h += '<footer><span>' + COMPANY.name + ' ' + COMPANY.nameEn + ' · 담당 ' + COMPANY.staff +
    ' · ' + COMPANY.tel + '</span><br>' +
    '견적번호 ' + esc(T.no) + '<br>' +
    '본 견적서는 참고용이며 계약서를 대체하지 않습니다.<br>' +
    COMPANY.site + ' · ' + COMPANY.email +
    '<div class="foot-copy">' + COPY.line + '<br>' + COPY.short + '</div></footer>';

  $('app').innerHTML = h;
  document.title = 'PLANITTOUR 하와이 신혼여행 견적서' + (T.n ? ' · ' + T.n : '');
}

function route(){
  /* edit=1 이면 링크 내용을 불러와 제작 화면으로 */
  if(/[#?&]edit=1/.test(location.hash + location.search)){
    var T = unpackTrip();
    document.body.classList.add('builder');
    renderBuilder();
    if(T){
      sv('fn', T.n2 ? T.n2[0] : String(T.n || '').replace(/\s*님$/, ''));
      sv('fn2', T.n2 ? T.n2[1] : '');
      sv('qpax', T.pax);
      if(T.start) sv('depDate', ymd(T.start));
      sv('qno', T.no ? (T.no + '-R2') : defaultQno());
      sv('qvalid', T.valid || '');
      sv('fx', T.fx || FX_DEFAULT);
      if(T.staff) sv('staff', T.staff);
      renderPicked(); renderOptions(); renderAir(); renderLocalAir();
      syncNames(); onDep(); calc();
      setTimeout(function(){
        alert('견적을 불러왔습니다.\n\n' +
              '호텔 1박 요금과 마진은 다시 입력해 주세요.\n' +
              '요금은 링크에 담기지 않습니다.');
      }, 400);
    }
    return;
  }
  if(/[#?&]q=1/.test(location.hash + location.search)) renderQuote();
  else {
    document.body.classList.add('builder');
    renderBuilder();
    window.addEventListener('scroll', function(){ try{ syncNavActive(); }catch(e){} });
    var m = document.createElement('div');
    m.className = 'modal'; m.id = 'confirm';
    m.innerHTML = '<div class="sheet"><h3>발행 전 확인</h3>' +
      '<div class="sub">입력하신 내용을 확인해 주세요.</div>' +
      '<div id="cfBody"></div>' +
      '<div class="foot"><button type="button" class="cancel" onclick="closeConfirm()">돌아가서 수정</button>' +
      '<button type="button" class="ok" id="cfOk" onclick="doIssue()">확인했습니다, 발행</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){ if(e.target.id === 'confirm') closeConfirm(); });
  }
}
window.addEventListener('hashchange', function(){ location.reload(); });
route();
