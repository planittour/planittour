/* ── 픽업 · 투어 선택칸 생성 ── */


/* 선택한 투어 정보 조회 */
function findTourMeta(name){
  var out = null;
  Object.keys(TOURS).forEach(function(city){
    TOURS[city].forEach(function(t){
      if(city + ' · ' + t.n === name) out = {city: city, t: t};
    });
  });
  if(!out){
    TRANSFERS.forEach(function(t){ if(t.n === name) out = {city: t.city || '', t: {n: t.n, m: t.t, inc: '전용 차량 이동', exc: '', note: ''}}; });
  }
  if(!out){
    for(var ci = 0; ci < PLACED.length; ci++){
      if(PLACED[ci].custom && PLACED[ci].name === name){
        out = {city: '', t: {n: name, m: '', inc: '', exc: '', note: '', meal: ''}};
        break;
      }
    }
  }
  if(!out){
    Object.keys(SNAPS).forEach(function(c){
      if(c + ' · 스냅 촬영' === name)
        out = {city: c, t: {n: c + ' 스냅 촬영', m: SNAP_INFO.m, inc: SNAP_INFO.inc,
                            exc: SNAP_INFO.exc, note: SNAP_INFO.note}};
    });
  }
  return out;
}


/* ── 투어 날짜 경고 ── */

/* ══════════════════════════════════════════
   일정표 기반 투어 · 픽업 배치
   ══════════════════════════════════════════ */

/* 배치된 항목: [{day:0, name:'', group:'투어', price:0, city:''}] */
var PLACED = [];

function dateKey(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

/* 해당 날짜에 선택 가능한 투어·픽업 목록
   cities = 그날 관련된 도시 전부 (체크아웃 도시 + 이동 도착 도시) */
function availableFor(cities){
  var out = [], seen = {};
  cities.forEach(function(c){
    if(!c || seen[c]) return;
    seen[c] = 1;
    TRANSFERS.forEach(function(t){
      if(t.city !== c) return;
      out.push({n: t.n, g: '교통', p: t.p, m: t.t, city: c, key: t.n, label: '픽업 · ' + t.n});
    });
    if(TOURS[c]) TOURS[c].forEach(function(t){
      out.push({n: t.n, g: '투어', p: t.p, m: t.m, city: c, key: c + ' · ' + t.n,
                label: (cities.length > 1 ? '[' + c + '] ' : '') + t.n});
    });
    if(SNAPS[c]) out.push({n: c + ' 스냅 촬영', g: '스냅', p: SNAPS[c].p, m: SNAP_INFO.m,
                city: c, key: c + ' · 스냅 촬영', perRoom: true,
                label: (cities.length > 1 ? '[' + c + '] ' : '') + '스냅 촬영 (2인 기준)'});
  });
  return out;
}

/* 일정표 골격 생성 (투어 배치 전) */
function buildDays(){
  var plan = buildPlan();
  if(!plan.start) return null;
  var total = plan.rows.reduce(function(a, x){ return a + x.nights; }, 0);
  if(!total) return null;
  var days = [];
  for(var i = 0; i <= total; i++){
    var d = addDays(plan.start, i);
    var stayCity = '', fixed = [], moves = [], cities = [];
    plan.rows.forEach(function(x){
      if(!x.inDate) return;
      if(d >= x.inDate && d < x.outDate) stayCity = x.city;
      if(+d === +x.inDate) fixed.push({k:'숙박', t: x.city + ' 체크인' +
        (x.hotel ? ' · ' + hotelName(x.hotel) : ''), map: hotelName(x.hotel), city: x.city, order: 90});
      if(+d === +x.outDate) fixed.push({k:'숙박', t: x.city + ' 체크아웃', city: x.city, order: 0});
    });
    plan.legs.forEach(function(g){
      if(+d === +g.date){
        moves.push({k:'이동', t: g.from + ' → ' + g.to + ' 열차 이동', from: g.from, to: g.to});
        if(cities.indexOf(g.from) < 0) cities.push(g.from);
        if(cities.indexOf(g.to) < 0) cities.push(g.to);
      }
    });
    if(stayCity && cities.indexOf(stayCity) < 0) cities.unshift(stayCity);
    /* 항공 */
    var fl = readFlights();
    if(fl.out && +d === +fl.out.arrDate)
      fixed.push({k:'항공', t: flightLabel(fl.out) +
        (fl.out.to ? ' · ' + fl.out.to : '') + ' 도착' + (fl.out.arr ? ' ' + fl.out.arr : '') +
        (fl.out.memo ? ' · ' + fl.out.memo : ''), city: '', order: -10});
    if(fl.back && +d === +fl.back.date)
      fixed.push({k:'항공', t: flightLabel(fl.back) +
        (fl.back.from ? ' · ' + fl.back.from : '') + ' 출발' + (fl.back.dep ? ' ' + fl.back.dep : '') +
        ' · 한국 도착 ' + fmtDate(fl.back.arrDate) + (fl.back.arr ? ' ' + fl.back.arr : '') +
        (fl.back.memo ? ' · ' + fl.back.memo : ''), city: '', order: 95});
    if(!cities.length && i === total){
      var last = plan.rows.filter(function(x){ return x.nights > 0; }).pop();
      if(last) cities.push(last.city);
    }
    days.push({i: i + 1, d: d, key: dateKey(d), city: stayCity || (cities[0] || ''),
               cities: cities, fixed: fixed, moves: moves,
               isFirst: i === 0, isLast: i === total});
  }
  return {days: days, plan: plan};
}

/* 일정표 UI 렌더링 */
var __autoBusy = false;
function renderPlanner(){
  var host = document.getElementById('planner');
  if(!host) return;
  if(!__autoBusy){
    __autoBusy = true;
    try{ applyAutoPlace(); }catch(e){}
    __autoBusy = false;
  }
  var sc = buildDays();
  if(!sc){
    host.innerHTML = '<div class="empty-log">출발일과 도시별 박수를 입력하면 일정표가 만들어집니다</div>';
    return;
  }
  var validKeys = sc.days.map(function(x){ return x.key; });
  PLACED = PLACED.filter(function(p){ return validKeys.indexOf(p.key) > -1; });

  host.innerHTML = sc.days.map(function(x){
    /* 순서 조정 대상 = 이동 + 배치된 투어/픽업 */
    var mine = PLACED.filter(function(p){ return p.key === x.key; });
    var seq = [];
    x.moves.forEach(function(m, mi){ seq.push({type:'move', t: m.t, mi: mi}); });
    mine.forEach(function(p){ seq.push({type:'item', p: p, gi: PLACED.indexOf(p)}); });
    /* 저장된 순서 적용 */
    var ord = MOVE_ORDER[x.key];
    if(ord != null && seq.length > 1){
      var mv = seq.filter(function(e){ return e.type === 'move'; });
      var it = seq.filter(function(e){ return e.type === 'item'; });
      seq = [];
      for(var k = 0; k < it.length + mv.length; k++){
        if(k === ord && mv.length) seq = seq.concat(mv.splice(0, mv.length));
        if(it.length) seq.push(it.shift());
      }
      if(mv.length) seq = seq.concat(mv);
    }

    var avail = availableFor(x.cities);
    var warn = '';
    mine.forEach(function(p){
      var meta = findTourMeta(p.name);
      if(meta && meta.t.note && meta.t.note.indexOf('일요일 불가') > -1 && x.d.getDay() === 0)
        warn += '<div class="tw"><b>일요일 진행 불가</b>' + esc(p.name.split(' · ').pop()) + '</div>';
    });
    if(mine.length >= 3) warn += '<div class="tw"><b>일정 과밀</b>이 날 ' + mine.length + '건이 배치되어 있습니다</div>';

    var h = '<div class="pday"><div class="ph"><b>DAY ' + x.i + '</b>' +
      '<span>' + fmtDate(x.d) + '</span>' +
      '<em>' + esc(x.cities.join(' · ') || '자유') + '</em></div>';

    /* 항공 도착 · 체크아웃 먼저 */
    x.fixed.filter(function(e){ return e.order === -10; }).forEach(function(e){
      h += '<div class="pe fixed"><span class="qk air">항공</span><span class="pt">' + esc(e.t) + '</span></div>';
    });
    x.fixed.filter(function(e){ return e.order === 0; }).forEach(function(e){
      h += '<div class="pe fixed"><span class="qk stay">숙박</span><span class="pt">' + esc(e.t) + '</span></div>';
    });

    /* 순서 조정 영역 */
    seq.forEach(function(e, idx){
      var up = idx > 0, dn = idx < seq.length - 1;
      if(e.type === 'move'){
        h += '<div class="pe placed move-row"><span class="qk move">이동</span>' +
          '<span class="pt">' + esc(e.t) + '</span><span class="pb">' +
          '<button type="button" onclick="shiftMove(\'' + x.key + '\',-1)"' + (up ? '' : ' disabled') + '>↑</button>' +
          '<button type="button" onclick="shiftMove(\'' + x.key + '\',1)"' + (dn ? '' : ' disabled') + '>↓</button>' +
          '</span></div>';
      } else {
        var gk = e.p.group === '투어' ? 'tour' : (e.p.group === '스냅' ? 'snap' : 'move');
      var unit = (e.p.perRoom || e.p.group === '스냅') ? ' · 2인 기준 1건' : ' · 1인';
      h += '<div class="pe placed' + (e.p.auto ? ' auto' : '') + '"><span class="qk ' + gk + '">' +
          esc(e.p.group) + '</span><span class="pt">' + esc(e.p.name.split(' · ').pop()) +
          (e.p.auto ? '<b class="autotag">기본</b>' : '') +
          (e.p.custom ? '<b class="customtag">직접</b>' : '') +
          '<em>' + won(e.p.price) + unit + '</em></span><span class="pb">' +
          '<button type="button" onclick="movePlaced(' + e.gi + ',-1)"' + (up ? '' : ' disabled') + '>↑</button>' +
          '<button type="button" onclick="movePlaced(' + e.gi + ',1)"' + (dn ? '' : ' disabled') + '>↓</button>' +
          '<button type="button" class="rm" onclick="removePlaced(' + e.gi + ')">×</button>' +
          '</span></div>';
      }
    });

    /* 체크인 · 항공 출발 마지막 */
    x.fixed.filter(function(e){ return e.order === 90; }).forEach(function(e){
      h += '<div class="pe fixed"><span class="qk stay">숙박</span><span class="pt">' + esc(e.t) + '</span></div>';
    });
    x.fixed.filter(function(e){ return e.order === 95; }).forEach(function(e){
      h += '<div class="pe fixed"><span class="qk air">항공</span><span class="pt">' + esc(e.t) + '</span></div>';
    });

    h += warn;

    if(avail.length){
      var used = mine.map(function(p){ return p.name; });
      var opts = avail.filter(function(a){ return used.indexOf(a.key) < 0; });
      if(opts.length){
        h += '<div class="padd"><select onchange="addPlaced(\'' + x.key + '\', this)">' +
          '<option value="">투어 · 픽업 추가</option>' +
          opts.map(function(a){
            return '<option value="' + esc(a.key) + '" data-g="' + a.g + '" data-p="' + a.p +
              '" data-r="' + (a.perRoom ? '1' : '0') + '">' +
              esc(a.label) + ' (' + won(a.p) + (a.perRoom ? ' · 건당' : ' · 1인') + ')</option>';
          }).join('') + '</select></div>';
      }
    }
    h += '<button type="button" class="padd-custom" onclick="addCustom(\'' + x.key + '\')">' +
         '+ 투어 · 픽업 직접 추가</button>';
    return h + '</div>';
  }).join('');
}

/* 이동의 위치 (하루 안에서 몇 번째인지) */
var MOVE_ORDER = {};
function shiftMove(key, dir){
  var sc = buildDays();
  if(!sc) return;
  var day = sc.days.filter(function(x){ return x.key === key; })[0];
  if(!day) return;
  var items = PLACED.filter(function(p){ return p.key === key; }).length;
  var cur = MOVE_ORDER[key];
  if(cur == null) cur = 0;
  var next = cur + dir;
  if(next < 0) next = 0;
  if(next > items) next = items;
  MOVE_ORDER[key] = next;
  renderPlanner(); calc();
}

/* 등록되지 않은 사설 투어 · 픽업 직접 추가 */
function addCustom(key){
  var name = prompt('추가할 투어 또는 픽업 이름을 입력하세요\n예: 밀라노 공항 픽업, 사설 시내투어', '');
  if(name === null) return;
  name = name.trim();
  if(!name){ toast('이름을 입력해 주세요'); return; }
  var pStr = prompt('1인 원가를 입력하세요 (원)\n2인 기준 1건 요금이면 아래에서 바꾸실 수 있습니다', '');
  if(pStr === null) return;
  var price = Number(String(pStr).replace(/[^0-9]/g, '')) || 0;
  var gStr = prompt('구분을 입력하세요\n투어 / 교통 / 스냅 / 기타 중 하나', '투어');
  if(gStr === null) return;
  var g = ['투어','교통','스냅','기타'].indexOf(String(gStr).trim()) > -1 ? String(gStr).trim() : '투어';
  var perRoom = confirm('요금 단위를 확인해 주세요.\n\n확인 = 2인 기준 1건 요금 (인원수를 곱하지 않음)\n취소 = 1인 요금 (인원수를 곱함)');
  PLACED.push({key: key, name: name, group: g, price: price, perRoom: perRoom, custom: true});
  renderPlanner(); calc();
  toast('"' + name + '"을 추가했습니다');
}

function addPlaced(key, sel){
  if(!sel.value) return;
  var opt = sel.options[sel.selectedIndex];
  PLACED.push({key: key, name: sel.value, group: opt.getAttribute('data-g'),
               price: Number(opt.getAttribute('data-p')) || 0,
               perRoom: opt.getAttribute('data-r') === '1'});
  sel.value = '';
  renderPlanner(); calc();
}
function removePlaced(i){
  var p = PLACED[i];
  if(p && p.auto) markAutoRemoved(p.key, p.name);
  PLACED.splice(i, 1);
  renderPlanner(); calc();
}
function movePlaced(i, dir){
  var item = PLACED[i];
  var same = PLACED.filter(function(p){ return p.key === item.key; });
  var pos = same.indexOf(item);
  var target = same[pos + dir];
  if(!target) return;
  var ti = PLACED.indexOf(target);
  PLACED[i] = target; PLACED[ti] = item;
  renderPlanner(); calc();
}

/* 최종 일정 (견적서 전달용) */
function buildSchedule(){
  var sc = buildDays();
  if(!sc) return null;
  var days = sc.days.map(function(x){
    var ev = [];
    x.fixed.filter(function(e){ return e.order === -10; }).forEach(function(e){
      ev.push({k:'항공', t: e.t, map: ''});
    });
    x.fixed.filter(function(e){ return e.order === 0; }).forEach(function(e){
      ev.push({k:'숙박', t: e.t, map: ''});
    });
    var mine = PLACED.filter(function(p){ return p.key === x.key; });
    var seq = [];
    x.moves.forEach(function(m){ seq.push({type:'move', t: m.t}); });
    mine.forEach(function(p){ seq.push({type:'item', p: p}); });
    var ord = MOVE_ORDER[x.key];
    if(ord != null && seq.length > 1){
      var mv = seq.filter(function(e){ return e.type === 'move'; });
      var it = seq.filter(function(e){ return e.type === 'item'; });
      seq = [];
      for(var k = 0; k < it.length + mv.length; k++){
        if(k === ord && mv.length) seq = seq.concat(mv.splice(0, mv.length));
        if(it.length) seq.push(it.shift());
      }
      if(mv.length) seq = seq.concat(mv);
    }
    seq.forEach(function(e){
      if(e.type === 'move'){ ev.push({k:'이동', t: e.t, map: ''}); }
      else {
        var meta = findTourMeta(e.p.name);
        ev.push({k: e.p.group, t: e.p.name.split(' · ').pop(),
                 sub: meta && meta.t.m ? meta.t.m : '', map: ''});
      }
    });
    x.fixed.filter(function(e){ return e.order === 90; }).forEach(function(e){
      ev.push({k:'숙박', t: e.t, map: e.map || ''});
    });
    x.fixed.filter(function(e){ return e.order === 95; }).forEach(function(e){
      ev.push({k:'항공', t: e.t, map: ''});
    });
    return {i: x.i, d: x.d, city: x.cities.join(' · ') || x.city, ev: ev};
  });
  return {days: days};
}

/* ── 전체 계산 ── */
function calc(){
  var pax = Number(document.getElementById('qpax').value) || 1;
  var plan = buildPlan();
  var cost = 0, lines = [];

  /* 숙박 — 객실 요금 (2인 1실 기준). 객실수 = 인원 ÷ 2 올림 */
  var rooms = Math.ceil(pax / 2);
  plan.rows.forEach(function(x){
    var row = document.querySelector('#stayrows .stayrow[data-leg="' + x.id + '"]');
    var sa = row ? row.querySelector('.sa') : null;
    if(!x.nights || !x.cost){ if(sa) sa.textContent = ''; return; }
    var amt = x.nights * x.cost * rooms;
    cost += amt;
    /* 입력한 총액과 같으면 굳이 다시 보여주지 않습니다.
       객실이 둘 이상일 때만 실제 청구액을 표시합니다. */
    if(sa) sa.textContent = (rooms > 1) ? won(amt) : '';
    lines.push({g:'숙박', d: x.city + ' ' + x.nights + '박' + (stayHotel(x) ? ' · ' + stayHotel(x) : '') +
                   (x.meal ? ' · ' + mealShort(x.meal) : ''),
                q: x.nights, unit: x.cost, amt: amt});
  });

  /* 열차 — 1인 요금 × 인원 */
  Array.prototype.forEach.call(document.querySelectorAll('#trainrows .legrow'), function(r, i){
    var f = Number(r.querySelector('input').value) || 0;
    var amt = f * pax;
    cost += amt;
    r.querySelector('.la').textContent = won(amt);
    if(f && plan.legs[i]) lines.push({g:'교통', d: plan.legs[i].from + ' → ' + plan.legs[i].to +
      ' ' + fmtDate(plan.legs[i].date), q: pax, unit: f, amt: amt, per: true});
  });

  /* 픽업 · 투어 — 일정표에 배치된 항목, 1인 요금 × 인원 */
  var picked = [];
  PLACED.forEach(function(p){
    /* 스냅은 2인 기준 촬영 1건 요금 — 인원수를 곱하지 않습니다 */
    var perRoom = p.perRoom || p.group === '스냅';
    var amt = perRoom ? p.price : p.price * pax;
    cost += amt;
    lines.push({g: p.group, d: p.name.split(' · ').pop() + ' (' + fmtKey(p.key) + ')',
                q: perRoom ? 1 : pax, unit: p.price, amt: amt});
    picked.push({name: p.name, date: p.key, group: p.group, price: p.price, perRoom: perRoom});
  });

  /* 트립 컨시어지 — 모든 견적에 기본 포함 */
  var cgAmt = CONCIERGE.price * pax;
  cost += cgAmt;
  lines.push({g:'서비스', d: CONCIERGE.name, q: pax, unit: CONCIERGE.price, amt: cgAmt, per: true});

  /* 기타 직접 입력 */
  Array.prototype.forEach.call(document.querySelectorAll('#etcrows .row'), function(r){
    var el = r.querySelectorAll('select,input');
    var d = el[1].value.trim(), q = Number(el[2].value) || 0, u = Number(el[3].value) || 0;
    var amt = q * u;
    if(!d && !amt) return;
    cost += amt;
    r.querySelector('.ea').textContent = won(amt);
    lines.push({g: el[0].value, d: d, q: q, unit: u, amt: amt, per: false});
  });

  /* 마진 — 1인 기준 통합 */
  var mper = Number(document.getElementById('mper').value) || 0;
  var margin = mper * pax;
  var sale = cost + margin;

  /* 항공료 — 1인 요금 × 인원 · 지상비와 분리해 계산합니다 */
  var airPer = Number((document.getElementById('airFare') || {}).value) || 0;
  var airTotal = airPer * pax;

  document.getElementById('mperlabel').textContent = won(mper);
  document.getElementById('icost').textContent = won(cost);
  var ih = document.getElementById('ihotel'); if(ih) ih.textContent = won(hotelCost);
  var ie = document.getElementById('iexh'); if(ie) ie.textContent = won(exHotel);
  var icg = document.getElementById('icg');
  if(icg) icg.textContent = won(cgAmt) + ' (1인 ' + won(CONCIERGE.price) + ')';
  document.getElementById('imargin').textContent = won(margin);
  document.getElementById('isale').textContent = won(sale);
  var ar = document.getElementById('iairrow'), tr = document.getElementById('itotrow');
  if(ar && tr){
    if(airTotal){
      ar.style.display = ''; tr.style.display = '';
      document.getElementById('iair').textContent = won(airTotal) + ' (1인 ' + won(airPer) + ')';
      document.getElementById('itot').textContent = won(sale + airTotal);
    } else { ar.style.display = 'none'; tr.style.display = 'none'; }
  }
  document.getElementById('irate').textContent = cost ? (Math.round(margin / cost * 1000) / 10) + '%' : '0%';
  /* 숙박 소계 · 호텔 제외 금액 */
  var hotelCost = 0;
  lines.forEach(function(l){ if(l.g === '숙박') hotelCost += l.amt; });
  var exHotel = cost - hotelCost;
  var ss = document.getElementById('staysum');
  if(ss){
    ss.innerHTML = hotelCost
      ? '<div class="ss-row"><span>호텔 총액</span><b>' + won(hotelCost) + '</b></div>' +
        '<div class="ss-row sub"><span>호텔 제외 원가</span><b>' + won(exHotel) + '</b></div>'
      : '';
  }
  document.getElementById('icostp').textContent = won(Math.round(cost / pax));
  document.getElementById('imarginp').textContent = won(mper);
  document.getElementById('isalep').textContent = won(Math.round(sale / pax));
  document.getElementById('sumall').textContent = won(sale);
  document.getElementById('sumper').textContent = won(Math.round(sale / pax));
  var nights = plan.rows.reduce(function(a, x){ return a + x.nights; }, 0);
  var dur = tripDuration();
  var fl = readFlights();
  var spanTxt = '항공 일정과 박수를 입력해 주세요';
  if(fl.out && fl.back){
    spanTxt = fmtDate(fl.out.date) + ' 한국 출발 ~ ' + fmtDate(fl.back.arrDate) + ' 한국 도착 · ' + dur.label;
  } else if(plan.start && nights){
    spanTxt = fmtDate(plan.start) + ' ~ ' + fmtDate(plan.end) + ' · ' + nights + '박 ' + (nights + 1) + '일';
  }
  document.getElementById('tripspan').textContent = spanTxt;
  var ss2 = document.getElementById('startShow');
  if(ss2){
    ss2.textContent = plan.start
      ? (fmtDate(plan.start) + (START_MANUAL ? ' · 직접 지정' : ' · 항공 도착일 기준'))
      : '가는 편을 입력하면 자동 설정됩니다';
  }
  var fi = document.getElementById('foutInfo');
  if(fi) fi.innerHTML = fl.out
    ? flightLabel(fl.out) + ' · 현지 도착 <b>' + fmtDate(fl.out.arrDate) +
      (fl.out.arr ? ' ' + fl.out.arr : '') + '</b>'
    : '스케줄을 불러오거나 직접 입력하세요';
  var fi2 = document.getElementById('finInfo');
  if(fi2) fi2.innerHTML = fl.back
    ? flightLabel(fl.back) + ' · 한국 도착 <b>' + fmtDate(fl.back.arrDate) +
      (fl.back.arr ? ' ' + fl.back.arr : '') + '</b>'
    : '스케줄을 불러오거나 직접 입력하세요';


  try{ syncRequired(); }catch(e){}
  var hc = 0;
  lines.forEach(function(l){ if(l.g === '숙박') hc += l.amt; });
  try{ syncTopbar({cost: cost, margin: margin, sale: sale, pax: pax, rooms: rooms,
                   airPer: airPer, airTotal: airTotal}); }catch(e){}
  try{ syncNavStatus(); }catch(e){}
  return {cost: cost, margin: margin, sale: sale, lines: lines, plan: plan,
          pax: pax, nights: nights, picked: picked, rooms: rooms,
          hotelCost: hc, exHotel: cost - hc,
          airPer: airPer, airTotal: airTotal,
          total: sale + airTotal, perTotal: (sale + airTotal) / pax};
}

/* ── 고객 견적서용 항목 (마진을 각 항목에 비례 배분) ── */
function customerItems(r){
  if(!r.lines.length) return [];
  var out = r.lines.map(function(x){
    var share = r.cost ? x.amt / r.cost : 0;
    return {g: x.g, d: x.d, q: 1, p: Math.round(x.amt + r.margin * share)};
  });
  /* 반올림 오차를 마지막 항목에서 보정 */
  var diff = r.sale - out.reduce(function(a, x){ return a + x.p; }, 0);
  if(diff && out.length) out[out.length - 1].p += diff;
  return out;
}



/* ── 이미지 갤러리 ── PC는 나란히, 모바일은 좌우 스와이프 */
var galId = 0;
function gallery(list, alt){
  if(!list || !list.length) return '';
  var id = 'g' + (++galId);
  var h = '<div class="gal" id="' + id + '"><div class="galtrack">';
  list.forEach(function(src, i){
    h += '<figure class="galitem"><img src="' + src + '" alt="' + esc(alt) +
      '" loading="lazy" onerror="galFail(this)"></figure>';
  });
  h += '</div><div class="galdots"></div></div>';
  return h;
}
/* 없는 이미지는 통째로 제거하고, 전부 없으면 자리 표시 */
function galFail(img){
  var item = img.parentNode;
  var gal = item.parentNode.parentNode;
  item.parentNode.removeChild(item);
  var track = gal.querySelector('.galtrack');
  if(!track || !track.children.length){
    gal.innerHTML = '<div class="ph"><b>이미지 자리</b><span>' +
      esc(img.getAttribute('src')) + '</span></div>';
    gal.classList.add('galempty');
    return;
  }
  syncDots(gal);
}
function syncDots(gal){
  var track = gal.querySelector('.galtrack');
  var dots = gal.querySelector('.galdots');
  if(!track || !dots) return;
  var n = track.children.length;
  gal.setAttribute('data-n', n);
  if(n < 2){ dots.innerHTML = ''; return; }
  var html = '';
  for(var i = 0; i < n; i++) html += '<i' + (i === 0 ? ' class="on"' : '') + '></i>';
  dots.innerHTML = html;
  if(!track.__bound){
    track.__bound = true;
    track.addEventListener('scroll', function(){
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      var ds = dots.querySelectorAll('i');
      for(var k = 0; k < ds.length; k++) ds[k].className = (k === idx ? 'on' : '');
    });
  }
}
function initGalleries(){
  document.querySelectorAll('.gal').forEach(function(g){
    if(!g.classList.contains('galempty')) syncDots(g);
  });
}

      var t = document.getElementById(a.getAttribute('href').slice(1));
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});

  });
  if(isAdmin()){
