  1: "<div class=\"wrap\">\n\n<header class=\"stub\">\n  <div class=\"stub-top\">\n    <span class=\"mono\">1단계 · 상담과 계약</span>\n    <span class=\"mono\">총 4단계 중 1번째</span>\n  </div>\n  <h1>유럽 신혼여행<br><em>상담·계약 안내서</em></h1>\n  <div class=\"when\"><b>이럴 때 보세요</b>계약을 결정하기 전, 어느 나라 어느 도시를 갈지 정하는 단계에서 보세요</div>\n  <figure class=\"shot wide\"><span class=\"box\"><img src=\"images/hero.jpg\" alt=\"유럽 신혼여행\" loading=\"lazy\" onerror=\"imgFail(this)\"></span></figure>\n  <p class=\"lede\">저희가 어디까지 예약하고 발권해 드리는지, 국가와 도시별로 무엇을 알아야 하는지, 요금은 어떻게 구성되고 계약은 어떤 순서로 진행되는지 담았습니다.</p>\n  <div class=\"route\">\n    <div class=\"route-line\">\n      <div class=\"rt on\"><span>상담·계약</span></div>\n      <div class=\"rt\"><span>예약 직후</span></div>\n      <div class=\"rt\"><span>출발 전</span></div>\n      <div class=\"rt\"><span>여행 중</span></div>\n    </div>\n  </div>\n</header>\n\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-in\">\n    <a href=\"#scope\">준비 범위</a>\n    <a href=\"#how\">여행 방식</a>\n    <a href=\"#cities\">국가 · 도시</a>\n    <a href=\"#design\">일정 설계</a>\n    <a href=\"#price\">요금 구조</a>\n    <a href=\"#process\">계약 절차</a>\n    <a href=\"#diff\">저희의 방식</a>\n    <a href=\"#faq\">자주 묻는 질문</a>\n  </div>\n</nav>\n\n<!-- 1. 준비 범위 -->\n<section class=\"sec\" id=\"scope\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">01</div>\n    <h2>어디까지 저희가 준비하나요</h2>\n    <p>계약 시점에 가장 많이 갈리는 부분입니다. 포함되는 것과 두 분이 직접 하시는 것을 먼저 명확히 하겠습니다.</p>\n  </div>\n\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <h3>저희가 예약하고 발권합니다</h3>\n      <ul class=\"list inc\">\n        <li>전 일정 호텔 · 숙소 예약과 확정</li>\n        <li>도시 간 열차 (좌석 지정 포함)</li>\n        <li>장거리 버스 · 페리</li>\n        <li>유럽 내 구간 항공</li>\n        <li>선택하신 도시의 현지 가이드 미팅</li>\n        <li>필요 시 사전 예약이 필요한 입장권 <span class=\"todo\">회사 정책 확인</span></li>\n      </ul>\n    </div>\n    <div class=\"card\">\n      <h3>두 분이 직접 하시는 부분</h3>\n      <ul class=\"list exc\">\n        <li>한국 출발 · 귀국 국제선 항공권 <span class=\"todo\">취급 여부 확인</span></li>\n        <li>여권, 영국 ETA 등 입국 허가 신청</li>\n        <li>여행자보험 가입</li>\n        <li>도시 안에서의 하루 동선과 식사</li>\n        <li>도시 내 대중교통 · 택시 요금</li>\n        <li>가이드 미팅을 신청하지 않은 도시의 관광</li>\n      </ul>\n    </div>\n  </div>\n\n  <div class=\"note\" style=\"margin-top:12px\">일정표에 적힌 <strong>이동 수단은 모두 확정 발권 상태</strong>로 전달됩니다. 출발 당일 역에서 표를 사거나 좌석을 찾아 헤매실 일이 없도록, 좌석 번호까지 확정한 문서를 3단계(출발 전 최종서류)에서 드립니다.</div>\n</section>\n\n<!-- 2. 여행 방식 -->\n<section class=\"sec\" id=\"how\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">02</div>\n    <h2>자유롭게, 다만 이동은 확정된 채로</h2>\n    <p>두 분의 여행이 실제로 어떻게 흘러가는지 하루 단위로 설명드립니다.</p>\n  </div>\n\n  <details>\n    <summary><span class=\"sm-lab\">하루가 어떻게 구성되나요<small>기상부터 취침까지의 실제 흐름</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <p><strong>이동이 있는 날</strong>은 열차 시각이 하루의 기준점이 됩니다. 출발 시각과 역 이름, 좌석까지 확정되어 있으니 그 시각만 맞추시면 됩니다. 체크아웃 후 짐을 역 물품보관함에 맡기고 오전을 더 쓰시는 방법도 안내드립니다.</p>\n      <p><strong>머무는 날</strong>은 전부 두 분의 시간입니다. 가이드 미팅을 신청하신 도시라면 오전 또는 오후에 약속된 장소에서 가이드를 만나고, 이후 시간은 자유입니다.</p>\n    </div>\n  </details>\n\n  <details>\n    <summary><span class=\"sm-lab\">현지 가이드 미팅은 어떤 방식인가요<small>선택하신 도시에서만 진행됩니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <p>가이드가 두 분의 전 일정을 따라다니는 방식이 아닙니다. <strong>도시별로 신청하신 시간에만</strong> 정해진 장소에서 만나 함께 이동합니다.</p>\n      <ul class=\"list\">\n        <li>미팅 장소와 시각, 가이드 이름과 연락처는 3단계 최종서류에 명시됩니다</li>\n        <li>진행 시간과 동선은 도시마다 다릅니다 <span class=\"todo\">도시별 상세 작성</span></li>\n        <li>미팅이 끝난 뒤의 일정은 다시 자유입니다</li>\n        <li>가이드를 만나지 못했을 때의 대처는 4단계 문서에 별도로 정리되어 있습니다</li>\n      </ul>\n    </div>\n  </details>\n\n  <details>\n    <summary><span class=\"sm-lab\">이 방식이 맞는 분, 맞지 않는 분<small>솔직하게 말씀드립니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <p><strong>잘 맞습니다</strong> — 둘만의 시간을 충분히 갖고 싶고, 하루 일정을 스스로 정하고 싶으신 경우. 다만 열차 예매나 호텔 검증처럼 실수하면 손해가 큰 부분은 맡기고 싶으신 경우.</p>\n      <p><strong>다시 생각해 보셔야 합니다</strong> — 모든 이동에 동행자가 있기를 원하시거나, 현지에서 스스로 길을 찾는 상황 자체가 부담스러우신 경우. 이때는 인솔자 동행 상품을 권해드립니다.</p>\n    </div>\n  </details>\n</section>\n\n<!-- 3. 국가 · 도시 -->\n<section class=\"sec\" id=\"cities\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">03</div>\n    <h2>국가별 · 도시별 안내</h2>\n    <p>국가를 고르시면 도시 목록이 열립니다. 도시를 누르면 추천 체류일과 이동 특성, 신혼여행 관점의 포인트를 보실 수 있습니다.</p>\n  </div>\n  <div class=\"country-tabs\" id=\"ctabs\"></div>\n  <div id=\"citylist\"></div>\n</section>\n\n<!-- 4. 일정 설계 -->\n<section class=\"sec\" id=\"design\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">04</div>\n    <h2>일정을 짤 때 저희가 지키는 기준</h2>\n    <p>도시를 몇 개 넣느냐보다, 어떻게 잇느냐가 여행의 만족도를 결정합니다.</p>\n  </div>\n\n  <details>\n    <summary><span class=\"sm-lab\">도시 수와 체류일<small>가장 흔한 후회 지점</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <ul class=\"list\">\n        <li><strong>1박짜리 도시는 최소화합니다.</strong> 체크인·체크아웃과 짐 이동에 반나절이 사라집니다</li>\n        <li>대도시는 2박 이상, 소도시는 1~2박을 기본으로 봅니다</li>\n        <li>이동일은 하루 1구간을 원칙으로 하고, 연속 이동은 피합니다</li>\n        <li>여행 후반부에 짧은 휴식 도시를 배치하면 체력이 유지됩니다</li>\n      </ul>\n    </div>\n  </details>\n\n  <details>\n    <summary><span class=\"sm-lab\">이동 수단을 고르는 기준<small>열차 · 버스 · 페리 · 구간 항공</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <p>단순히 빠른 수단이 아니라 <strong>역·공항 접근 시간과 짐 이동까지 더한 실제 소요</strong>로 비교합니다. 공항 이동과 수속을 더하면 항공편이 오히려 느린 구간이 많습니다.</p>\n      <ul class=\"list\">\n        <li>고속열차 구간은 좌석 지정이 필수인 경우가 많아 조기 확정이 유리합니다</li>\n        <li>야간 이동은 신혼여행 특성상 기본적으로 권하지 않습니다</li>\n        <li>남부 이탈리아나 스페인 일부 구간은 버스가 더 합리적일 수 있습니다</li>\n      </ul>\n    </div>\n  </details>\n\n  <details>\n    <summary><span class=\"sm-lab\">시즌별 특성<small>같은 도시도 계절에 따라 완전히 다릅니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n    <div class=\"dbody\">\n      <p><span class=\"todo\">시즌별 상세 작성 예정</span></p>\n      <ul class=\"list\">\n        <li>여름 성수기 — 남유럽 폭염과 인파, 숙박비 상승</li>\n        <li>겨울 — 알프스 산악 구간의 운행 축소와 일몰 시각</li>\n        <li>봄·가을 — 가장 안정적이나 조기 예약 경쟁</li>\n        <li>현지 공휴일과 파업 가능성 <span class=\"todo\">국가별 정리</span></li>\n      </ul>\n    </div>\n  </details>\n</section>\n\n<!-- 5. 요금 구조 -->\n<section class=\"sec\" id=\"price\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">05</div>\n    <h2>요금은 이렇게 구성됩니다</h2>\n    <p>금액은 일정과 시즌에 따라 달라지므로 견적서에 별도로 안내드립니다. 여기서는 구조만 설명드립니다.</p>\n  </div>\n  <div class=\"card\">\n    <dl class=\"kv\">\n      <div><dt>숙박</dt><dd>도시 · 등급 · 객실 타입에 따라 산정 <span class=\"todo\">등급 기준 작성</span></dd></div>\n      <div><dt>이동</dt><dd>열차 · 버스 · 페리 · 구간 항공 실비와 발권 수수료</dd></div>\n      <div><dt>가이드</dt><dd>신청하신 도시의 미팅 건수 기준</dd></div>\n      <div><dt>대행료</dt><dd>일정 설계와 예약 관리에 대한 수수료 <span class=\"todo\">기준 작성</span></dd></div>\n      <div><dt>불포함</dt><dd>식사, 도시 내 교통, 입장료, 보험, 개인 경비</dd></div>\n    </dl>\n  </div>\n  <div class=\"warn\" style=\"margin-top:12px\">항공권과 열차 요금은 <strong>예약 시점의 잔여 좌석에 따라 변동</strong>합니다. 견적 금액은 확정 발권 전까지 보장되지 않으며, 확정 시점의 실제 요금으로 정산됩니다.</div>\n</section>\n\n<!-- 6. 계약 절차 -->\n<section class=\"sec\" id=\"process\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">06</div>\n    <h2>계약부터 출발까지</h2>\n    <p>지금 어느 단계에 계신지, 다음에 무엇이 일어나는지 알 수 있도록 정리했습니다.</p>\n  </div>\n  <div class=\"card\">\n    <ol class=\"steps\">\n      <li><strong>상담과 일정 초안</strong> — 희망 도시, 기간, 예산, 여행 스타일을 확인하고 초안을 드립니다</li>\n      <li><strong>일정 확정과 계약</strong> — 계약금 입금 후 예약 작업이 시작됩니다 <span class=\"todo\">계약금 비율 작성</span></li>\n      <li><strong>예약 진행</strong> — 호텔과 교통편을 순차 확정하고 진행 상황을 공유드립니다</li>\n      <li><strong>2단계 안내문 발송</strong> — 미리 준비하실 사항을 정리해 보내드립니다</li>\n      <li><strong>잔금과 발권</strong> — 잔금 확인 후 최종 발권을 완료합니다 <span class=\"todo\">잔금 기한 작성</span></li>\n      <li><strong>3단계 최종서류 발송</strong> — 좌석 번호까지 담긴 확정 문서를 드립니다</li>\n      <li><strong>출발, 그리고 여행 중 지원</strong> — 4단계 문서와 비상 연락 체계가 가동됩니다</li>\n    </ol>\n  </div>\n  <div class=\"note\" style=\"margin-top:12px\">취소와 변경 규정은 항공사·호텔·철도사마다 다릅니다. <strong>계약 전에 예약 건별 취소 규정을 별도 문서로 안내</strong>드리며, 동의하신 뒤에 예약을 진행합니다. <span class=\"todo\">약관 문서 연결</span></div>\n</section>\n\n<!-- 7. 차별점 -->\n<section class=\"sec\" id=\"diff\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">07</div>\n    <h2>저희가 일하는 방식</h2>\n  </div>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>담당자 한 명이 끝까지</h3><p>상담한 담당자가 발권과 출발 전 서류, 여행 중 대응까지 그대로 맡습니다. 매번 처음부터 설명하지 않으셔도 됩니다.</p></div>\n    <div class=\"card\"><h3>발권 전 이중 확인</h3><p>날짜, 이름 철자, 역 이름, 좌석 등급을 발권 전에 다시 확인합니다. 유럽 열차는 발권 후 이름 변경이 불가능한 경우가 많습니다.</p></div>\n    <div class=\"card\"><h3>여행 중 연락 가능</h3><p>시차를 감안한 연락 체계를 운영합니다. <span class=\"todo\">운영 시간과 채널 작성</span></p></div>\n    <div class=\"card hi\"><h3>트립 컨시어지 서비스</h3><p>항공 지연이나 호텔 체크인 문제처럼 <strong>여행 중 예상치 못한 상황</strong>이 생기면 카카오톡으로 바로 연락 주세요. 영어 · 스페인어 · 프랑스어 · 이탈리아어로 현지 업체와의 소통까지 지원합니다. <strong>모든 일정에 기본 포함</strong>됩니다.</p></div>\n    <div class=\"card\"><h3>단계별 안내 문서</h3><p>지금 보고 계신 문서를 포함해 네 단계로 나누어 필요한 시점에 필요한 정보만 드립니다.</p></div>\n  </div>\n</section>\n\n<!-- 8. FAQ -->\n<section class=\"sec\" id=\"faq\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">08</div>\n    <h2>자주 묻는 질문</h2>\n  </div>\n  <div class=\"tools\">\n    <button onclick=\"allDetails(true)\">모두 펼치기</button>\n    <button onclick=\"allDetails(false)\">모두 접기</button>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">유럽 여행에 비자가 필요한가요</span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>대한민국 여권 소지자는 관광 목적의 단기 체류에 대해 별도 비자가 필요하지 않습니다. 다만 <strong>비자와는 별개인 사전 입국 허가 제도</strong>가 있습니다.</p>\n    <ul class=\"list\">\n      <li><strong>영국 ETA</strong> — 2026년 2월 25일부터 의무화되었습니다. 신청은 영국 정부 공식 사이트 gov.uk/eta 또는 UK ETA 앱에서 하시며, 미취득 시 탑승이 거부될 수 있습니다</li>\n      <li><strong>ETIAS</strong> — 솅겐 지역 사전 여행 허가 제도로, 2026년 하반기 도입이 예고되어 있으나 시행일이 여러 차례 조정되어 왔습니다. 현재 기준 최신 상태를 계약 시점에 다시 확인해 드립니다</li>\n    </ul>\n    <div class=\"warn\">ETIAS 신청을 대행한다고 주장하는 사설 사이트는 사기일 수 있습니다. 공식 창구 외에는 이용하지 마십시오.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">일정을 계약 후에 바꿀 수 있나요</span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><p>예약 확정 전이라면 대부분 조정 가능합니다. 확정 이후에는 각 예약처의 규정에 따라 수수료가 발생할 수 있습니다. 변경 가능성이 있는 구간은 계약 단계에서 미리 알려주시면 취소 규정이 유연한 상품으로 예약해 드립니다.</p></div></details>\n\n  <details><summary><span class=\"sm-lab\">영어를 못하는데 괜찮을까요</span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><p>체크인과 열차 탑승은 예약 확인서를 보여드리는 것으로 대부분 해결됩니다. 4단계 문서에 상황별로 그대로 보여드릴 수 있는 문장과 현지어 표현을 함께 담아 드립니다.</p></div></details>\n\n  <details><summary><span class=\"sm-lab\">호텔에 신혼여행이라고 알려주시나요</span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><p>예약 시 허니문임을 전달하고 가능한 범위에서 요청을 넣습니다. 다만 <strong>객실 업그레이드나 어메니티는 호텔 재량</strong>이라 확약해 드릴 수 없습니다. 확약이 필요하시면 유료 옵션이 있는 호텔로 안내드립니다.</p></div></details>\n\n  <details><summary><span class=\"sm-lab\">여행 중 문제가 생기면 어떻게 하나요</span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><p>4단계 문서에 상황별 대응 절차를 정리해 드립니다. 아플 때, 열차가 지연되거나 놓쳤을 때, 가이드를 만나지 못했을 때, 분실·도난 상황까지 각각의 첫 행동이 무엇인지 명시되어 있습니다. 유럽 전역 공통 긴급번호는 <strong>112</strong>입니다.</p></div></details>\n</section>\n\n<footer>\n  <span class=\"mono\">Stage 01 of 04 — 상담 · 계약</span>\n  이 문서는 계약 검토용 안내자료입니다. 실제 예약 내용과 금액은 개별 견적서와 계약서를 따릅니다.<br>\n  플래닛투어 PLANITTOUR · <a href=\"tel:0424717742\">042-471-7742</a><div class=\"foot-copy\">\u00A9 2026 플래닛투어 (PLANITTOUR). All rights reserved.<br>본 자료의 무단 복제 · 배포 · 재가공을 금하며, 위반 시 저작권법에 따른 법적 조치가 취해질 수 있습니다.</div> <span class=\"todo\">관광사업 등록번호 추가</span>\n</footer>\n\n</div>",
  2: "<div class=\"wrap\">\n\n<header class=\"stub\">\n  <div class=\"stub-top\"><span class=\"mono\">2단계 · 예약 직후</span><span class=\"mono\">총 4단계 중 2번째</span></div>\n  <h1>예약 완료 후<br><em>준비 안내서</em></h1>\n  <div class=\"when\"><b>이럴 때 보세요</b>계약과 예약이 끝난 직후부터 출발 2주 전까지, 시기가 될 때마다 보세요</div>\n  <p class=\"lede\">여권과 입국 허가, 보험, 결제 수단, 통신, 짐 준비를 출발일 기준으로 정리했습니다. 지금 전부 하실 필요는 없습니다. 해당 시점이 되면 그 부분만 열어보시면 됩니다.</p>\n  <div class=\"route\">\n    <div class=\"route-line\">\n      <div class=\"rt\"><span>상담·계약</span></div>\n      <div class=\"rt on\"><span>예약 직후</span></div>\n      <div class=\"rt\"><span>출발 전</span></div>\n      <div class=\"rt\"><span>여행 중</span></div>\n    </div>\n  </div>\n</header>\n\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-in\">\n    <a href=\"#now\">지금 바로</a>\n    <a href=\"#timeline\">준비 일정</a>\n    <a href=\"#entry\">여권 · 입국허가</a>\n    <a href=\"#insure\">보험 · 건강</a>\n    <a href=\"#money\">결제 · 통신</a>\n    <a href=\"#pack\">짐 준비</a>\n    <a href=\"#honey\">신혼여행 요청</a>\n    <a href=\"#recheck\">다시 확인</a>\n  </div>\n</nav>\n\n<!-- 지금 바로 -->\n<section class=\"sec\" id=\"now\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">01</div>\n    <h2>오늘 5분만 확인해 주세요</h2>\n    <p>나머지는 천천히 하셔도 되지만, 이 세 가지는 지금 확인하셔야 나중에 비용이 발생하지 않습니다.</p>\n  </div>\n\n  <div class=\"card\">\n    <h3>1 · 여권 영문 이름과 예약자 이름이 같은가요</h3>\n    <p>항공권과 열차표는 <strong>여권과 철자가 하나라도 다르면 탑승이 거부</strong>될 수 있고, 발권 후에는 이름 수정이 불가능하거나 재발권 비용이 발생합니다. 여권을 직접 펼쳐서 확인해 주세요. 결혼으로 영문 성을 바꾸실 계획이라면 지금 알려주셔야 합니다.</p>\n  </div>\n  <div class=\"card\">\n    <h3>2 · 여권 유효기간이 충분한가요</h3>\n    <p>귀국일 기준으로 <strong>최소 6개월 이상</strong> 남아 있는 것을 권장합니다. 재발급이 필요하다면 지금 시작하셔야 합니다.</p>\n  </div>\n  <div class=\"card\">\n    <h3>3 · 영국 일정이 있다면 ETA를 확인해 주세요</h3>\n    <p>영국은 솅겐 지역이 아니며, 2026년 2월 25일부터 <strong>전자여행허가(ETA)가 의무화</strong>되었습니다. 미취득 시 항공기와 유로스타 탑승이 거부될 수 있습니다. 아래 여권·입국허가 항목에 신청 방법을 정리했습니다.</p>\n  </div>\n</section>\n\n<!-- 타임라인 -->\n<section class=\"sec\" id=\"timeline\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">02</div>\n    <h2>출발일까지의 준비 일정</h2>\n    <p>남은 기간에 해당하는 칸만 보시면 됩니다.</p>\n  </div>\n\n  <div class=\"tl\">\n    <div class=\"tl-item\"><span class=\"dday\">D-90</span>\n      <details><summary><span class=\"sm-lab\">여권과 입국 허가 정리<small>가장 먼저 끝내두면 마음이 편한 항목</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\"><ul class=\"list\">\n        <li>여권 유효기간과 영문 이름 확인, 필요 시 재발급 신청</li>\n        <li>영국 일정이 있으면 ETA 신청</li>\n        <li>여권 사본과 사진을 부부 각자의 휴대폰에 저장</li>\n      </ul></div></details>\n    </div>\n\n    <div class=\"tl-item\"><span class=\"dday\">D-60</span>\n      <details><summary><span class=\"sm-lab\">보험과 건강 준비<small>지병이나 상비약이 있으시면 이때</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\"><ul class=\"list\">\n        <li>여행자보험 가입 (보상 범위와 휴대품 한도 확인)</li>\n        <li>복용 중인 약이 있다면 여유분과 영문 처방전 준비</li>\n        <li>치과 등 미뤄둔 진료는 출발 전에 마무리</li>\n      </ul></div></details>\n    </div>\n\n    <div class=\"tl-item\"><span class=\"dday\">D-45</span>\n      <details><summary><span class=\"sm-lab\">일정 변경 희망 사항 알려주기<small>이 시점을 넘기면 수수료가 커집니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\">\n        <p>날짜, 도시 순서, 객실 타입, 가이드 미팅 추가 등 바꾸고 싶으신 부분이 있다면 지금 말씀해 주세요. 확정 발권 이후에는 예약처 규정에 따라 취소 수수료가 발생합니다.</p>\n        <p><span class=\"todo\">회사별 변경 마감 기준일 작성</span></p>\n      </div></details>\n    </div>\n\n    <div class=\"tl-item\"><span class=\"dday\">D-30</span>\n      <details><summary><span class=\"sm-lab\">결제 수단과 통신 준비<small>카드 한 장만 들고 가지 마세요</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\"><ul class=\"list\">\n        <li>해외 결제 가능 카드 2장 이상 준비, 각자 나눠서 소지</li>\n        <li>카드사에 해외 사용 예정 등록 (사용이 차단되는 경우가 있습니다)</li>\n        <li>eSIM 또는 로밍 선택하고 설치 방법 확인</li>\n        <li>소액 현금 환전</li>\n      </ul></div></details>\n    </div>\n\n    <div class=\"tl-item\"><span class=\"dday\">D-21</span>\n      <details><summary><span class=\"sm-lab\">잔금 납부와 최종 발권<small>저희 쪽 작업이 마무리되는 시점</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\"><p>잔금 확인 후 열차와 구간 항공의 최종 발권을 진행합니다. 발권이 끝나면 좌석 번호까지 확정된 3단계 최종서류를 보내드립니다. <span class=\"todo\">실제 잔금 기한 작성</span></p></div></details>\n    </div>\n\n    <div class=\"tl-item\"><span class=\"dday\">D-10</span>\n      <details><summary><span class=\"sm-lab\">짐 싸기와 최종서류 확인<small>3단계 문서가 도착합니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n      <div class=\"dbody\"><ul class=\"list\">\n        <li>최종서류의 날짜, 이름, 역 이름을 두 분이 각자 확인</li>\n        <li>서류를 인쇄하고, 휴대폰에도 오프라인 저장</li>\n        <li>날씨를 확인하고 옷 구성 확정</li>\n      </ul></div></details>\n    </div>\n  </div>\n</section>\n\n<!-- 여권 · 입국허가 -->\n<section class=\"sec\" id=\"entry\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">03</div>\n    <h2>여권과 입국 허가</h2>\n    <p>비자는 필요 없지만, 비자와 별개인 사전 허가 제도가 있습니다.</p>\n  </div>\n\n  <details open><summary><span class=\"sm-lab\">영국 ETA<small>영국 일정이 있으면 반드시 필요합니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <dl class=\"kv\">\n      <div><dt>대상</dt><dd>비자 없이 영국을 방문하는 대한민국 여권 소지자</dd></div>\n      <div><dt>의무화</dt><dd>2026년 2월 25일부터 시행</dd></div>\n      <div><dt>신청</dt><dd>영국 정부 공식 사이트 <a href=\"https://www.gov.uk/eta\" target=\"_blank\" rel=\"noopener\">gov.uk/eta</a> 또는 UK ETA 앱</dd></div>\n      <div><dt>준비물</dt><dd>여권, 이메일 주소, 결제 수단, 얼굴 사진</dd></div>\n      <div><dt>수수료</dt><dd>영국 정부 고지 기준 (변동 가능, 신청 시 확인)</dd></div>\n      <div><dt>유효기간</dt><dd>2년 또는 여권 만료일 중 먼저 오는 날까지</dd></div>\n    </dl>\n    <div class=\"warn\">여권을 재발급받으면 <strong>ETA를 다시 신청</strong>해야 합니다. 승인까지 며칠 걸릴 수 있으니 출발 임박해서 신청하지 마세요.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">ETIAS<small>솅겐 지역 사전 여행 허가 · 도입 예정</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>프랑스, 스위스, 이탈리아, 스페인, 포르투갈 등 솅겐 지역 입국 시 요구될 예정인 전자 여행 허가입니다. <strong>2026년 하반기 도입이 예고</strong>되어 있으나 시행 시점이 여러 차례 조정되어 왔습니다.</p>\n    <ul class=\"list\">\n      <li>두 분의 출발일 기준으로 적용 여부를 저희가 확인해 개별 안내드립니다</li>\n      <li>공식 정보는 EU 공식 페이지 <a href=\"https://travel-europe.europa.eu/etias_en\" target=\"_blank\" rel=\"noopener\">travel-europe.europa.eu</a>에서만 확인하세요</li>\n    </ul>\n    <div class=\"warn\">ETIAS 대행을 표방하는 사설 사이트는 <strong>과다 수수료 청구나 개인정보 유출 위험</strong>이 있습니다. 공식 창구 외에는 이용하지 마십시오.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">입국 심사와 체류 기간<small>알아두면 당황하지 않습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>솅겐 지역은 <strong>180일 중 최대 90일</strong> 체류가 원칙입니다. 신혼여행 일정에서는 문제되지 않습니다.</p>\n    <p>입국 심사에서 체류 목적, 숙소, 귀국 항공권을 물을 수 있습니다. 3단계 최종서류에 이 내용이 모두 들어 있으니 <strong>인쇄본을 기내 수하물에</strong> 넣어 두세요.</p>\n    <p>솅겐 지역은 국경 통과 시 생체정보를 등록하는 출입국 시스템(EES)이 운영 중이라, 첫 입국 시 지문과 얼굴 촬영으로 시간이 더 걸릴 수 있습니다.</p>\n  </div></details>\n</section>\n\n<!-- 보험 · 건강 -->\n<section class=\"sec\" id=\"insure\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">04</div>\n    <h2>보험과 건강 준비</h2>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">여행자보험, 어디를 봐야 하나요<small>가입 자체보다 보장 범위가 중요합니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li><strong>해외 의료비 한도</strong> — 유럽 현지 진료비는 한국보다 높은 경우가 많습니다</li>\n      <li><strong>휴대품 손해</strong> — 1개 품목당 한도가 따로 있는지 확인하세요</li>\n      <li><strong>항공기 지연과 수하물 지연</strong> — 보상 조건과 필요한 증빙</li>\n      <li><strong>액티비티 관련 면책</strong> — 패러글라이딩, 스키 등은 별도 특약이 필요할 수 있습니다</li>\n    </ul>\n    <div class=\"note\">보험금 청구에는 <strong>현지 영수증과 진단서</strong>가 필요합니다. 병원에서 받은 서류는 버리지 말고 사진으로도 남겨두세요.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">상비약과 처방약<small>현지에서 같은 약을 사기 어렵습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>유럽은 처방전 없이 살 수 있는 약의 범위가 한국과 다르고, 약국이 일요일과 저녁에 문을 닫는 경우가 많습니다.</p>\n    <ul class=\"list\">\n      <li>해열진통제, 소화제, 지사제, 밴드, 소독제를 소량씩</li>\n      <li>도시 이동이 많은 일정이라면 발 물집 대비 용품</li>\n      <li>복용 중인 약은 <strong>기내 수하물에</strong>, 여유분 포함</li>\n      <li>처방약은 영문 처방전이나 소견서를 함께 지참</li>\n    </ul>\n    <p>지병이나 알레르기가 있으시면 미리 알려주세요. 4단계 문서의 비상 대응 안내에 반영해 드립니다.</p>\n  </div></details>\n</section>\n\n<!-- 결제 · 통신 -->\n<section class=\"sec\" id=\"money\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">05</div>\n    <h2>결제 수단과 통신</h2>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">카드와 현금은 어떻게 준비하나요<small>대부분 카드로 해결되지만 예외가 있습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>해외 결제 가능한 카드를 <strong>2장 이상</strong>, 부부가 나눠서 소지</li>\n      <li>분실과 도난에 대비해 카드사 분실신고 번호를 따로 저장</li>\n      <li>현금은 소액만 — 화장실, 소규모 상점, 팁, 일부 시장</li>\n      <li>국가별 통화가 다릅니다. 영국은 파운드, 스위스는 스위스 프랑, 나머지는 유로</li>\n    </ul>\n    <div class=\"note\">결제 시 <strong>현지 통화로 결제</strong>하시는 편이 유리합니다. 원화 결제를 권하는 화면이 뜨면 현지 통화를 선택하세요. 자세한 내용은 4단계 문서에 있습니다.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">eSIM과 로밍<small>지도와 예약 확인에 데이터가 필요합니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>휴대폰이 eSIM을 지원하는지 미리 확인하세요</li>\n      <li>eSIM은 <strong>출발 전 한국에서 설치</strong>하고, 현지 도착 후 활성화하는 방식이 안전합니다</li>\n      <li>영국과 스위스는 EU 데이터 요금제에서 제외되는 상품이 있습니다. 두 나라가 일정에 있으면 커버리지를 꼭 확인하세요</li>\n      <li>부부 중 <strong>한 명은 로밍</strong>으로 두면 eSIM 문제 발생 시 대비가 됩니다</li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">미리 설치해두면 좋은 앱<small>현지에서 받으면 늦습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>지도 앱과 오프라인 지도 다운로드</li>\n      <li>번역 앱과 오프라인 언어팩</li>\n      <li>이용하실 철도사 앱 <span class=\"todo\">일정에 맞춰 개별 안내</span></li>\n      <li>항공사 앱, 카드사 앱</li>\n    </ul>\n  </div></details>\n</section>\n\n<!-- 짐 준비 -->\n<section class=\"sec\" id=\"pack\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">06</div>\n    <h2>짐은 이 원칙으로 싸세요</h2>\n    <p>유럽 열차 여행에서 짐 무게는 여행의 질을 직접 좌우합니다.</p>\n  </div>\n\n  <div class=\"card\">\n    <h3>계단과 자갈길을 기준으로 생각하세요</h3>\n    <p>유럽의 역과 구시가에는 <strong>엘리베이터가 없는 계단, 돌바닥, 자갈길</strong>이 흔합니다. 베니스의 다리, 포지타노와 마테라의 계단, 리스본의 언덕은 캐리어를 들어 올려야 하는 구간입니다. 캐리어는 각자 스스로 들 수 있는 무게까지만 채우세요.</p>\n  </div>\n\n  <div class=\"tools\"><button onclick=\"allChk(true)\">전체 체크</button><button onclick=\"allChk(false)\">전체 해제</button></div>\n\n  <details open><summary><span class=\"sm-lab\">기내 수하물에 반드시 넣을 것<small>부치는 짐이 늦게 도착할 수 있습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"chk\">\n      <li><input type=\"checkbox\" id=\"p1\"><label for=\"p1\">여권, 최종서류 인쇄본</label></li>\n      <li><input type=\"checkbox\" id=\"p2\"><label for=\"p2\">복용 중인 약과 처방전</label></li>\n      <li><input type=\"checkbox\" id=\"p3\"><label for=\"p3\">보조배터리 (위탁 수하물 반입 불가)</label></li>\n      <li><input type=\"checkbox\" id=\"p4\"><label for=\"p4\">카드와 현금, 여벌 속옷과 상의 한 벌</label></li>\n      <li><input type=\"checkbox\" id=\"p5\"><label for=\"p5\">충전 케이블과 멀티 어댑터</label></li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">유럽 일정에서 자주 빠뜨리는 것<small>사소하지만 현지에서 아쉬운 항목</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"chk\">\n      <li style=\"display:block;padding-top:0\"><figure class=\"shot\" style=\"margin-bottom:4px\"><span class=\"box\"><img src=\"images/guide/plug-types.jpg\" alt=\"유럽 콘센트 타입\" loading=\"lazy\" onerror=\"imgFail(this)\"></span><figcaption>유럽 대부분은 둥근 2핀 C형, 영국은 사각 3핀 G형입니다</figcaption></figure></li>\n      <li><input type=\"checkbox\" id=\"q1\"><label for=\"q1\">멀티 어댑터 — 유럽 대부분 C형, 영국은 별도 규격, 스위스도 일부 다름</label></li>\n      <li><input type=\"checkbox\" id=\"q2\"><label for=\"q2\">걷기 편한 신발 (구시가는 대부분 돌바닥)</label></li>\n      <li><input type=\"checkbox\" id=\"q3\"><label for=\"q3\">알프스 구간용 겉옷 — 여름에도 고지대는 춥습니다</label></li>\n      <li><input type=\"checkbox\" id=\"q4\"><label for=\"q4\">성당 방문용 어깨와 무릎을 가리는 옷</label></li>\n      <li><input type=\"checkbox\" id=\"q5\"><label for=\"q5\">접이식 가방 (기념품 귀국 시)</label></li>\n      <li><input type=\"checkbox\" id=\"q6\"><label for=\"q6\">선글라스와 자외선 차단제</label></li>\n      <li><input type=\"checkbox\" id=\"q7\"><label for=\"q7\">사진용 의상 한 벌</label></li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">수하물 규정 주의사항<small>공항에서 버리게 되는 일이 없도록</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>액체류 반입 기준과 수하물 무게는 항공사마다 다르고, <strong>유럽 내 구간 항공은 한국 출발편보다 기준이 엄격한 경우가 많습니다.</strong></p>\n    <ul class=\"list\">\n      <li>구간 항공의 무료 수하물 규정을 3단계 문서에서 확인하세요</li>\n      <li>보조배터리는 위탁 불가, 기내 반입만 가능하며 용량 제한이 있습니다</li>\n      <li>기념품으로 산 와인과 올리브유는 <strong>기내 반입 불가</strong>이므로 위탁 수하물 계획이 필요합니다</li>\n    </ul>\n  </div></details>\n</section>\n\n<!-- 신혼여행 요청 -->\n<section class=\"sec\" id=\"honey\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">07</div>\n    <h2>지금 말씀해 주시면 반영할 수 있는 것</h2>\n    <p>출발이 가까워지면 반영이 어려워집니다.</p>\n  </div>\n  <div class=\"grid g2\">\n    <div class=\"card\"><h3>호텔 요청 사항</h3><p>더블베드 여부, 전망, 조용한 층, 기념일 메시지 등을 요청해 둘 수 있습니다. 다만 <strong>확약이 아닌 요청</strong>이며 호텔 재량입니다.</p></div>\n    <div class=\"card\"><h3>기념일과 이벤트</h3><p>여행 중 결혼기념일이나 생일이 있다면 알려주세요. 레스토랑 예약이나 특별 준비를 도와드립니다. <span class=\"todo\">가능 범위 작성</span></p></div>\n    <div class=\"card\"><h3>사진 촬영</h3><p>스냅 촬영을 원하시면 도시와 시간대를 미리 정해야 합니다. <span class=\"todo\">제휴 여부 작성</span></p></div>\n    <div class=\"card\"><h3>식사 제한</h3><p>알레르기, 채식, 종교적 이유 등이 있으면 알려주세요. 가이드 미팅과 예약에 반영합니다.</p></div>\n  </div>\n</section>\n\n<!-- 다시 확인 -->\n<section class=\"sec\" id=\"recheck\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">08</div>\n    <h2>계약 때 안내드린 중요 사항, 다시 한번</h2>\n    <p>가장 자주 문제가 되는 세 가지만 다시 짚습니다.</p>\n  </div>\n\n  <div class=\"warn\" style=\"margin-bottom:12px\"><strong>하나 · 이름 철자는 수정이 불가능합니다.</strong> 발권된 열차표와 항공권은 이름 변경이 안 되거나 재발권 비용이 발생합니다. 지금 여권과 대조해 주세요.</div>\n  <div class=\"warn\" style=\"margin-bottom:12px\"><strong>둘 · 취소와 변경에는 규정이 있습니다.</strong> 예약처마다 조건이 다르며, 확정 발권 이후에는 전액 환불이 되지 않는 건이 있습니다.</div>\n  <div class=\"warn\"><strong>셋 · 이동 시각은 두 분이 지키셔야 합니다.</strong> 열차와 항공은 출발 시각이 지나면 좌석이 무효가 되며, 재발권 비용은 별도입니다. 열차를 놓쳤을 때의 대처는 4단계 문서에 있습니다.</div>\n\n  <div class=\"card\" style=\"margin-top:16px\">\n    <h3>문의는 언제든지</h3>\n    <p>준비 과정에서 궁금한 점이 생기면 담당자에게 바로 연락 주세요. 출발 전까지는 저희가 함께 준비합니다.</p>\n    <p style=\"margin-top:10px\">플래닛투어 <a href=\"tel:0424717742\">042-471-7742</a> <span class=\"todo\">응대 시간 추가</span></p>\n  </div>\n</section>\n\n<footer>\n  <span class=\"mono\">Stage 02 of 04 — 예약 직후</span>\n  체크 표시는 이 화면에서만 유지되며 저장되지 않습니다. 새로고침하면 초기화됩니다.<br>\n  입국 제도는 각국 정부 방침에 따라 변경될 수 있으므로, 출발 전 3단계 최종서류에서 다시 확인해 드립니다.<br>\n  플래닛투어 PLANITTOUR · <a href=\"tel:0424717742\">042-471-7742</a><div class=\"foot-copy\">\u00A9 2026 플래닛투어 (PLANITTOUR). All rights reserved.<br>본 자료의 무단 복제 · 배포 · 재가공을 금하며, 위반 시 저작권법에 따른 법적 조치가 취해질 수 있습니다.</div>\n</footer>\n\n</div>",
  3: "<div class=\"wrap\">\n\n<header class=\"stub\">\n  <div class=\"stub-top\"><span class=\"mono\">3단계 · 출발 전 최종확정</span><span class=\"mono\">총 4단계 중 3번째</span></div>\n  <h1>출발 전<br><em>최종 확정 서류</em></h1>\n  <div class=\"when\"><b>이럴 때 보세요</b>출발 1~2주 전에 확인하고, 인쇄해서 여행에 가져가세요</div>\n  <p class=\"lede\">확정된 일정과 예약 내역, 티켓 사용법, 공항과 출입국 절차, 비상 연락처가 모두 들어 있습니다. 출발 전에 두 분이 각자 한 번씩 확인해 주세요.</p>\n  <div class=\"route\">\n    <div class=\"route-line\">\n      <div class=\"rt\"><span>상담·계약</span></div>\n      <div class=\"rt\"><span>예약 직후</span></div>\n      <div class=\"rt on\"><span>출발 전</span></div>\n      <div class=\"rt\"><span>여행 중</span></div>\n    </div>\n  </div>\n</header>\n\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-in\">\n    <a href=\"#verify\">먼저 확인</a>\n    <a href=\"#itinerary\">확정 일정</a>\n    <a href=\"#booking\">예약 내역</a>\n    <a href=\"#tickets\">티켓 사용법</a>\n    <a href=\"#guide\">가이드 미팅</a>\n    <a href=\"#airport\">공항 · 출입국</a>\n    <a href=\"#countdown\">출발 체크리스트</a>\n    <a href=\"#emergency\">비상 연락</a>\n  </div>\n</nav>\n\n<!-- 먼저 확인 -->\n<section class=\"sec\" id=\"verify\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">01</div>\n    <h2>지금 이 네 가지부터 확인해 주세요</h2>\n    <p>오류가 있다면 출발 전에만 바로잡을 수 있습니다. 발견 즉시 담당자에게 연락 주세요.</p>\n  </div>\n  <div class=\"tools\"><button onclick=\"window.print()\">인쇄하기</button><button onclick=\"allChk(false)\">체크 초기화</button></div>\n  <div class=\"card\">\n    <ul class=\"chk\">\n      <li><input type=\"checkbox\" id=\"v1\"><label for=\"v1\"><strong>영문 이름</strong> — 모든 티켓의 철자가 여권과 정확히 일치하는지</label></li>\n      <li><input type=\"checkbox\" id=\"v2\"><label for=\"v2\"><strong>날짜</strong> — 호텔 체크인일과 이동일이 서로 어긋나지 않는지</label></li>\n      <li><input type=\"checkbox\" id=\"v3\"><label for=\"v3\"><strong>역과 공항 이름</strong> — 같은 도시에 역이 여러 개인 경우가 있습니다</label></li>\n      <li><input type=\"checkbox\" id=\"v4\"><label for=\"v4\"><strong>입국 허가</strong> — 영국 ETA 등 필요한 허가가 승인되었는지</label></li>\n    </ul>\n  </div>\n  <div class=\"warn\">출발 <strong>48시간 이내</strong>에는 변경이 거의 불가능합니다. 지금 확인해 주세요.</div>\n</section>\n\n<div id=\"finalbody\"></div>\n\n<!-- 티켓 사용법 -->\n<section class=\"sec\" id=\"tickets\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">10</div>\n    <h2>티켓은 이렇게 사용합니다</h2>\n    <p>한국과 다른 부분이 있어 미리 알아두시면 당황하지 않습니다.</p>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">열차 탑승 절차<small>개찰구가 없는 역이 많습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <figure class=\"shot\"><span class=\"box\"><img src=\"images/guide/ticket-validation.jpg\" alt=\"티켓 각인기\" loading=\"lazy\" onerror=\"imgFail(this)\"></span><figcaption>승강장 입구의 티켓 각인기입니다. 노란색이나 초록색 기계가 많습니다</figcaption></figure>\n    <ul class=\"list\">\n      <li>출발 <strong>20~30분 전</strong>에 역에 도착하세요. 대형 역은 승강장까지 거리가 멉니다</li>\n      <li>전광판에 승강장 번호가 <strong>출발 직전에야 표시</strong>되는 역이 많습니다</li>\n      <li>승강장에 서기 전에 <strong>객차 번호</strong>를 확인하세요. 열차가 길어 뒤늦게 이동하면 시간이 부족합니다</li>\n      <li>차내에서 검표원이 티켓과 여권을 확인합니다. 티켓 화면을 바로 열 수 있게 준비하세요</li>\n      <li>일부 지역 열차는 <strong>탑승 전 승강장에서 티켓을 각인</strong>해야 합니다. 각인하지 않으면 무임승차로 간주되어 벌금이 부과될 수 있습니다</li>\n    </ul>\n    <div class=\"note\">두 분의 일정 중 각인이 필요한 구간은 확정 일정표에 별도 표기해 드립니다. <span class=\"todo\">해당 구간 표기</span></div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">티켓 저장 방법<small>데이터가 안 될 때를 대비</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>전자 티켓은 <strong>PDF를 휴대폰에 다운로드</strong>해 두세요. 이메일 링크만 믿으면 안 됩니다</li>\n      <li>QR 코드는 <strong>화면 캡처</strong>로도 저장해 두세요</li>\n      <li>부부 두 분의 휴대폰에 <strong>각자 저장</strong>하세요</li>\n      <li>인쇄본 한 부를 캐리어가 아닌 <strong>가방에</strong> 넣어 두세요</li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">호텔 체크인 · 체크아웃<small>도시세는 대부분 현장 결제입니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>체크인 시 <strong>여권과 예약번호</strong>가 필요합니다. 부부 두 분 모두의 여권을 확인하는 경우가 있습니다</li>\n      <li>많은 도시가 <strong>도시세(숙박세)를 현장에서 별도 징수</strong>합니다. 요금에 포함되어 있지 않습니다</li>\n      <li>보증금 명목으로 카드에 임시 승인이 걸릴 수 있습니다. 체크아웃 후 해제됩니다</li>\n      <li>체크인 시각 전에 도착하면 짐을 맡기고 나가실 수 있습니다</li>\n    </ul>\n    <p>체크아웃 시 주의사항과 분쟁 대처는 4단계 문서에 자세히 정리해 두었습니다.</p>\n  </div></details>\n</section>\n\n<!-- 가이드 미팅 -->\n<section class=\"sec\" id=\"guide\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">09</div>\n    <h2>현지 가이드 미팅</h2>\n    <p>신청하신 도시에서만 진행됩니다. 장소와 시각을 정확히 확인해 주세요.</p>\n  </div>\n  <div class=\"card\">\n    <dl class=\"kv\">\n      <div><dt>도시</dt><dd>미팅 도시</dd></div>\n      <div><dt>날짜</dt><dd>날짜와 시각</dd></div>\n      <div><dt>장소</dt><dd>정확한 미팅 지점 (지도 좌표 포함)</dd></div>\n      <div><dt>가이드</dt><dd>이름 · 현지 연락처</dd></div>\n      <div><dt>소요</dt><dd>예상 진행 시간</dd></div>\n    </dl>\n    <p style=\"margin-top:12px\"><span class=\"todo\">고객별 가이드 미팅 데이터 삽입</span></p>\n  </div>\n  <div class=\"note\"><strong>미팅 장소를 지도 앱에 미리 저장</strong>해 두세요. 광장이나 역 앞처럼 넓은 곳은 정확한 지점을 찾기 어렵습니다. 가이드를 만나지 못했을 때의 대처 순서는 4단계 문서에 있습니다.</div>\n</section>\n\n<!-- 공항 · 출입국 -->\n<section class=\"sec\" id=\"airport\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">10</div>\n    <h2>공항과 출입국</h2>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">출국 당일 공항에서<small>도착 시간과 순서</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>국제선은 출발 <strong>3시간 전</strong> 도착을 권장합니다</li>\n      <li>순서는 체크인과 수하물 위탁 → 보안검색 → 출국심사 → 탑승구</li>\n      <li>액체류는 기내 반입 규정에 맞게 미리 분리해 두세요</li>\n      <li>보조배터리는 위탁 수하물에 넣으면 안 됩니다</li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">유럽 입국 심사<small>물어볼 수 있는 것들</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>체류 목적, 숙소, 체류 기간, 귀국 항공권을 물을 수 있습니다. 이 문서의 인쇄본을 보여주시면 됩니다.</p>\n    <ul class=\"list\">\n      <li>솅겐 지역 첫 입국 시 <strong>지문과 얼굴 촬영</strong>으로 시간이 더 걸릴 수 있습니다</li>\n      <li>영국은 솅겐 지역이 아니어서 별도 입국 심사를 받습니다</li>\n      <li>스위스는 솅겐 지역이지만 통화가 다르고 세관 규정이 별도입니다</li>\n    </ul>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">택스 리펀드<small>쇼핑 계획이 있으시면</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>일정 금액 이상 구매 시 부가세 환급을 받을 수 있습니다. 매장에서 서류를 받아 <strong>유럽을 최종적으로 떠나는 공항</strong>에서 처리합니다.</p>\n    <ul class=\"list\">\n      <li>구매한 물품을 세관에서 확인할 수 있으니 위탁 전에 처리하세요</li>\n      <li>절차에 시간이 걸리므로 공항에 더 일찍 도착하셔야 합니다</li>\n      <li>기준 금액과 환급률은 국가마다 다릅니다 <span class=\"todo\">국가별 기준 작성</span></li>\n    </ul>\n  </div></details>\n</section>\n\n<!-- 출발 체크리스트 -->\n<section class=\"sec\" id=\"countdown\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">09</div>\n    <h2>출발 카운트다운</h2>\n  </div>\n\n  <details open><summary><span class=\"sm-lab\">D-3<small>서류와 통신</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><ul class=\"chk\">\n    <li><input type=\"checkbox\" id=\"a1\"><label for=\"a1\">이 문서 인쇄, 휴대폰에 PDF 저장</label></li>\n    <li><input type=\"checkbox\" id=\"a2\"><label for=\"a2\">모든 티켓 PDF와 QR 캡처를 두 분 각자 저장</label></li>\n    <li><input type=\"checkbox\" id=\"a3\"><label for=\"a3\">오프라인 지도와 번역 언어팩 다운로드</label></li>\n    <li><input type=\"checkbox\" id=\"a4\"><label for=\"a4\">eSIM 설치 (활성화는 현지 도착 후)</label></li>\n    <li><input type=\"checkbox\" id=\"a5\"><label for=\"a5\">카드사에 해외 사용 등록, 분실신고 번호 저장</label></li>\n  </ul></div></details>\n\n  <details><summary><span class=\"sm-lab\">D-1<small>짐과 최종 점검</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><ul class=\"chk\">\n    <li><input type=\"checkbox\" id=\"b1\"><label for=\"b1\">여권 소지 확인, 사본과 사진 저장 확인</label></li>\n    <li><input type=\"checkbox\" id=\"b2\"><label for=\"b2\">수하물 무게 측정</label></li>\n    <li><input type=\"checkbox\" id=\"b3\"><label for=\"b3\">약, 보조배터리, 어댑터를 기내 가방에</label></li>\n    <li><input type=\"checkbox\" id=\"b4\"><label for=\"b4\">현지 날씨 확인, 겉옷 최종 결정</label></li>\n    <li><input type=\"checkbox\" id=\"b5\"><label for=\"b5\">4단계 여행 중 안내문 링크를 휴대폰에 저장</label></li>\n    <li><input type=\"checkbox\" id=\"b6\"><label for=\"b6\">공항까지 가는 교통편 확정</label></li>\n  </ul></div></details>\n\n  <details><summary><span class=\"sm-lab\">출발 당일<small>집을 나서기 전</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\"><ul class=\"chk\">\n    <li><input type=\"checkbox\" id=\"c1\"><label for=\"c1\">여권 · 카드 · 현금 · 휴대폰 · 보조배터리</label></li>\n    <li><input type=\"checkbox\" id=\"c2\"><label for=\"c2\">휴대폰 완충, 보조배터리 완충</label></li>\n    <li><input type=\"checkbox\" id=\"c3\"><label for=\"c3\">항공편 지연 여부 확인</label></li>\n    <li><input type=\"checkbox\" id=\"c4\"><label for=\"c4\">3시간 전 공항 도착</label></li>\n  </ul></div></details>\n</section>\n\n<!-- 비상 연락 -->\n<section class=\"sec\" id=\"emergency\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">10</div>\n    <h2>비상 연락처</h2>\n    <p>이 부분은 인쇄해서 지갑에 넣어 두시길 권합니다.</p>\n  </div>\n\n  <div class=\"contact\">\n    <h3>가장 먼저 연락하실 곳</h3>\n    <dl class=\"kv\">\n      <div><dt>담당자</dt><dd><a href=\"tel:0424717742\">042-471-7742</a> <span class=\"todo\">휴대폰 · 카카오톡 ID 추가</span></dd></div>\n      <div><dt>회사</dt><dd>플래닛투어 <a href=\"tel:0424717742\">042-471-7742</a> <span class=\"todo\">야간 비상 연락처 추가</span></dd></div>\n      <div><dt>응대시간</dt><dd><span class=\"todo\">한국 시간 기준 운영 시간</span></dd></div>\n    </dl>\n  </div>\n\n  <div class=\"contact\">\n    <h3>현지 긴급 상황</h3>\n    <dl class=\"kv\">\n      <div><dt>공통</dt><dd><strong>112</strong> — 유럽 전역 공통 긴급번호 (경찰 · 소방 · 구급)</dd></div>\n      <div><dt>영국</dt><dd><strong>999</strong> 또는 112</dd></div>\n      <div><dt>영사조력</dt><dd>외교부 영사콜센터 <span class=\"todo\">번호 확인 후 기재</span></dd></div>\n      <div><dt>대사관</dt><dd><span class=\"todo\">방문 국가별 대사관 연락처 삽입</span></dd></div>\n    </dl>\n  </div>\n\n  <div class=\"contact\">\n    <h3>보험과 카드</h3>\n    <dl class=\"kv\">\n      <div><dt>보험사</dt><dd><span class=\"todo\">가입하신 보험사 해외 사고 접수 번호</span></dd></div>\n      <div><dt>카드사</dt><dd><span class=\"todo\">분실신고 해외 전화번호</span></dd></div>\n    </dl>\n  </div>\n\n  <div class=\"warn\">휴대폰이 없거나 배터리가 없을 때를 대비해 <strong>이 페이지만이라도 인쇄</strong>해서 각자 나눠 소지하세요.</div>\n</section>\n\n<footer>\n  <span class=\"mono\">Stage 03 of 04 — 출발 전 최종확정</span>\n  이 문서의 예약 정보가 실제 예약 내용과 다를 경우 즉시 담당자에게 연락 주세요. 출발 후에는 정정이 어렵습니다.<br>\n  체크 표시는 이 화면에서만 유지되며 저장되지 않습니다.<br>\n  플래닛투어 PLANITTOUR · <a href=\"tel:0424717742\">042-471-7742</a><div class=\"foot-copy\">\u00A9 2026 플래닛투어 (PLANITTOUR). All rights reserved.<br>본 자료의 무단 복제 · 배포 · 재가공을 금하며, 위반 시 저작권법에 따른 법적 조치가 취해질 수 있습니다.</div>\n</footer>\n\n</div>",
  4: "<div class=\"wrap\">\n\n<header class=\"stub\">\n  <div class=\"stub-top\"><span class=\"mono\">4단계 · 여행 중</span><span class=\"mono\">총 4단계 중 4번째</span></div>\n  <h1>여행 중<br><em>문제 해결 안내서</em></h1>\n  <div class=\"when\"><b>이럴 때 보세요</b>현지에서 문제가 생겼을 때 바로 여세요</div>\n  <p class=\"lede\">아플 때, 열차가 지연되거나 놓쳤을 때, 가이드를 만나지 못했을 때, 물건을 잃어버렸을 때. 지금 상황을 고르시면 무엇부터 해야 하는지 순서대로 나옵니다.</p>\n  <div class=\"route\">\n    <div class=\"route-line\">\n      <div class=\"rt\"><span>상담·계약</span></div>\n      <div class=\"rt\"><span>예약 직후</span></div>\n      <div class=\"rt\"><span>출발 전</span></div>\n      <div class=\"rt on\"><span>여행 중</span></div>\n    </div>\n  </div>\n</header>\n\n<div class=\"sos\">\n  <b>112</b>\n  <span>유럽 전역 공통 긴급번호입니다. 경찰 · 소방 · 구급 모두 연결되며, 대부분 영어 대응이 가능합니다. 영국에서는 999도 함께 쓰입니다.</span>\n</div>\n\n<div class=\"quick\">\n  <div class=\"quick-h\">지금 무슨 일이 생겼나요</div>\n  <div class=\"qgrid\">\n    <button class=\"qbtn\" data-go=\"sick\">몸이 아파요<small>병원 · 약국 찾기</small></button>\n    <button class=\"qbtn\" data-go=\"train\">열차 문제<small>지연 · 놓침 · 파업</small></button>\n    <button class=\"qbtn\" data-go=\"meet\">가이드를 못 찾아요<small>미팅 실패 시</small></button>\n    <button class=\"qbtn\" data-go=\"lost\">잃어버렸어요<small>여권 · 카드 · 짐</small></button>\n  </div>\n</div>\n\n<div class=\"search\">\n  <input type=\"search\" id=\"q\" placeholder=\"상황을 입력해 보세요 — 예: 여권, 체크아웃, 팁, 소매치기\" aria-label=\"상황 검색\">\n  <p id=\"qmsg\">키워드를 입력하면 관련 항목만 펼쳐집니다.</p>\n</div>\n\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-in\">\n    <a href=\"#sick\">아플 때</a>\n    <a href=\"#train\">열차 · 이동</a>\n    <a href=\"#meet\">가이드 미팅</a>\n    <a href=\"#hotel\">체크인 · 체크아웃</a>\n    <a href=\"#lost\">분실 · 도난</a>\n    <a href=\"#money\">화폐 · 결제</a>\n    <a href=\"#culture\">현지 문화</a>\n    <a href=\"#contact\">연락처</a>\n  </div>\n</nav>\n\n<!-- 아플 때 -->\n<section class=\"sec\" id=\"sick\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">01</div>\n    <h2>아프거나 다쳤을 때</h2>\n    <p>증상이 심하면 망설이지 말고 112에 전화하세요. 통역이 필요하면 담당자에게 연락 주세요.</p>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">가벼운 증상 — 감기, 소화불량, 물집, 가벼운 찰과상<small>약국에서 해결되는 경우</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>약국을 찾습니다</strong> 지도 앱에서 pharmacy로 검색하세요. 초록 십자 표시가 약국입니다.</li>\n      <li><strong>증상을 보여줍니다</strong> 번역 앱으로 증상을 적어 보여주는 편이 정확합니다.</li>\n      <li><strong>영수증을 챙깁니다</strong> 보험 청구에 필요합니다.</li>\n    </ol>\n    <div class=\"warn\">유럽 약국은 <strong>일요일과 공휴일에 문을 닫는 곳이 많고</strong>, 평일 저녁에도 일찍 닫습니다. 야간에는 당번 약국만 운영합니다. 필요한 약은 미리 사두세요.</div>\n    <div class=\"say\"><b>약국에서 보여주세요</b>Could you recommend something for this symptom? I am a tourist and I do not have a prescription.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">병원에 가야 할 때<small>고열, 심한 통증, 부상</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>담당자에게 연락합니다</strong> 병원 안내와 통역을 도와드립니다. 연락이 어려우면 호텔 프런트에 요청하세요. 호텔은 인근 병원 정보를 가지고 있습니다.</li>\n      <li><strong>보험사에 사고 접수를 합니다</strong> 진료 전에 접수하면 처리가 수월합니다. 보험사 해외 접수 번호는 3단계 문서에 있습니다.</li>\n      <li><strong>여권을 지참하고 방문합니다</strong> 신분 확인에 필요합니다.</li>\n      <li><strong>서류를 모두 보관합니다</strong> 진단서, 처방전, 영수증이 있어야 보험금을 받을 수 있습니다. 사진으로도 남겨두세요.</li>\n    </ol>\n    <div class=\"warn\">유럽은 응급이 아닌 진료도 <strong>비용이 높고 대기가 깁니다.</strong> 결제 전에 예상 금액을 확인하시고, 카드 한도가 충분한지 살펴보세요.</div>\n    <div class=\"say\"><b>병원에서 보여주세요</b>I am a tourist from South Korea. I need to see a doctor. I have travel insurance and I will need a medical certificate and a receipt.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">응급 상황<small>의식 저하, 호흡 곤란, 심한 출혈, 큰 사고</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>112에 전화합니다</strong> 위치를 먼저 말하세요. 주소를 모르면 주변 건물이나 역 이름을 말하고, 지도 앱의 좌표를 읽어주면 됩니다.</li>\n      <li><strong>영어로 짧게 말합니다</strong> Ambulance, please. My location is ...</li>\n      <li><strong>배우자나 동행이 함께 갑니다</strong> 혼자 이송되지 않도록 하세요.</li>\n      <li><strong>담당자와 보험사에 알립니다</strong> 이후 절차를 지원해 드립니다.</li>\n    </ol>\n    <div class=\"note\">고지대나 산악 구간에서는 신호가 약할 수 있습니다. 융프라우, 체르마트 등 산악 일정에서는 <strong>산악 구조 요청은 현지 시설 직원에게</strong> 하는 편이 가장 빠릅니다.</div>\n  </div></details>\n</section>\n\n<!-- 열차 · 이동 -->\n<section class=\"sec\" id=\"train\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">02</div>\n    <h2>열차와 이동 문제</h2>\n    <p>유럽에서 열차 지연과 파업은 드문 일이 아닙니다. 당황하지 않는 것이 가장 중요합니다.</p>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">열차가 지연되고 있어요<small>전광판에 delayed 표시</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <figure class=\"shot\"><span class=\"box\"><img src=\"images/guide/departure-board.jpg\" alt=\"역 전광판\" loading=\"lazy\" onerror=\"imgFail(this)\"></span><figcaption>역 전광판. 지연 시간과 승강장 번호가 표시됩니다</figcaption></figure>\n    <ol class=\"now\">\n      <li><strong>승강장을 벗어나지 마세요</strong> 지연되어도 승강장이 바뀌는 경우가 많습니다. 전광판을 계속 확인하세요.</li>\n      <li><strong>안내 방송과 전광판을 봅니다</strong> 지연 시간이 표시됩니다. 표시가 계속 늘어나면 역 안내데스크에 문의하세요.</li>\n      <li><strong>다음 일정에 영향이 있는지 봅니다</strong> 환승이 있거나 체크인 시간이 늦어질 것 같으면 즉시 담당자에게 연락 주세요.</li>\n      <li><strong>지연 증빙을 남깁니다</strong> 전광판 사진을 찍어두세요. 보상 청구나 보험 청구에 쓰입니다.</li>\n    </ol>\n    <div class=\"note\">일정 시간 이상 지연되면 <strong>철도사가 보상 제도를 운영</strong>하는 경우가 있습니다. 조건은 철도사와 티켓 종류에 따라 다릅니다. 귀국 후 저희가 청구를 도와드립니다.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">열차를 놓쳤어요<small>가장 많이 문의 주시는 상황</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>다음 열차 시각을 확인합니다</strong> 역 전광판이나 철도사 앱에서 같은 구간의 다음 편을 봅니다.</li>\n      <li><strong>매표소나 안내데스크로 갑니다</strong> 티켓을 보여주고 상황을 설명하세요. 티켓 종류에 따라 다음 열차로 변경해 주는 경우가 있습니다. <strong>혼자 판단해 새 표를 사기 전에</strong> 먼저 문의하세요.</li>\n      <li><strong>담당자에게 연락합니다</strong> 그날 숙소 체크인과 이후 일정 조정을 도와드립니다.</li>\n      <li><strong>새로 발권해야 한다면</strong> 비용이 발생합니다. 영수증을 보관해 주세요.</li>\n    </ol>\n    <div class=\"warn\">좌석이 지정된 고속열차 티켓은 <strong>해당 열차에만 유효</strong>한 경우가 대부분입니다. 다음 열차에 그냥 타면 무임승차로 처리될 수 있습니다.</div>\n    <div class=\"say\"><b>매표소에서 보여주세요</b>I missed my train. This is my ticket. Can I take the next train, or do I need to buy a new one?</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">파업이 발표되었어요<small>프랑스, 이탈리아에서 비교적 자주 있습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>담당자에게 바로 알려주세요</strong> 대체 이동편을 찾아 드립니다. 시간이 지날수록 대체편 좌석이 사라집니다.</li>\n      <li><strong>운행 여부를 확인합니다</strong> 파업 중에도 일부 열차는 운행합니다. 철도사 앱과 역 안내를 확인하세요.</li>\n      <li><strong>일정 조정을 검토합니다</strong> 숙소 연장이나 순서 변경이 필요할 수 있습니다.</li>\n    </ol>\n    <p>파업은 보통 며칠 전에 예고됩니다. 저희도 모니터링하고 있으며, 두 분의 일정에 영향이 있으면 먼저 연락드립니다.</p>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">티켓 각인과 검표<small>벌금을 피하는 방법</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>일부 지역 열차와 버스는 <strong>탑승 전에 승강장이나 차내 기계에 티켓을 각인</strong>해야 합니다</li>\n      <li>각인하지 않으면 티켓을 가지고 있어도 <strong>무임승차로 간주되어 벌금</strong>이 부과됩니다</li>\n      <li>전자 티켓은 대부분 각인이 필요 없습니다. 헷갈리면 역 직원에게 티켓을 보여주고 물어보세요</li>\n      <li>검표원은 사복인 경우도 있습니다. 신분증 제시를 요구하면 확인하세요</li>\n    </ul>\n    <div class=\"say\"><b>확인이 필요할 때</b>Do I need to validate this ticket before boarding?</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">페리가 결항되었어요<small>아말피 해안 구간 등</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>페리는 기상에 따라 <strong>당일 결항이 결정</strong>되는 경우가 많습니다.</p>\n    <ol class=\"now\">\n      <li><strong>선착장 안내를 확인합니다</strong> 결항 여부와 환불 방법을 알려줍니다.</li>\n      <li><strong>육로 대체편을 찾습니다</strong> 버스 노선이 있는 구간이 많지만 소요 시간이 길어집니다.</li>\n      <li><strong>담당자에게 연락합니다</strong> 이후 일정 조정을 도와드립니다.</li>\n    </ol>\n  </div></details>\n</section>\n\n<!-- 가이드 미팅 -->\n<section class=\"sec\" id=\"meet\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">03</div>\n    <h2>가이드를 만나지 못했을 때</h2>\n    <p>순서대로만 하시면 대부분 10분 안에 해결됩니다.</p>\n  </div>\n\n  <div class=\"card\">\n    <ol class=\"now\">\n      <li><strong>약속 장소가 맞는지 다시 확인합니다</strong> 3단계 최종서류의 미팅 장소와 시각을 확인하세요. 광장이나 역 앞은 출입구가 여러 개라 서로 다른 쪽에 서 있는 경우가 가장 많습니다.</li>\n      <li><strong>가이드에게 직접 연락합니다</strong> 최종서류에 적힌 현지 연락처로 전화하거나 메시지를 보내세요. 통화가 어려우면 메시지에 <strong>현재 위치를 지도 좌표로</strong> 보내는 것이 가장 정확합니다.</li>\n      <li><strong>그 자리에서 15분간 기다립니다</strong> 이동하면 서로 엇갈립니다. 눈에 잘 띄는 곳에 서 계세요.</li>\n      <li><strong>담당자에게 연락합니다</strong> 가이드와 연결이 되지 않으면 저희가 확인해 드립니다.</li>\n      <li><strong>그래도 만나지 못했다면</strong> 무리해서 기다리지 마시고 일정을 이어가세요. 미팅이 진행되지 못한 경우의 처리는 귀국 후 저희가 정리해 드립니다.</li>\n    </ol>\n  </div>\n  <div class=\"note\">출발 전에 <strong>미팅 장소를 지도 앱에 저장</strong>해 두시고, 가이드 연락처를 휴대폰에 미리 등록해 두시면 이런 상황이 거의 생기지 않습니다.</div>\n  <div class=\"say\"><b>가이드에게 보낼 메시지</b>Hello, this is the couple from Korea for today. We are waiting at the meeting point. Here is our location.</div>\n</section>\n\n<!-- 호텔 -->\n<section class=\"sec\" id=\"hotel\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">04</div>\n    <h2>체크인과 체크아웃</h2>\n    <p>분쟁이 생기는 지점은 거의 정해져 있습니다.</p>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">체크인할 때<small>여권과 예약번호, 그리고 도시세</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li><strong>여권</strong>이 필요합니다. 두 분 모두의 여권을 요구하는 곳이 많습니다</li>\n      <li><strong>도시세는 별도로 현장 결제</strong>하는 경우가 대부분입니다. 인원과 박수에 따라 계산됩니다</li>\n      <li>보증금 명목으로 카드에 임시 승인이 걸릴 수 있습니다. 체크아웃 후 해제되며 며칠 걸릴 수 있습니다</li>\n      <li>객실에 들어가면 <strong>상태를 사진으로 남겨두세요</strong> 기존 파손을 나중에 청구받는 일을 막아줍니다</li>\n      <li>에어컨, 온수, 와이파이가 되는지 바로 확인하세요. 문제가 있으면 <strong>첫날 바로</strong> 말해야 방을 바꿔 줍니다</li>\n    </ul>\n    <div class=\"say\"><b>예약과 다를 때</b>My booking says a double room with breakfast. Could you check the reservation again? Here is the confirmation.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">체크아웃할 때<small>가장 흔한 실수</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li><strong>금고를 반드시 열어보세요</strong> 여권과 현금을 두고 나오는 사고가 가장 많습니다</li>\n      <li>충전기, 어댑터, 욕실 물건을 확인하세요</li>\n      <li><strong>영수증을 받고 항목을 확인</strong>하세요. 미니바나 이용하지 않은 항목이 청구되기도 합니다</li>\n      <li>체크아웃 후에도 <strong>짐은 맡길 수 있습니다</strong> 오후 열차라면 활용하세요</li>\n      <li>객실 사진을 한 장 찍어두면 분실물 확인에 도움이 됩니다</li>\n    </ul>\n    <div class=\"warn\">이미 출발한 뒤 물건을 두고 온 것을 알았다면, 숙소에 바로 연락하고 담당자에게도 알려주세요. 시간이 지날수록 찾기 어렵습니다.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">숙소가 예약과 다를 때<small>객실 타입, 위치, 상태</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>현장에서 바로 말하세요</strong> 나중에는 조치가 어렵습니다.</li>\n      <li><strong>증거를 남기세요</strong> 객실 사진, 프런트와 나눈 대화를 기록해 두세요.</li>\n      <li><strong>담당자에게 연락하세요</strong> 저희가 호텔과 직접 협의합니다. 스스로 추가 비용을 지불하기 전에 먼저 알려주세요.</li>\n    </ol>\n  </div></details>\n</section>\n\n<!-- 분실 · 도난 -->\n<section class=\"sec\" id=\"lost\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">05</div>\n    <h2>분실과 도난</h2>\n    <p>유럽 주요 관광지에는 소매치기가 실제로 많습니다. 예방이 최선입니다.</p>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">여권을 잃어버렸어요<small>가장 급한 상황</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>경찰서에서 분실 신고서를 받습니다</strong> 이 서류가 있어야 재발급이 가능합니다.</li>\n      <li><strong>대사관이나 총영사관에 연락합니다</strong> 여행증명서 또는 긴급여권 발급을 안내받습니다. 연락처는 3단계 문서에 있습니다.</li>\n      <li><strong>담당자에게 연락합니다</strong> 남은 일정 조정과 이동편 변경을 도와드립니다.</li>\n      <li><strong>여권 사본과 사진을 제출합니다</strong> 미리 저장해 두신 사본이 여기서 큰 도움이 됩니다.</li>\n    </ol>\n    <div class=\"warn\">영국 ETA 등 <strong>여권에 연동된 입국 허가는 새 여권으로 다시 신청</strong>해야 합니다. 영국 일정이 남아 있다면 반드시 담당자에게 알려주세요.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">카드나 현금을 도난당했어요<small>순서가 중요합니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>카드사에 즉시 분실 신고</strong>합니다. 앱에서 바로 정지할 수 있는 카드가 많습니다.</li>\n      <li><strong>경찰에 신고하고 신고서를 받습니다</strong> 보험 청구에 필요합니다.</li>\n      <li><strong>남은 카드로 일정을 이어갑니다</strong> 카드를 나눠서 소지하시라고 안내드린 이유입니다.</li>\n      <li><strong>담당자에게 연락합니다</strong> 필요 시 송금이나 대체 결제 방법을 안내해 드립니다.</li>\n    </ol>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">수하물이 도착하지 않았어요<small>공항에서 바로 처리</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ol class=\"now\">\n      <li><strong>공항을 나가기 전에 수하물 카운터로 갑니다</strong> 나간 뒤에는 처리가 복잡해집니다.</li>\n      <li><strong>수하물 사고 접수증을 받습니다</strong> 추적 번호가 적혀 있습니다.</li>\n      <li><strong>다음 숙소 주소를 알려줍니다</strong> 이동 일정이 있으면 다음 도시의 숙소로 배송받을 수 있습니다. 3단계 문서의 숙소 정보를 보여주세요.</li>\n      <li><strong>필수품 구입 영수증을 보관합니다</strong> 항공사나 보험사에서 보상받을 수 있습니다.</li>\n    </ol>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">소매치기 예방<small>미리 알아두면 대부분 막을 수 있습니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>가방은 <strong>몸 앞으로</strong> 메고, 지퍼는 손이 닿는 위치에 두세요</li>\n      <li>휴대폰을 테이블 위에 올려두지 마세요. 카페 야외석에서 가장 많이 사라집니다</li>\n      <li>지하철과 관광지 인파 속, 계단과 에스컬레이터에서 특히 주의하세요</li>\n      <li>낯선 사람이 말을 걸거나 무언가를 들이밀면 <strong>한 손은 가방 위에</strong> 두세요. 주의를 분산시키는 수법입니다</li>\n      <li>여권 원본은 숙소 금고에, 외출 시에는 사본을 소지하는 방법도 있습니다</li>\n      <li>현금과 카드는 부부가 나눠서 소지하세요</li>\n    </ul>\n    <div class=\"note\">도난이 잦은 구체적인 장소와 수법은 도시별로 다릅니다. <span class=\"todo\">도시별 주의 지점 작성</span></div>\n  </div></details>\n</section>\n\n<!-- 화폐 · 결제 -->\n<section class=\"sec\" id=\"money\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">06</div>\n    <h2>화폐와 결제</h2>\n  </div>\n\n  <div class=\"card\">\n    <h3>나라마다 통화가 다릅니다</h3>\n    <dl class=\"kv\">\n      <div><dt>영국</dt><dd>파운드 GBP</dd></div>\n      <div><dt>스위스</dt><dd>스위스 프랑 CHF (유로를 받는 곳이 있지만 환율이 불리합니다)</dd></div>\n      <div><dt>그 외</dt><dd>프랑스 · 이탈리아 · 스페인 · 포르투갈은 유로 EUR</dd></div>\n    </dl>\n  </div>\n\n  <details><summary><span class=\"sm-lab\">카드 결제 시 꼭 알아야 할 것<small>모르면 손해 보는 부분</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>결제 시 <strong>원화로 결제하시겠습니까</strong>라는 안내가 나오면 <strong>현지 통화를 선택</strong>하세요. 원화 결제는 별도 수수료가 붙습니다</li>\n      <li>영수증에 KRW가 찍혀 있으면 원화 결제된 것입니다. 그 자리에서 취소하고 다시 결제해 달라고 요청할 수 있습니다</li>\n      <li>ATM에서 현금을 뽑을 때도 같은 안내가 나옵니다. 역시 현지 통화를 선택하세요</li>\n      <li>공항과 관광지의 사설 환전소는 환율이 불리한 경우가 많습니다</li>\n    </ul>\n    <div class=\"say\"><b>결제할 때</b>In local currency, please.</div>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">현금이 필요한 상황<small>카드만으로는 곤란한 순간</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <ul class=\"list\">\n      <li>유료 화장실 — 역과 관광지에서 동전이 필요한 곳이 있습니다</li>\n      <li>소규모 상점, 시장, 일부 카페의 최소 결제 금액</li>\n      <li>짐 보관함, 소규모 교통편</li>\n      <li>팁과 거리 공연</li>\n    </ul>\n    <p>큰 금액을 환전하실 필요는 없습니다. 국가별로 소액만 준비하시고 부족하면 ATM을 이용하세요.</p>\n  </div></details>\n\n  <details><summary><span class=\"sm-lab\">팁은 얼마나 줘야 하나요<small>한국과 기준이 다릅니다</small></span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"/></svg></summary>\n  <div class=\"dbody\">\n    <p>유럽은 미국처럼 팁이 의무적이지 않습니다. 서비스료가 이미 포함된 경우가 많습니다.</p>\n    <ul class=\"list\">\n      <li><strong>영수증을 먼저 확인</strong>하세요. service charge가 이미 포함되어 있으면 추가 팁은 필요하지 않습니다</li>\n      <li>포함되어 있지 않고 서비스가 좋았다면 <strong>금액을 올림하는 정도</strong>가 일반적입니다</li>\n      <li>이탈리아 식당은 자릿세 성격의 요금이 별도로 붙는 경우가 있습니다. 팁과는 다른 항목입니다</li>\n      <li>카페에서 서서 마시는 것과 앉아서 마시는 것의 가격이 다른 곳이 있습니다</li>\n    </ul>\n  </div></details>\n</section>\n\n<!-- 현지 문화 -->\n<section class=\"sec\" id=\"culture\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">07</div>\n    <h2>국가별 문화와 주의사항</h2>\n    <p>알고 가면 실수를 줄이고, 현지에서 더 환대받습니다.</p>\n  </div>\n  <div class=\"country-tabs\" id=\"ctabs\"></div>\n  <div id=\"clist\"></div>\n</section>\n\n<!-- 연락처 -->\n<section class=\"sec\" id=\"contact\">\n  <div class=\"sec-h\">\n    <div class=\"eyebrow\">08</div>\n    <h2>연락처</h2>\n  </div>\n\n  <div class=\"contact\">\n    <h3>담당자</h3>\n    <dl class=\"kv\">\n            <div><dt>연락</dt><dd><a href=\"tel:0424717742\">042-471-7742</a> <span class=\"todo\">휴대폰 · 카카오톡 추가</span></dd></div>\n      <div><dt>야간</dt><dd><span class=\"todo\">긴급 연락처</span></dd></div>\n    </dl>\n  </div>\n\n  <div class=\"contact\">\n    <h3>긴급 번호</h3>\n    <dl class=\"kv\">\n      <div><dt>유럽 공통</dt><dd><strong>112</strong> — 경찰 · 소방 · 구급</dd></div>\n      <div><dt>영국</dt><dd><strong>999</strong> 또는 112</dd></div>\n      <div><dt>영사조력</dt><dd>외교부 영사콜센터 <span class=\"todo\">번호 확인 후 기재</span></dd></div>\n      <div><dt>대사관</dt><dd><span class=\"todo\">방문 국가별 연락처 삽입</span></dd></div>\n      <div><dt>보험사</dt><dd><span class=\"todo\">해외 사고 접수 번호</span></dd></div>\n      <div><dt>카드사</dt><dd><span class=\"todo\">분실신고 번호</span></dd></div>\n    </dl>\n  </div>\n\n  <div class=\"note\">연락 주실 때 <strong>현재 도시, 상황, 다음 일정</strong> 세 가지를 먼저 알려주시면 가장 빠르게 도와드릴 수 있습니다.</div>\n</section>\n\n<footer>\n  <span class=\"mono\">Stage 04 of 04 — 여행 중</span>\n  이 문서는 출발 전에 휴대폰에 저장하거나 즐겨찾기에 추가해 두세요. 데이터가 되지 않는 곳에서도 볼 수 있도록 화면 캡처를 남겨두시면 더 안전합니다.<br>\n  긴급번호와 각국 제도는 변경될 수 있으므로 현지 안내를 우선하세요.<br>\n  플래닛투어 PLANITTOUR · <a href=\"tel:0424717742\">042-471-7742</a><div class=\"foot-copy\">\u00A9 2026 플래닛투어 (PLANITTOUR). All rights reserved.<br>본 자료의 무단 복제 · 배포 · 재가공을 금하며, 위반 시 저작권법에 따른 법적 조치가 취해질 수 있습니다.</div>\n</footer>\n\n</div>"

}

}

/* ── 고객 맞춤 정보 (링크에 담겨 전달됨) ── */
var TRIP = (function(){
  try{
    var m = /[#?&]d=([^&]+)/.exec(location.hash + location.search);
    if(!m) return null;
    var j = LZString.decompressFromEncodedURIComponent(m[1]);
    return j ? JSON.parse(j) : null;
  }catch(e){ return null; }
})();
function tripCountries(){
  if(!TRIP || !TRIP.c || !TRIP.c.length) return null;
  var o = []; TRIP.c.forEach(function(x){ var k = x.split('|')[0]; if(o.indexOf(k) < 0) o.push(k); });
  return o;
}
function tripCities(){
  if(!TRIP || !TRIP.c || !TRIP.c.length) return null;
  return TRIP.c.map(function(x){ return x.split('|')[1]; });
}
(function(){
  if(!TRIP) return;
  var stub = document.querySelector('.stub');
  if(!stub) return;
  var el = document.createElement('div');
  el.className = 'cust';
  var h = '<b>' + (TRIP.n || '고객님') + '</b>';
  if(TRIP.p) h += '<span>' + TRIP.p + '</span>';
  var cs = tripCities();
  if(cs) h += '<span>' + cs.join(' · ') + '</span>';
  el.innerHTML = h;
  stub.insertBefore(el, stub.firstChild);
})();

/* ── 이미지 갤러리 ── PC는 나란히, 모바일은 좌우 스와이프 */
var galId = 0;
function gallery(list, alt){
  if(!list || !list.length) return '';
  var id = 'g' + (++galId);
  var h = '<div class="gal" id="' + id + '"><div class="galtrack">';
  list.forEach(function(src, i){
    h += '<figure class="galitem"><img src="' + src + '" alt="' + esc(alt) +
      '" loading="lazy" onerror="galFail(this)"></figure>';
  });
  h += '</div><div class="galdots"></div></div>';
  return h;
}
/* 없는 이미지는 통째로 제거하고, 전부 없으면 자리 표시 */
function galFail(img){
  var item = img.parentNode;
  var gal = item.parentNode.parentNode;
  item.parentNode.removeChild(item);
  var track = gal.querySelector('.galtrack');
  if(!track || !track.children.length){
    gal.innerHTML = '<div class="ph"><b>이미지 자리</b><span>' +
      esc(img.getAttribute('src')) + '</span></div>';
    gal.classList.add('galempty');
    return;
  }
  syncDots(gal);
}
function syncDots(gal){
  var track = gal.querySelector('.galtrack');
  var dots = gal.querySelector('.galdots');
  if(!track || !dots) return;
  var n = track.children.length;
  gal.setAttribute('data-n', n);
  if(n < 2){ dots.innerHTML = ''; return; }
  var html = '';
  for(var i = 0; i < n; i++) html += '<i' + (i === 0 ? ' class="on"' : '') + '></i>';
  dots.innerHTML = html;
  if(!track.__bound){
    track.__bound = true;
    track.addEventListener('scroll', function(){
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      var ds = dots.querySelectorAll('i');
      for(var k = 0; k < ds.length; k++) ds[k].className = (k === idx ? 'on' : '');
    });
  }
}
function initGalleries(){
  document.querySelectorAll('.gal').forEach(function(g){
    if(!g.classList.contains('galempty')) syncDots(g);
  });
}

function imgFail(el){
  var box = el.parentNode;

function logoFail(el){

  span.textContent = COMPANY.nameEn;
  el.parentNode.replaceChild(span, el);
}
function thumbFail(el){ el.classList.add('empty'); el.src = BLANK; el.onerror = null; }
function shot(src, cap, wide){
  if(!src) return '';
  return '<figure class="shot' + (wide ? ' wide' : '') + '"><span class="box">' +
    '<img src="' + src + '" alt="' + (cap || '') + '" loading="lazy" onerror="imgFail(this)"></span>' +
    (cap ? '<figcaption>' + cap + '</figcaption>' : '') + '</figure>';
}
function thumb(src){
  if(!src) return '';
  return '<img class="thumb" src="' + src + '" alt="" loading="lazy" onerror="thumbFail(this)">';
}

/* ── 고객 맞춤 정보 (링크에 담겨 전달됨) ── */
var TRIP = (function(){
  try{
    var m = /[#?&]d=([^&]+)/.exec(location.hash + location.search);
    if(!m) return null;
    var j = LZString.decompressFromEncodedURIComponent(m[1]);
    return j ? JSON.parse(j) : null;
  }catch(e){ return null; }
})();
function tripCountries(){
  if(!TRIP || !TRIP.c || !TRIP.c.length) return null;
  var o = []; TRIP.c.forEach(function(x){ var k = x.split('|')[0]; if(o.indexOf(k) < 0) o.push(k); });
  return o;
}
function tripCities(){

function validateQuote(){
  var errs = [], warns = [];
  var name = document.getElementById('fn').value.trim();
  var start = document.getElementById('qstart').value;
  var pax = Number(document.getElementById('qpax').value) || 0;
  var r = calc();

  if(!name) errs.push({f:'fn', m:'고객명이 비어 있습니다'});
  if(!start) errs.push({f:'qstart', m:'가는 편 항공 일정을 입력해 주세요 (현지 시작일이 자동 설정됩니다)'});
  var fl = readFlights();
  if(!fl.out) warns.push('가는 편 항공 일정이 비어 있습니다');
  if(!fl.back) warns.push('오는 편 항공 일정이 비어 있습니다');
  if(pax < 1) errs.push({f:'qpax', m:'인원을 입력해 주세요'});
  if(!r.nights) errs.push({f:'stayrows', m:'도시별 박수를 입력해 주세요'});

  r.plan.rows.forEach(function(x){
    if(x.nights > 0 && !x.cost) errs.push({f:'stayrows', m: x.city + ' 1박 원가가 비어 있습니다'});
    if(x.nights > 0 && !x.hotel) warns.push(x.city + ' 호텔이 선택되지 않았습니다');
  });
  Array.prototype.forEach.call(document.querySelectorAll('#trainrows .row'), function(rw, i){
    if(!Number(rw.querySelector('input').value))
      errs.push({f:'trainrows', m: (rw.querySelector('.legname').childNodes[0].textContent || '이동 구간') + ' 요금이 비어 있습니다'});
  });
  if(!PLACED.length) warns.push('배치된 투어나 픽업이 없습니다');
  PLACED.forEach(function(p){
    var meta = findTourMeta(p.name);
    var d = keyToDate(p.key);
    if(meta && meta.t.note && meta.t.note.indexOf('일요일 불가') > -1 && d && d.getDay() === 0)
      errs.push({f:'planner', m: p.name.split(' · ').pop() + '은 일요일에 진행할 수 없습니다'});
  });
  if(!document.getElementById('qvalid').value.trim()) warns.push('유효기간이 비어 있어 자동 설정됩니다');
  return {errs: errs, warns: warns, r: r};
}

/* 검색 · 기간으로 걸러냅니다 */
function filterLog(){
  var q = (gv('logQ') || '').trim().toLowerCase();
  var period = gv('logPeriod') || '';
  var today = new Date(); today.setHours(0,0,0,0);

  return LOG.filter(function(x){
    if(q){
      var hay = ((x.name || '') + ' ' + (x.no || '')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    if(period){
      var d = x.start ? sToDate(x.start) : null;
      if(!d) return period === '' ;
      var diff = Math.round((d - today) / 86400000);
      if(period === 'm3'  && !(diff >= 0 && diff <= 92)) return false;
      if(period === 'm6'  && !(diff >= 0 && diff <= 184)) return false;
      if(period === 'past' && diff >= 0) return false;
    }
    return true;
  });
}

function renderLog(){
  var el = document.getElementById('loglist');
  var w = document.getElementById('logwarn');
  if(w) w.style.display = LOG.length ? '' : 'none';
  if(!LOG.length){ el.innerHTML = '<div class="empty-log">발행한 견적서가 없습니다</div>'; return; }

          (x.url ? '<button type="button" class="gh" onclick="copyText(\'' +

function exportLog(){
  if(!LOG.length){ toast('발행 기록이 없습니다'); return; }
  var head = '발행일시,견적번호,고객명,출발일,인원,담당자,매입원가,고객청구액,수익,유효기간,발송단계,견적서링크,복원코드\n';
  var body = LOG.map(function(x){
    return [x.t, x.no, x.name, x.start || '', x.pax, x.staff || '', x.cost || 0, x.amt, x.profit || 0,
            x.valid, x.stages, x.url || '', x.code || '']
      .map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + head + body], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '견적서발행기록_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importLog(input){
  var file = input.files[0];
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var lines = String(r.result).replace(/^\ufeff/, '').split(/\r?\n/).filter(Boolean).slice(1);
      var add = lines.map(function(l){
        var v = l.match(/("([^"]|"")*"|[^,]*)/g).filter(function(x, i){ return i % 2 === 0; })
                 .map(function(x){ return x.replace(/^"|"$/g, '').replace(/""/g, '"'); });
        /* 예전 형식(9칸)과 새 형식(12칸) 모두 읽습니다 */
        if(v.length >= 13){
          return {t:v[0], no:v[1], name:v[2], start:v[3], pax:v[4], staff:v[5],
                  cost:Number(v[6]) || 0, amt:Number(v[7]) || 0, profit:Number(v[8]) || 0,
                  valid:v[9], stages:v[10], url:v[11], code:v[12]};
        }
        if(v.length >= 12){
          return {t:v[0], no:v[1], name:v[2], pax:v[3], staff:v[4], cost:Number(v[5]) || 0,
                  amt:Number(v[6]) || 0, profit:Number(v[7]) || 0, valid:v[8], stages:v[9],
                  url:v[10], code:v[11]};
        }
        return {t:v[0], no:v[1], name:v[2], pax:v[3], cost:Number(v[4]) || 0,
                amt:Number(v[5]) || 0, profit:Number(v[6]) || 0, valid:v[7], stages:v[8]};
      });
      /* 같은 견적번호 · 같은 발행일시는 한 번만 남깁니다 */
      var seen = {}, merged = [];
      add.concat(LOG).forEach(function(x){
        var k = (x.no || '') + '|' + (x.t || '');
        if(seen[k]) return;
        seen[k] = 1; merged.push(x);
      });
      merged.sort(function(a, b){ return String(b.t).localeCompare(String(a.t)); });
      var dup = (add.length + LOG.length) - merged.length;
      LOG = merged;
      renderLog();
      toast(add.length + '건을 불러왔습니다' + (dup ? ' (중복 ' + dup + '건 제외)' : ''));
    }catch(e){ toast('CSV를 읽지 못했습니다'); }
    input.value = '';
  };
  r.readAsText(file);
}

function buildMailBody(links, base){
  var name = customerName() || '고객';
  var b = name + ', 안녕하세요.\n' + COMPANY.name + ' ' + staffName() + '입니다.\n\n';
  b += '상담해 주신 유럽 신혼여행 견적서를 보내드립니다.\n\n';
  var span = document.getElementById('tripspan').textContent;
  if(span && span.indexOf('입력') < 0) b += '· 여행 기간 : ' + span + '\n';
  b += '· 견적번호 : ' + (gv('qno') || '-') + '\n';
  b += '· 유효기간 : ' + ((gv('qvalid') || '').trim() || defaultValid()) + '\n\n';
  links.forEach(function(l){
    b += '[' + l.t + ']\n' + l.url + '\n\n';
  });
  b += '일정과 포함 사항을 확인하시고 궁금하신 점은 편하게 연락 주세요.\n\n';
  b += '───────────────\n';
  b += COMPANY.name + ' ' + COMPANY.nameEn + '\n';
  b += '담당 ' + staffName() + ' · ' + COMPANY.tel + '\n';
  b += COMPANY.email + '\n' + COMPANY.site + '\n';
  return b;
}

  var name = customerName() || '고객';
  var subj = '[' + COMPANY.name + '] ' + name + ' 유럽 신혼여행 견적서 · ' + (gv('qno') || '');
  var body = buildMailBody(LAST_LINKS);
  var url = 'mailto:' + encodeURIComponent(to) +
    '?subject=' + encodeURIComponent(subj) +
    '&body=' + encodeURIComponent(body);
  if(url.length > 1900){
    copyText(body);
    alert('본문이 길어 메일 앱에 자동으로 담기 어렵습니다.\n\n' +
          '본문을 복사했으니 메일 앱에서 붙여넣어 주세요.');
    window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subj);
    return;
  }
  window.location.href = url;
  toast('메일 앱을 엽니다');
}
function copyMailBody(){
  if(!LAST_LINKS.length){ toast('먼저 링크를 만들어 주세요'); return; }
  copyText(buildMailBody(LAST_LINKS));
}

/* 복사와 토스트 */
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast('복사했습니다'); },
                                          function(){ fallback(t); });
  } else { fallback(t); }
}
function fallback(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ toast('복사에 실패했습니다. 직접 선택해 주세요'); }
  document.body.removeChild(ta);
}
var tEl = document.getElementById('toast'), tTimer;
function toast(m){
  tEl.textContent = m; tEl.classList.add('on');
  clearTimeout(tTimer); tTimer = setTimeout(function(){ tEl.classList.remove('on'); }, 1800);
}
