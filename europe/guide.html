<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#3182F6; --blueD:#1B64DA; --blueL:#E8F3FF; --blueLL:#F4F9FF;
  --red:#F04452; --redL:#FEECEE;
  --amber:#C79A20; --amberL:#FFF8E6;
  --g900:#191F28; --g800:#26303B; --g700:#333D4B; --g600:#4E5968;
  --g500:#6B7684; --g400:#8B95A1; --g300:#B0B8C1;
  --g200:#E5E8EB; --g100:#F2F4F6; --g50:#F9FAFB; --w:#fff;
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,'Segoe UI',sans-serif;
  --r:16px;
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--g100);color:var(--g900);font-family:var(--font);
  font-size:16px;line-height:1.7;letter-spacing:-.3px;padding-bottom:72px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;background:var(--g100)}
.mono{font-family:var(--font);font-size:12.5px;font-weight:600;letter-spacing:-.1px;text-transform:none}

/* ── 헤더 ── */
.stub{background:var(--w);padding:26px 20px 28px}
@media(min-width:600px){.stub{padding:30px 28px 30px}}
.stub-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.stub-top .mono:first-child{background:var(--blueL);color:var(--blueD);
  padding:5px 11px;border-radius:100px;font-size:12.5px;font-weight:700}
.stub-top .mono:last-child{color:var(--g400);font-weight:600}
.stub h1{font-weight:800;font-size:clamp(24px,6.6vw,33px);line-height:1.4;
  letter-spacing:-1.2px;color:var(--g900);margin-bottom:14px}
.stub h1 em{font-style:normal;color:var(--blue)}
.lede{color:var(--g600);font-size:15.5px;line-height:1.75;max-width:44em;letter-spacing:-.35px}

/* 여정선 */
.route{margin-top:24px;padding-top:20px;border-top:1px solid var(--g200)}
.route-line{display:flex}
.rt{flex:1;position:relative;text-align:center;padding-top:17px}
.rt::before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--g200)}
.rt:first-child::before{left:50%}
.rt:last-child::before{right:50%}
.rt::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--g200)}
.rt.on::after{background:var(--blue);box-shadow:0 0 0 4px var(--blueL)}
.rt span{font-size:12px;font-weight:600;color:var(--g400);display:block;letter-spacing:-.3px}
.rt.on span{color:var(--blue);font-weight:700}

/* ── 네비 ── */
.nav{position:sticky;top:0;z-index:30;background:rgba(242,244,246,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--g200)}
.nav-in{display:flex;gap:7px;overflow-x:auto;padding:11px 20px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;font-size:13.5px;font-weight:600;text-decoration:none;letter-spacing:-.3px;
  color:var(--g600);background:var(--w);padding:8px 14px;border-radius:100px;transition:.16s}
.nav a.on{background:var(--blue);color:#fff}

/* ── 섹션 ── */
.sec{padding:40px 20px 4px;scroll-margin-top:62px}
@media(min-width:600px){.sec{padding:44px 28px 4px}}
.sec-h{margin-bottom:18px}
.sec-h .eyebrow{display:inline-block;color:var(--blue);font-size:13px;font-weight:700;
  letter-spacing:-.2px;margin-bottom:6px}
.sec-h h2{font-weight:800;font-size:clamp(21px,5.4vw,26px);line-height:1.42;
  letter-spacing:-1px;color:var(--g900)}
.sec-h p{color:var(--g600);font-size:15px;margin-top:8px;letter-spacing:-.35px}

.card{background:var(--w);border-radius:var(--r);padding:20px 22px;margin-bottom:10px}
.card h3{font-size:17px;font-weight:700;margin-bottom:8px;letter-spacing:-.6px;color:var(--g900)}
.card p{color:var(--g600);font-size:15px;letter-spacing:-.35px}
.grid{display:grid;gap:10px}
@media(min-width:720px){.card.hi{background:#F0FAF3;border-color:#CBEAD8}\n.card.hi h3{color:#1E7A44}\n.grid.g2{grid-template-columns:1fr 1fr}}

/* ── 아코디언 ── */
details{background:var(--w);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:17px 18px;display:flex;gap:12px;align-items:center;
  min-height:58px;font-weight:700;font-size:16px;letter-spacing:-.5px;color:var(--g900)}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--blue);outline-offset:-3px;border-radius:var(--r)}
.sm-lab{flex:1}
.sm-lab small{display:block;font-weight:500;font-size:13.5px;color:var(--g400);
  margin-top:2px;letter-spacing:-.3px;line-height:1.5}
.chev{flex:0 0 auto;width:18px;height:18px;color:var(--g300);transition:transform .22s}
details[open] .chev{transform:rotate(180deg);color:var(--blue)}
.dbody{padding:0 18px 20px;font-size:15px;color:var(--g600);letter-spacing:-.35px}
.dbody>*+*{margin-top:12px}
.dbody strong{color:var(--g900);font-weight:700}

/* ── 목록 ── */
ul.list{list-style:none}
ul.list li{position:relative;padding-left:15px;margin-top:8px}
ul.list li::before{content:"";position:absolute;left:2px;top:11px;width:4px;height:4px;
  border-radius:50%;background:var(--g300)}
ul.list.inc li::before{background:var(--blue)}
ul.list.exc li::before{background:var(--g300)}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:34px;margin-top:14px;
  color:var(--g600);font-size:15px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  color:var(--blueD);background:var(--blueL);border-radius:7px}
ol.now{list-style:none;counter-reset:n}
ol.now li{counter-increment:n;position:relative;padding-left:34px;margin-top:14px}
ol.now li::before{content:counter(n);position:absolute;left:0;top:2px;width:23px;height:23px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  color:#fff;background:var(--blue);border-radius:50%}
ol.now li strong{display:block;color:var(--g900);font-weight:700}

/* ── 키-값 ── */
.kv{}
.kv div{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--g100);font-size:15px}
.kv div:last-child{border-bottom:0;padding-bottom:0}
.kv div:first-child{padding-top:0}
.kv dt{flex:0 0 84px;color:var(--g400);font-size:14px;font-weight:600;letter-spacing:-.3px}
.kv dd{flex:1;color:var(--g700);letter-spacing:-.35px}

/* ── 콜아웃 ── */
.note{background:var(--blueL);border-radius:12px;padding:15px 16px;font-size:14.5px;
  color:var(--blueD);letter-spacing:-.35px;line-height:1.65}
.note strong{color:var(--blueD);font-weight:700}
/* 투어 불포함 — 정보 전달용이라 차분한 회색으로 둡니다 */
.exclude{background:var(--g50);border:1px solid var(--g200);border-radius:12px;
  padding:15px 16px;font-size:14.5px;color:var(--g600);
  letter-spacing:-.35px;line-height:1.65}
.exclude strong{color:var(--g700);font-weight:700}

.warn{background:var(--redL);border-radius:12px;padding:15px 16px;font-size:14.5px;
  color:#C0353F;letter-spacing:-.35px;line-height:1.65}
.warn strong{color:#A82B34;font-weight:700}
.todo{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:-.2px;color:var(--amber);
  background:var(--amberL);border-radius:6px;padding:2px 8px;vertical-align:middle}

/* ── 태그 ── */
.city-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12.5px;font-weight:600;letter-spacing:-.3px;background:var(--g100);
  border-radius:7px;padding:4px 9px;color:var(--g500)}
.tag.n{background:var(--blueL);color:var(--blueD)}

/* ── 탭 ── */
.country-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.country-tabs::-webkit-scrollbar{display:none}
.country-tabs button{flex:0 0 auto;font-family:var(--font);font-size:14.5px;font-weight:700;
  background:var(--w);border:0;color:var(--g500);padding:9px 16px;border-radius:100px;
  cursor:pointer;transition:.16s;letter-spacing:-.4px}
.country-tabs button.on{background:var(--blue);color:#fff}

/* ── 버튼 ── */
.tools{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.tools button{font-family:var(--font);font-size:13.5px;font-weight:600;background:var(--w);
  border:0;color:var(--g600);padding:9px 15px;border-radius:10px;cursor:pointer;letter-spacing:-.3px}
.tools button:hover{background:var(--blueL);color:var(--blueD)}

/* ── 체크리스트 ── */
.chk{list-style:none}
.chk li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--g100);font-size:15px}
.chk li:last-child{border-bottom:0;padding-bottom:0}
.chk input{flex:0 0 auto;width:20px;height:20px;margin-top:3px;accent-color:var(--blue);cursor:pointer}
.chk label{flex:1;cursor:pointer;color:var(--g700);letter-spacing:-.35px}
.chk input:checked + label{color:var(--g300);text-decoration:line-through}

/* ── 타임라인(2단계) ── */
.tl{position:relative;padding-left:64px}
.tl::before{content:"";position:absolute;left:47px;top:12px;bottom:12px;width:2px;background:var(--g200)}
.tl-item{position:relative;margin-bottom:8px}
.tl-item .dday{position:absolute;left:-64px;top:19px;width:44px;text-align:right;
  font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.3px}
.tl-item::before{content:"";position:absolute;left:-19px;top:26px;width:8px;height:8px;
  border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--g100)}
@media(max-width:400px){.tl{padding-left:56px}.tl::before{left:39px}
  .tl-item .dday{left:-56px;width:38px;font-size:12.5px}.tl-item::before{left:-19px}}

/* ── 일정 카드(3단계) ── */
.day{background:var(--w);border-radius:var(--r);padding:17px 18px;margin-bottom:8px;display:flex;gap:14px}
.day-d{flex:0 0 50px;font-size:12.5px;color:var(--blue);font-weight:700;letter-spacing:-.3px;padding-top:2px}
.day-b{flex:1;min-width:0}
.day-b h4{font-size:16.5px;font-weight:700;letter-spacing:-.6px;margin-bottom:3px;color:var(--g900)}
.day-b .mv{font-size:14px;font-weight:600;color:var(--g700);background:var(--g50);
  border-radius:10px;padding:9px 11px;margin-top:8px;display:block;letter-spacing:-.35px;
  overflow-x:auto;white-space:nowrap}
.day-b .st{font-size:14px;color:var(--g500);margin-top:5px;letter-spacing:-.35px}

/* ── 연락처 카드 ── */
.contact{background:var(--w);border-radius:var(--r);padding:20px;margin-bottom:10px}
.contact h3{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--g900);letter-spacing:-.6px}
.contact a{color:var(--blue)}

/* ── 긴급(4단계) ── */
.sos{margin:16px 20px 0;background:var(--red);color:#fff;border-radius:var(--r);padding:18px 20px;
  display:flex;align-items:center;gap:16px}
.sos b{font-size:30px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.sos span{font-size:14px;line-height:1.6;color:#FFE3E5;letter-spacing:-.35px}
.quick{padding:24px 20px 4px}
.quick-h{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;letter-spacing:-.2px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.qgrid{grid-template-columns:repeat(4,1fr)}}
.qbtn{background:var(--w);border:0;border-radius:14px;padding:16px 14px;text-align:left;
  cursor:pointer;font-family:var(--font);color:var(--g900);font-size:15px;font-weight:700;
  letter-spacing:-.5px;line-height:1.4;transition:.15s;min-height:74px}
.qbtn small{display:block;font-weight:500;font-size:12.5px;color:var(--g400);margin-top:4px;letter-spacing:-.3px}
.qbtn:hover,.qbtn:focus-visible{background:var(--blueL);outline:none}
.qbtn:hover small,.qbtn:focus-visible small{color:var(--blueD)}
.search{padding:20px 20px 0}
.search input{width:100%;font-family:var(--font);font-size:16px;padding:15px 16px;border-radius:12px;
  border:0;background:var(--w);color:var(--g900);letter-spacing:-.4px}
.search input::placeholder{color:var(--g300)}
.search input:focus{outline:2px solid var(--blue);outline-offset:-2px}
.search p{font-size:13px;color:var(--g400);margin-top:8px;letter-spacing:-.3px;padding-left:2px}
details.hit{box-shadow:0 0 0 2px var(--blue)}
.say{background:var(--blueLL);border-radius:12px;padding:15px 16px;font-size:15px;
  line-height:1.6;color:var(--g800);letter-spacing:-.3px}
.say b{display:block;font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:6px;letter-spacing:-.2px}


.when{background:var(--blueL);border-radius:12px;padding:14px 16px;margin-bottom:16px;
  font-size:14.5px;color:var(--blueD);letter-spacing:-.35px;line-height:1.6;font-weight:600}
.when b{display:block;font-size:12.5px;font-weight:700;margin-bottom:3px;color:var(--blue)}

.cust{background:var(--g50);border-radius:12px;padding:13px 15px;margin-bottom:16px}
.cust b{display:block;font-size:16.5px;font-weight:800;color:var(--g900);letter-spacing:-.6px}
.cust span{display:block;font-size:13.5px;color:var(--g500);letter-spacing:-.3px;margin-top:3px}
.brand{background:var(--w);border-radius:var(--r);padding:18px 20px;margin:0 16px}
.brand b{display:block;font-size:15.5px;font-weight:800;color:var(--g900);letter-spacing:-.5px;margin-bottom:2px}
.brand span{font-size:14px;color:var(--g500);letter-spacing:-.3px}
.brand a{font-weight:700}

/* ── 이미지 자리 ── */
.shot{margin:0 0 14px}
.shot .box{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--g100)}
.shot .box img{width:100%;height:100%;object-fit:cover;display:block}
.shot figcaption{font-size:13px;color:var(--g400);margin-top:8px;letter-spacing:-.3px;line-height:1.55}
.shot.wide .box{aspect-ratio:21/9}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;background:var(--g50);border:1.5px dashed var(--g200);border-radius:12px;text-align:center;padding:14px}
.ph b{font-size:13px;font-weight:700;color:var(--g400);letter-spacing:-.3px}
.ph span{font-size:12px;color:var(--g300);word-break:break-all;letter-spacing:-.2px}
.thumb{width:50px;height:50px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--g100)}
.thumb.empty{border:1.5px dashed var(--g200);background:var(--g50)}
footer{margin-top:48px;padding:26px 20px 34px;color:var(--g400);font-size:13.5px;
  letter-spacing:-.3px;line-height:1.7}
footer .mono{color:var(--g600);display:block;margin-bottom:8px;font-weight:700;font-size:13.5px}
a{color:var(--blue)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  body{background:#fff;font-size:11pt;padding:0}
  .nav,.tools,.search,.quick{display:none}
  .stub{padding:0 0 14px}
  .stub h1{font-size:19pt}
  details{break-inside:avoid;border:1px solid #ddd;margin-bottom:6px}
  details>.dbody{display:block!important}
  .sec{padding:12px 0 0}
  .contact{border:2px solid #000}
  .sos{border:2px solid #000;background:#fff;color:#000}
  .sos span{color:#000}
}

.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--g700);margin-bottom:7px;letter-spacing:-.3px}
.field input{width:100%;font-family:var(--font);font-size:16px;padding:14px 15px;border-radius:12px;
  border:1px solid var(--g200);background:var(--w);color:var(--g900);letter-spacing:-.4px}
.field input:focus{outline:2px solid var(--blue);outline-offset:-2px;border-color:transparent}
.field small{display:block;font-size:12.5px;color:var(--g400);margin-top:6px;letter-spacing:-.3px}

.picker{background:var(--w);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.picker>h4{font-size:15.5px;font-weight:700;padding:15px 18px 11px;letter-spacing:-.5px;
  display:flex;align-items:center;gap:9px}
.picker>h4 .cnt{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blueL);
  padding:2px 9px;border-radius:100px}
.picker>h4 button{margin-left:auto;font-family:var(--font);font-size:12.5px;font-weight:600;
  background:var(--g100);border:0;color:var(--g600);padding:6px 11px;border-radius:8px;cursor:pointer}
.cities{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 17px}
.cities label{position:relative;cursor:pointer}
.cities input{position:absolute;opacity:0;width:0;height:0}
.cities span{display:block;font-size:14px;font-weight:600;letter-spacing:-.4px;color:var(--g600);
  background:var(--g100);padding:9px 14px;border-radius:100px;transition:.14s}
.cities input:checked + span{background:var(--blue);color:#fff}
.cities input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}

.bar{position:sticky;bottom:0;z-index:40;background:rgba(242,244,246,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--g200)}
.bar .sum{font-size:13.5px;color:var(--g500);margin-bottom:9px;letter-spacing:-.3px}
.bar .sum b{color:var(--g900);font-weight:700}
.cta{width:100%;font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.5px;
  background:var(--blue);color:#fff;border:0;padding:16px;border-radius:14px;cursor:pointer}
.cta:disabled{background:var(--g200);color:var(--g400);cursor:not-allowed}
.cta.ghost{background:var(--w);color:var(--g700);font-size:15px;padding:13px;margin-top:8px}

.linkrow{background:var(--w);border-radius:14px;padding:15px 16px;margin-bottom:8px}
.linkrow .t{font-size:15px;font-weight:700;color:var(--g900);letter-spacing:-.5px;margin-bottom:3px}
.linkrow .w{font-size:13px;color:var(--g400);letter-spacing:-.3px;margin-bottom:10px}
.linkrow .u{font-size:12.5px;color:var(--g500);background:var(--g50);border-radius:9px;
  padding:9px 11px;word-break:break-all;line-height:1.5;margin-bottom:10px;max-height:76px;overflow:auto}
.linkrow .ulen{font-size:12px;font-weight:600;letter-spacing:-.2px;margin-bottom:10px;
  color:#2E9E5B}
.linkrow .btns{display:flex;gap:7px}
.linkrow .btns button,.linkrow .btns a{flex:1;text-align:center;text-decoration:none;
  font-family:var(--font);font-size:13.5px;font-weight:700;letter-spacing:-.3px;
  border:0;padding:11px;border-radius:10px;cursor:pointer}
.linkrow .btns button{background:var(--blueL);color:var(--blueD)}
.linkrow .btns a{background:var(--g100);color:var(--g600)}

textarea.msg{width:100%;min-height:190px;font-family:var(--font);font-size:14px;line-height:1.7;
  padding:15px;border-radius:12px;border:1px solid var(--g200);background:var(--w);
  color:var(--g700);letter-spacing:-.3px;resize:vertical}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  background:var(--g900);color:#fff;font-size:14px;font-weight:600;letter-spacing:-.3px;
  padding:12px 20px;border-radius:100px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
#result{display:none}


/* ── 견적/일정 입력 ── */
.rowset{background:var(--w);border-radius:var(--r);padding:16px;margin-bottom:10px}
.rowhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.rowhead h4{font-size:15.5px;font-weight:700;letter-spacing:-.5px}
.rowhead .addbtn{margin-left:auto;font-family:var(--font);font-size:13px;font-weight:700;
  background:var(--blueL);border:0;color:var(--blueD);padding:8px 14px;border-radius:9px;cursor:pointer}
.row{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--g100);position:relative}
.row:last-of-type{border-bottom:0}
.row.itin{grid-template-columns:1fr 1fr}
.row.cost{grid-template-columns:1fr 1fr}
.row .calcline{grid-column:1/-1;font-size:13px;color:var(--g500);letter-spacing:-.3px;
  background:var(--g50);border-radius:9px;padding:8px 11px;display:flex;justify-content:space-between;gap:10px}
.row .calcline b{color:var(--g900);font-weight:700}
.marginbar{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.marginbar span{font-size:13.5px;font-weight:600;color:var(--g600);letter-spacing:-.3px}
.marginbar input{width:78px;font-family:var(--font);font-size:14.5px;padding:9px 11px;
  border-radius:9px;border:1px solid var(--g200);text-align:right}
.marginbar button{font-family:var(--font);font-size:13px;font-weight:700;background:var(--blueL);
  border:0;color:var(--blueD);padding:9px 14px;border-radius:9px;cursor:pointer}
.inner{background:var(--g900);border-radius:var(--r);padding:18px;margin-bottom:10px;color:#fff}
.inner h4{font-size:14px;font-weight:700;color:#8FB4F5;letter-spacing:-.3px;margin-bottom:12px;
  display:flex;align-items:center;gap:7px}
.inner h4 em{font-style:normal;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.12);
  padding:3px 8px;border-radius:6px;color:#C9D6EA}
.inner .ir{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px;
  border-bottom:1px solid rgba(255,255,255,.09);letter-spacing:-.35px}
.inner .ir:last-child{border-bottom:0;padding-bottom:0}
.inner .ir span{color:#A8B4C4}
.inner .ir b{font-weight:700;color:#fff}
.inner .ir.hi b{font-size:18px;color:#7FB0FF;letter-spacing:-.6px}
.isplit{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.isplit>b{display:block;font-size:12px;font-weight:700;color:#8FB4F5;letter-spacing:-.2px;margin-bottom:6px}
@media(min-width:640px){.row.itin{grid-template-columns:.8fr 1fr 1.2fr 1.2fr}
  .row.cost{grid-template-columns:.75fr 1.5fr .5fr .9fr .9fr}}
.row input,.row select{width:100%;font-family:var(--font);font-size:14.5px;padding:11px 12px;
  border-radius:10px;border:1px solid var(--g200);background:var(--w);color:var(--g900);letter-spacing:-.3px}
.row input:focus,.row select:focus{outline:2px solid var(--blue);outline-offset:-2px;border-color:transparent}
.row .del{grid-column:1/-1;justify-self:end;font-family:var(--font);font-size:12.5px;font-weight:600;
  background:none;border:0;color:var(--g400);cursor:pointer;padding:2px 0}
.row .del:hover{color:var(--red)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 0;
  margin-top:6px;border-top:2px solid var(--g900)}
.total span{font-size:14px;font-weight:600;color:var(--g600)}
.total b{font-size:22px;font-weight:800;color:var(--g900);letter-spacing:-1px}
.subtotal{display:flex;justify-content:space-between;font-size:13.5px;color:var(--g400);margin-top:6px}

/* ── 단계 선택 ── */
.stagepick{display:grid;gap:8px}
.pickgroup{margin-bottom:14px}
.pickgroup:last-child{margin-bottom:0}
.pickgroup h5{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.2px;margin-bottom:8px}
.pickgroup label{margin-bottom:7px}
.stagepick label{position:relative;cursor:pointer;display:block}
.stagepick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;
  clip:rect(0 0 0 0);overflow:hidden}
.stagepick .sp{display:block;background:var(--w);border-radius:14px;padding:15px 46px 15px 17px;
  transition:.14s;border:2px solid transparent;position:relative}
.stagepick .sp::after{content:"";position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;border:2px solid var(--g200);background:var(--w)}
.stagepick input:checked + .sp::after{border-color:var(--blue);background:var(--blue);
  box-shadow:inset 0 0 0 3px var(--w)}
.stagepick input:focus-visible + .sp{outline:2px solid var(--blue);outline-offset:2px}
.stagepick input:checked + .sp{border-color:var(--blue);background:var(--blueLL)}
.stagepick .sp b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.5px;color:var(--g900)}
.stagepick .sp span{display:block;font-size:13px;color:var(--g400);margin-top:2px;letter-spacing:-.3px}
.stagepick input:checked + .sp b{color:var(--blueD)}

/* ── 모달 ── */
.modal{position:fixed;inset:0;background:rgba(15,20,28,.5);z-index:80;display:none;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--w);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.8px;margin-bottom:6px}
.sheet .sub{font-size:14px;color:var(--g500);letter-spacing:-.35px;margin-bottom:16px}
.sheet .foot{display:flex;gap:8px;margin-top:18px}
.sheet .foot button{flex:1;font-family:var(--font);font-size:15.5px;font-weight:700;border:0;
  padding:15px;border-radius:12px;cursor:pointer;letter-spacing:-.4px}
.sheet .foot .cancel{background:var(--g100);color:var(--g600);flex:0 0 34%}
.sheet .foot .ok{background:var(--blue);color:#fff}
.sheet .foot .ok:disabled{background:var(--g200);color:var(--g400);cursor:not-allowed}

/* ── 발행 기록 ── */
.log{background:var(--w);border-radius:var(--r);padding:6px 16px;margin-bottom:10px}
.logrow{padding:14px 0;border-bottom:1px solid var(--g100)}
.logrow:last-child{border-bottom:0}
.logrow .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.logrow .no{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.2px}
.logrow .amt{font-size:15.5px;font-weight:800;color:var(--g900);letter-spacing:-.5px}
.logrow .l2{font-size:14px;color:var(--g700);font-weight:600;margin-top:3px;letter-spacing:-.35px}
.logrow .l3{font-size:12.5px;color:var(--g400);margin-top:3px;letter-spacing:-.3px}
.empty-log{text-align:center;color:var(--g300);font-size:14px;padding:26px 0}

/* ── 견적서 문서 ── */
.qhead{background:var(--w);padding:26px 20px 28px}
@media(min-width:600px){.qhead{padding:32px 28px 30px}}
.qhead .qno{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.2px;margin-bottom:8px}
.qhead h1{font-size:clamp(24px,6.6vw,32px);font-weight:800;letter-spacing:-1.2px;line-height:1.35;margin-bottom:14px}
.qmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qmeta div{background:var(--g50);border-radius:11px;padding:11px 13px}
.qmeta dt{font-size:12px;color:var(--g400);font-weight:600;letter-spacing:-.2px}
.qmeta dd{font-size:14.5px;color:var(--g900);font-weight:700;letter-spacing:-.4px;margin-top:2px}
.qitem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--g100)}
.qitem:last-child{border-bottom:0}
.qitem .g{flex:0 0 56px;font-size:12px;font-weight:700;color:var(--blueD);background:var(--blueL);
  border-radius:7px;padding:4px 0;text-align:center;height:26px;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden}
.qitem .d{flex:1;min-width:0}
.qitem .d b{display:block;font-size:15px;font-weight:600;color:var(--g900);letter-spacing:-.4px}
.qitem .d span{font-size:12.5px;color:var(--g400);letter-spacing:-.3px}
.qitem .p{flex:0 0 auto;font-size:15px;font-weight:700;color:var(--g900);letter-spacing:-.4px;text-align:right}


.readbox{background:var(--g50);border-radius:10px;padding:13px 14px;font-size:14.5px;
  font-weight:700;color:var(--g900);letter-spacing:-.4px}
.sd-loc{font-size:12px;font-weight:600;color:#1E7A44;background:#DCF2E4;
  padding:3px 8px;border-radius:6px;margin-right:auto}
.sd-loc:empty{display:none}
.maplink.big{display:inline-block;font-size:13.5px;font-weight:700;padding:10px 16px;
  border-radius:10px;text-decoration:none}
.maplink{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;
  background:var(--blueL);padding:3px 8px;border-radius:6px;margin-right:8px}
.hint{font-size:13px;color:var(--g400);letter-spacing:-.3px;line-height:1.6;margin-top:10px}
.row.stay{grid-template-columns:1fr 1fr}
.row.leg{grid-template-columns:1fr}
.row.etc{grid-template-columns:1fr 1fr}
@media(min-width:640px){
  .row.stay{grid-template-columns:1.1fr .45fr 1.4fr .9fr}
  .row.leg{grid-template-columns:1.6fr .7fr .9fr}
  .row.etc{grid-template-columns:.75fr 1.6fr .5fr .9fr}}
.staycity{font-size:14.5px;font-weight:700;color:var(--g900);letter-spacing:-.4px;
  display:flex;flex-direction:column;justify-content:center}
.staycity em{font-style:normal;font-size:12px;font-weight:500;color:var(--g400);margin-top:1px}
.legname{font-size:14.5px;font-weight:700;color:var(--g900);letter-spacing:-.4px;
  display:flex;flex-direction:column;justify-content:center}
.legname em{font-style:normal;font-size:12px;font-weight:500;color:var(--g400);margin-top:1px}
.legfare{display:flex;gap:5px;align-items:center}
.legfare .fb{font-size:12px;font-weight:700;color:var(--g300);background:var(--g100);
  padding:6px 10px;border-radius:7px;letter-spacing:-.2px}
.legfare .fb.on{background:var(--blueL);color:var(--blueD)}
.marginbar input[type=range]{flex:1;width:auto;min-width:120px;accent-color:var(--blue);padding:0;border:0}
.marginbar b{font-size:17px;font-weight:800;color:var(--blue);letter-spacing:-.6px;min-width:104px;text-align:right}
.optgroup{margin-bottom:14px}
.optgroup:last-child{margin-bottom:0}
.optgroup h5{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.2px;margin-bottom:8px}
.optrow{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:11px;
  background:var(--g50);margin-bottom:6px;cursor:pointer}
.optrow input{flex:0 0 auto;width:19px;height:19px;margin-top:2px;accent-color:var(--blue);cursor:pointer}
.optrow .ol{flex:1;min-width:0}
.optrow .ol b{display:block;font-size:14.5px;font-weight:600;color:var(--g900);letter-spacing:-.4px}
.optrow .ol em{display:block;font-style:normal;font-size:12px;color:var(--g400);margin-top:2px;letter-spacing:-.2px}
.optrow .ol em.ex{color:var(--g300)}
.optrow .op{flex:0 0 auto;font-size:14.5px;font-weight:700;color:var(--g700);letter-spacing:-.4px}
.optrow input:checked ~ .op{color:var(--blue)}


.optrow{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:11px;
  background:var(--g50);margin-bottom:6px;border:1.5px solid transparent}
.optrow.on{background:var(--blueLL);border-color:var(--blue)}
.optrow .oc{flex:0 0 auto;padding-top:2px;cursor:pointer}
.optrow .oc input{width:19px;height:19px;accent-color:var(--blue);cursor:pointer}
.optrow .ol em.wn{color:var(--amber);font-weight:600}
.optdate{width:100%;max-width:230px;margin-top:8px;font-family:var(--font);font-size:13.5px;
  padding:8px 10px;border-radius:9px;border:1px solid var(--g200);background:var(--w);
  color:var(--g900);letter-spacing:-.3px}
.optrow.on .optdate{border-color:var(--blue)}
.tw{background:var(--redL);border-radius:10px;padding:11px 13px;margin-top:8px;
  font-size:13.5px;color:#C0353F;letter-spacing:-.3px}
.tw b{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.pvday{background:var(--g50);border-radius:12px;padding:13px 15px;margin-bottom:7px}
.pvday .pd{font-size:12.5px;font-weight:700;color:var(--blue);letter-spacing:-.2px}
.pvday .pc{font-size:15px;font-weight:700;color:var(--g900);letter-spacing:-.5px;margin-top:2px}
.pvday .pe{font-size:13.5px;color:var(--g600);letter-spacing:-.3px;margin-top:5px;
  padding-left:11px;position:relative}
.pvday .pe::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;
  border-radius:50%;background:var(--blue)}

.qspan{font-size:15px;font-weight:600;color:var(--blue);letter-spacing:-.4px;margin-bottom:14px}
.urgent{background:#FFF6E8;border-radius:var(--r);padding:20px;border-left:4px solid var(--amber)}
.urgent b{display:block;font-size:16.5px;font-weight:800;color:#8A6A1E;letter-spacing:-.6px;margin-bottom:8px}
.urgent p{font-size:14.5px;color:#7A5F22;letter-spacing:-.35px;line-height:1.7}
.urgent p+p{margin-top:8px}
.urgent strong{font-weight:700;color:#5E4715}
.pricebox{background:var(--g900);border-radius:var(--r);padding:26px 22px;text-align:center;color:#fff}
.pricebox span{display:block;font-size:14px;font-weight:600;color:#8FB4F5;letter-spacing:-.3px}
.pricebox b{display:block;font-size:clamp(30px,8.5vw,42px);font-weight:800;letter-spacing:-2px;margin:6px 0 4px}
.pricebox em{display:block;font-style:normal;font-size:14px;color:#A8B4C4;letter-spacing:-.35px}
.pkgnote{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.15);
  font-size:13.5px;color:#8FB4F5;letter-spacing:-.3px;line-height:1.6}
.list.inc li b,.list.exc li b{display:inline-block;min-width:44px;font-weight:700;
  color:var(--g900);margin-right:4px}
.qday{background:var(--w);border-radius:var(--r);padding:17px 18px;margin-bottom:8px;display:flex;gap:14px}
.qd{flex:0 0 60px;font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:-.3px;padding-top:2px}
.qd em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--g400);margin-top:2px}
.qb{flex:1;min-width:0}
.qb h4{font-size:16.5px;font-weight:700;letter-spacing:-.6px;color:var(--g900);margin-bottom:8px}
.qe{font-size:14.5px;color:var(--g700);letter-spacing:-.35px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.qk{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  letter-spacing:-.2px;margin-top:2px}
.qk.stay{background:var(--g100);color:var(--g500)}
.qk.move{background:#EAF0FF;color:var(--blueD)}
.qk.tour{background:var(--blue);color:#fff}
.qk.air{background:var(--g900);color:#fff}
.qk.snap{background:#8B5CF6;color:#fff}
.qsub{display:block;font-style:normal;font-size:12.5px;color:var(--g400);margin-top:2px;letter-spacing:-.3px}
.whycard{background:var(--w);border-radius:var(--r);padding:19px;margin-bottom:8px}
.whycard b{display:block;font-size:16px;font-weight:700;color:var(--g900);letter-spacing:-.55px;margin-bottom:6px}
.whycard p{font-size:14.5px;color:var(--g600);letter-spacing:-.35px;line-height:1.7}
.review{background:var(--w);border-radius:var(--r);padding:19px;margin-bottom:8px}
.review p{font-size:15px;color:var(--g700);letter-spacing:-.4px;line-height:1.75}
.review .rv{margin-top:12px;padding-top:12px;border-top:1px solid var(--g100)}
.review .rv b{font-size:14px;font-weight:700;color:var(--g900);letter-spacing:-.4px}
.review .rv span{display:block;font-size:12.5px;color:var(--g400);margin-top:2px;letter-spacing:-.3px}
.ctabox{background:var(--blue);border-radius:var(--r);padding:24px 22px;text-align:center;color:#fff;margin-top:10px}
.ctabox b{display:block;font-size:19px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px}
.ctabox p{font-size:14.5px;color:#DCE8FF;letter-spacing:-.35px;line-height:1.7;margin-bottom:16px}
.ctabtn{display:block;background:#fff;color:var(--blueD);font-size:17px;font-weight:800;
  letter-spacing:-.5px;padding:16px;border-radius:13px;text-decoration:none}
.ctabox span{display:block;font-size:13px;color:#BFD4FF;margin-top:12px;letter-spacing:-.3px}


.pday{background:var(--g50);border-radius:13px;padding:14px 15px;margin-bottom:8px}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.ph b{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:-.3px}
.ph span{font-size:12.5px;font-weight:600;color:var(--g400)}
.ph em{font-style:normal;font-size:15px;font-weight:700;color:var(--g900);letter-spacing:-.5px;margin-left:auto}
.pe{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;margin-bottom:5px}
.pe.fixed{background:transparent;padding-left:0}
.pe.placed{background:var(--w);border:1px solid var(--g200)}
.pe .pt{flex:1;min-width:0;font-size:14px;color:var(--g700);letter-spacing:-.35px;line-height:1.5}
.pe .pt em{display:block;font-style:normal;font-size:12px;color:var(--g400);margin-top:1px}
.pe.fixed .pt{color:var(--g500)}
.pe .pb{flex:0 0 auto;display:flex;gap:3px}
.pe .pb button{width:28px;height:28px;font-family:var(--font);font-size:14px;font-weight:700;
  background:var(--g100);border:0;color:var(--g600);border-radius:7px;cursor:pointer;line-height:1}
.pe .pb button:disabled{opacity:.3;cursor:not-allowed}
.pe .pb button.rm{background:var(--redL);color:var(--red)}
.pe.move-row{background:#EAF0FF;border-color:#C6D8FF}
.pe.placed.auto{background:#F4FBF6;border-color:#BFE3CC}
.autotag{display:inline-block;font-size:10.5px;font-weight:700;color:#1E7A44;
  background:#DCF2E4;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.autotoggle{display:flex;gap:11px;align-items:flex-start;background:var(--blueLL);
  border-radius:12px;padding:13px 15px;margin-bottom:12px;cursor:pointer}
.autotoggle input{flex:0 0 auto;width:19px;height:19px;margin-top:2px;accent-color:var(--blue);cursor:pointer}
.autotoggle span{flex:1;font-size:13px;color:var(--g500);letter-spacing:-.3px;line-height:1.6}
.autotoggle b{display:block;font-size:14.5px;font-weight:700;color:var(--g900);margin-bottom:2px}
.padd select{width:100%;font-family:var(--font);font-size:13.5px;padding:10px 11px;border-radius:9px;
  border:1.5px dashed var(--g300);background:var(--w);color:var(--blue);font-weight:600;
  letter-spacing:-.3px;cursor:pointer;margin-top:4px}
.pnone{font-size:12.5px;color:var(--g300);letter-spacing:-.3px;padding:6px 0 2px}


.cfsec{background:var(--g50);border-radius:12px;padding:14px 15px;margin-bottom:8px}
.cfsec>b{display:block;font-size:12.5px;font-weight:700;color:var(--g500);letter-spacing:-.2px;margin-bottom:8px}
.cfsec.err{background:var(--redL)}
.cfsec.err>b{color:var(--red)}
.cfsec.warnb{background:#FFF6E8}
.cfsec.warnb>b{color:var(--amber)}
.cfsec.money{background:var(--g900)}
.cfsec.money>b{color:#8FB4F5}
.cfsec.money .cfkv span{color:#A8B4C4}
.cfsec.money .cfkv em{color:#fff}
.cfsec.money .cfkv.big em{font-size:19px;color:#7FB0FF}
.cfkv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;letter-spacing:-.35px}
.cfkv span{color:var(--g400);flex:0 0 auto}
.cfkv em{font-style:normal;font-weight:700;color:var(--g900);text-align:right}
.cfkv.big{padding-top:9px;margin-top:5px;border-top:1px solid rgba(255,255,255,.15)}
.cfkv.big em{font-size:18px;letter-spacing:-.6px}
.cfl{font-size:13.5px;color:var(--g700);letter-spacing:-.35px;padding:3px 0 3px 12px;position:relative}
.cfl::before{content:"";position:absolute;left:2px;top:11px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45}
.cfsec.err .cfl{color:#C0353F}
.cfsec.warnb .cfl{color:#8A6A1E}
.cfl.sub{color:var(--g400);font-size:12.5px}
.cfck{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.cfck input{width:19px;height:19px;accent-color:var(--blue);cursor:pointer;flex:0 0 auto}
.cfck span{font-size:14.5px;color:var(--g700);letter-spacing:-.35px}

.fimport{background:var(--w);border:1.5px solid var(--g200);border-radius:12px;
  padding:14px 15px;margin-bottom:10px}
.fi-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.fi-head b{font-size:14px;font-weight:700;color:var(--g900);letter-spacing:-.4px}
.fi-head span{font-size:12.5px;font-weight:600;color:var(--g400);letter-spacing:-.2px;
  background:var(--g100);padding:3px 9px;border-radius:100px}
.fi-head span.ok{background:#DCF2E4;color:#1E7A44}
.fi-btns{display:flex;gap:6px;flex-wrap:wrap}
.fi-btns button{font-family:var(--font);font-size:13px;font-weight:600;background:var(--blueL);
  border:0;color:var(--blueD);padding:9px 13px;border-radius:9px;cursor:pointer;letter-spacing:-.3px}
.fi-btns button.ghost{background:var(--g100);color:var(--g500)}
.fi-hint{font-size:12.5px;color:var(--g400);letter-spacing:-.2px;line-height:1.6;margin-top:9px}
.fi-hint b{color:var(--g600);font-weight:700}
.fbox{background:var(--g50);border-radius:12px;padding:14px 15px;margin-bottom:8px}
.flab{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:-.2px;margin-bottom:9px}
.frow{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:6px}
@media(min-width:560px){.frow{grid-template-columns:1.7fr 1fr}.frow.t3{grid-template-columns:1fr 1fr 1.2fr}}
.frow.t3{grid-template-columns:1fr 1fr 1.2fr}
.frow input,.frow select{width:100%;font-family:var(--font);font-size:14px;padding:11px 12px;
  border-radius:10px;border:1px solid var(--g200);background:var(--w);color:var(--g900);letter-spacing:-.3px}
.frow input:focus,.frow select:focus{outline:2px solid var(--blue);outline-offset:-2px;border-color:transparent}
.fload{display:flex;gap:6px;margin-bottom:8px}
.fload select{flex:1;min-width:0;font-family:var(--font);font-size:13.5px;padding:11px 12px;
  border-radius:10px;border:1.5px dashed var(--g300);background:var(--w);color:var(--blue);font-weight:600}
.fclr{flex:0 0 auto;font-family:var(--font);font-size:13px;font-weight:600;background:var(--g100);
  border:0;color:var(--g500);padding:0 14px;border-radius:10px;cursor:pointer}
.fclr:hover{background:var(--redL);color:var(--red)}
.frow.t2{grid-template-columns:1fr 1fr}
@media(max-width:559px){.frow.t2,.frow.t3{grid-template-columns:1fr}}
.fout{font-size:12.5px;color:var(--g500);letter-spacing:-.3px;margin-top:6px;line-height:1.55}
.fout b{color:var(--g900);font-weight:700}

/* ══════════════════════════════════════════
   반응형 — 모바일 · 태블릿 · PC
   ══════════════════════════════════════════ */

/* 공통 안전장치 */
img,figure,table{max-width:100%}
.qitem .d b,.qe,.cfkv em,.linkrow .u,.kv dd{overflow-wrap:anywhere;word-break:break-word}
button,select,input,.qbtn,.ctabtn,summary,.nav a,.country-tabs button{min-height:44px}
.pe .pb button{min-height:34px;min-width:34px}
.chk input,.cfck input,.optrow input{min-height:0}

/* ── 소형 모바일 (~380px) ── */
@media(max-width:380px){
  body{font-size:15.5px}
  .kv div{flex-direction:column;gap:2px;padding:10px 0}
  .kv dt{flex:none;font-size:12.5px}
  .cfkv{flex-direction:column;gap:1px}
  .cfkv em{text-align:left}
  .sec{padding:32px 15px 4px}
  .qhead{padding:22px 15px 22px}
  .stub{padding:22px 15px 24px}
  .card{padding:17px 16px}
  .qhead h1{font-size:23px;letter-spacing:-1px}
  .sec-h h2{font-size:20px}
  .pricebox{padding:22px 16px}
  .pricebox b{font-size:29px}
  .qmeta{grid-template-columns:1fr}
  .qday{padding:15px 16px;gap:11px}
  .qd{flex:0 0 50px;font-size:11.5px}
  .qb h4{font-size:15.5px}
  .qitem{gap:9px}
  .qitem .g{flex:0 0 46px;font-size:11px}
  .qitem .d b{font-size:14px}
  .qitem .p{font-size:14px}
  .total b{font-size:20px}
  .ctabox{padding:20px 17px}
  .ctabtn{font-size:16px;padding:15px}
  footer{padding:24px 15px 32px}
}

/* ── 모바일 세로 (~599px) ── */
@media(max-width:599px){
  .qmeta{gap:8px}
  .qmeta div{padding:10px 12px}
  .qmeta dd{font-size:14px}
  /* 일정표: 날짜를 위로 올려 본문 폭 확보 */
  .qday{flex-direction:column;gap:8px}
  .qd{flex:none;display:flex;align-items:baseline;gap:7px;
    padding-bottom:7px;border-bottom:1px solid var(--g100)}
  .qd em{margin-top:0}
  .qe{padding:7px 0;align-items:flex-start}
  .qk{font-size:11px;padding:2px 6px}
  /* 투어 아코디언 */
  summary{padding:15px 16px;font-size:15px}
  .sm-lab small{font-size:12.5px}
  .dbody{padding:0 16px 18px;font-size:14.5px}
  /* 견적 내역 */
  .qitem{padding:12px 0}
  /* 후기 · 강점 카드 */
  .review p{font-size:14.5px}
  .whycard{padding:17px 18px}
  .whycard b{font-size:15.5px}
  /* 긴 URL 줄바꿈 */
  .linkrow .u{font-size:11.5px}
}

/* ── 가로 모드 모바일 ── */
@media(max-height:480px) and (orientation:landscape){
  .sheet{max-height:94vh;padding:18px 18px calc(16px + env(safe-area-inset-bottom))}
  .modal{align-items:flex-start}
  .qhead{padding:18px 20px 20px}
}

/* ── 태블릿 세로 (600~899px) ── */
@media(min-width:600px) and (max-width:899px){
  body{font-size:16.5px}
  .qhead h1{font-size:34px}
  .sec-h h2{font-size:26px}
  .qmeta{grid-template-columns:repeat(2,1fr);gap:11px}
  .pricebox b{font-size:44px}
  .qd{flex:0 0 68px}
  .qb h4{font-size:17.5px}
  .qe{font-size:15px}
  /* 후기 2단 */
  .review,.whycard{padding:20px 22px}
}

/* ── 태블릿 가로 · 작은 PC (900px~) ── */
@media(min-width:900px){
  .wrap{max-width:900px}
  body{font-size:16.5px;line-height:1.75}
  .sec{padding:52px 36px 4px}
  .qhead{padding:40px 36px 34px}
  .stub{padding:36px 36px 34px}
  .nav-in{padding:12px 36px}
  footer{padding:30px 36px 40px}
  .qhead h1{font-size:38px;letter-spacing:-1.6px}
  .sec-h h2{font-size:28px}
  .sec-h p{font-size:16px}
  .qmeta{grid-template-columns:repeat(4,1fr)}
  .pricebox{padding:34px 26px}
  .pricebox b{font-size:48px}
  .qday{padding:20px 22px;gap:18px}
  .qd{flex:0 0 74px;font-size:13px}
  .qb h4{font-size:18px}
  .qe{font-size:15.5px;padding:7px 0}
  .card{padding:24px 26px}
  .qitem{padding:16px 0}
  .qitem .d b{font-size:16px}
  .qitem .p{font-size:16px}
  .total b{font-size:24px}
  /* 강점 · 후기 2단 */
  .whygrid,.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ctabox{padding:32px 28px}
  .ctabox b{font-size:21px}
  .ctabtn{max-width:340px;margin:0 auto}
  .sos{margin:20px 36px 0}
  .quick{padding:28px 36px 4px}
  .search{padding:22px 36px 0}
}

/* ── 대형 화면 (1200px~) ── */
@media(min-width:1200px){
  .wrap{max-width:960px}
  .qhead h1{font-size:42px}
}

/* ── 다크모드 대응 (시스템 설정) ── */
@media(prefers-color-scheme:dark){
  /* 견적서는 밝은 배경 유지 — 인쇄와 브랜드 일관성 */
  body{background:var(--g100);color:var(--g900)}
}


/* ── 로고 ── */
.logobar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{height:30px;width:auto;max-width:180px;object-fit:contain;display:block}
.logo.foot{height:24px;opacity:.55;margin-bottom:10px}
.logotext{font-size:15px;font-weight:800;letter-spacing:1.2px;color:var(--blue)}
.logotext.foot{display:block;font-size:13px;color:var(--g400);margin-bottom:10px;letter-spacing:1px}
.logobar .qno{margin-bottom:0}

/* ── 유럽 지도 ── */
.mapwrap{margin:4px 0 16px}
.euromap{width:100%;height:auto;display:block;border-radius:14px}
.mapnote{font-size:12.5px;color:var(--g400);letter-spacing:-.3px;margin-top:8px;text-align:center}
@media(max-width:599px){
  .logo{height:26px}
  .mapnote{font-size:12px}
}
@media print{
  .euromap{border:1px solid #ddd}
  .logo{filter:grayscale(1)}
}


/* ── 저작권 ── */
.copybox{background:var(--g50);border-radius:var(--r);padding:20px 22px;
  border:1px solid var(--g200)}
.copybox>b{display:block;font-size:14px;font-weight:700;color:var(--g700);
  letter-spacing:-.3px;margin-bottom:9px}
.copybox p{font-size:13px;color:var(--g500);letter-spacing:-.3px;line-height:1.75}
.copybox p+p{margin-top:8px}
.copybox p.law{color:var(--g400);font-size:12.5px}
.copyline{margin-top:13px;padding-top:12px;border-top:1px solid var(--g200);
  font-size:12.5px;font-weight:700;color:var(--g600);letter-spacing:-.2px}
.foot-copy{margin-top:14px;padding-top:12px;border-top:1px solid var(--g200);
  font-size:12px;color:var(--g300);letter-spacing:-.2px;line-height:1.7}
@media print{
  .copybox{border:1px solid #ccc;background:#fff;break-inside:avoid}
  .foot-copy{color:#666}
}


/* ── 필수 항목 표시 (미입력만 강조) ── */
.rq{position:relative;display:block}
.rq>input,.rq>select{border:2px solid var(--red);background:#FFF7F8}
.rq>input:focus,.rq>select:focus{outline:2px solid var(--red);outline-offset:-2px}
.rq::before{content:'필수';position:absolute;top:-8px;left:10px;z-index:2;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:5px;letter-spacing:0;line-height:1.5;pointer-events:none}
.rq.ok>input,.rq.ok>select{border:1.5px solid #2E9E5B;background:#F4FBF6}
.rq.ok::before{content:'\2713';background:#2E9E5B;width:18px;height:18px;padding:0;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.frow .rq{margin-top:2px}
.rqcost,.rqfare{position:relative;display:block}
.rqcost.rq>input,.rqfare.rq>input{border:2px solid var(--red);background:#FFF7F8}
.rqcost.rq::before,.rqfare.rq::before{content:'필수';position:absolute;top:-8px;left:10px;z-index:2;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;
  border-radius:5px;line-height:1.5;pointer-events:none}
.rqcost.ok>input,.rqfare.ok>input{border:1.5px solid #2E9E5B;background:#F4FBF6}
.rqcost.ok::before,.rqfare.ok::before{content:'\2713';background:#2E9E5B;width:18px;height:18px;
  padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.rqcost:not(.rq):not(.ok)::before{display:none}

/* 알림 바 */
.alertbar,.okbar{display:flex;align-items:center;gap:9px;border-radius:10px;
  padding:11px 13px;margin-bottom:12px;font-size:13.5px;font-weight:600;letter-spacing:-.3px}
.alertbar{background:var(--redL);color:#C0353F}
.alertbar code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px;font-size:12px}
.alertbar b{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.okbar{background:#F4FBF6;color:#1E7A44}
.okbar b{color:#2E9E5B;font-size:15px}

/* 섹션 헤더 상태 */
.rowhead .st{margin-left:auto;font-size:12.5px;font-weight:700;letter-spacing:-.2px;
  padding:4px 10px;border-radius:100px}
.rowhead .st.need{background:var(--redL);color:var(--red)}
.rowhead .st.ok{background:#F4FBF6;color:#2E9E5B}


/* ── 투어 이미지 갤러리 ── */
.gal{margin:0 0 14px}
.galtrack{display:grid;grid-auto-flow:column;gap:8px;
  grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:12px}
.galtrack::-webkit-scrollbar{display:none}
.galitem{scroll-snap-align:start;margin:0;aspect-ratio:4/3;border-radius:12px;
  overflow:hidden;background:var(--g100)}
.galitem img{width:100%;height:100%;object-fit:cover;display:block}
.galdots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.galdots i{width:6px;height:6px;border-radius:50%;background:var(--g200);transition:.2s}
.galdots i.on{background:var(--blue);width:16px;border-radius:100px}
.gal .ph{aspect-ratio:16/9}
/* 태블릿 이상 — 나란히 표시 */
@media(min-width:600px){
  .galtrack{grid-auto-flow:row;grid-template-columns:repeat(2,1fr);overflow:visible}
  .gal[data-n="3"] .galtrack{grid-template-columns:repeat(3,1fr)}
  .gal[data-n="1"] .galtrack{grid-template-columns:1fr}
  .galitem{aspect-ratio:4/3}
  .galdots{display:none}
}
@media(min-width:900px){
  .gal[data-n="2"] .galtrack{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .galtrack{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}
  .galdots{display:none}
}


/* ── 빌더: 특전 선택 ── */
.perkrow{display:flex;gap:11px;align-items:flex-start;background:var(--g50);
  border-radius:11px;padding:13px 14px;margin-bottom:6px;cursor:pointer;
  border:1.5px solid transparent}
.perkrow.on{background:#FBF7FF;border-color:#C4A5F5}
.perkrow input{flex:0 0 auto;width:19px;height:19px;margin-top:2px;accent-color:#8B5CF6;cursor:pointer}
.perkrow .pl{flex:1;min-width:0}
.perkrow .pl b{display:block;font-size:14.5px;font-weight:700;color:var(--g900);letter-spacing:-.4px}
.perkrow .pl em{display:block;font-style:normal;font-size:12.5px;color:var(--g400);
  margin-top:3px;letter-spacing:-.2px;line-height:1.6}
.perkrow.on .pl b{color:#6D28D9}

/* ── 견적서: 특전 ── */
.perkbox{background:linear-gradient(160deg,#2E1065 0%,#4C1D95 55%,#5B21B6 100%);
  border-radius:var(--r);padding:26px 22px;color:#fff;overflow:hidden;position:relative}
.perkhead{text-align:center;margin-bottom:20px}
.perkbadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.4px;
  background:rgba(255,255,255,.16);color:#DDD0FF;padding:5px 12px;border-radius:100px;margin-bottom:11px}
.perkhead b{display:block;font-size:clamp(19px,5vw,24px);font-weight:800;letter-spacing:-.8px;
  line-height:1.4;margin-bottom:7px}
.perkhead p{font-size:14px;color:#C9B8F0;letter-spacing:-.3px;line-height:1.6}
.perklist{display:grid;gap:9px}
.perkitem{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.10);
  border-radius:13px;padding:15px 16px}
.pnum{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#fff;color:#5B21B6;
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ptxt{flex:1;min-width:0}
.ptxt b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.5px;line-height:1.45}
.ptxt em{display:block;font-style:normal;font-size:13px;color:#C9B8F0;margin-top:4px;
  letter-spacing:-.3px;line-height:1.65}
.pfree{flex:0 0 auto;font-size:11.5px;font-weight:800;background:#FDE68A;color:#78350F;
  padding:3px 9px;border-radius:6px;letter-spacing:-.2px;margin-top:2px}
.perkfoot{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.18);
  text-align:center;font-size:13.5px;color:#C9B8F0;letter-spacing:-.3px}
.perkfoot b{color:#FDE68A;font-weight:700}
@media(min-width:720px){.perklist{grid-template-columns:1fr}}
@media print{
  .perkbox{background:#fff;color:#000;border:2px solid #5B21B6;break-inside:avoid}
  .perkbadge{background:#EDE9FE;color:#5B21B6}
  .perkhead p,.ptxt em,.perkfoot{color:#444}
  .perkitem{background:#F7F5FF;border:1px solid #DDD6FE}
  .pnum{background:#5B21B6;color:#fff}
  .perkfoot b{color:#5B21B6}
}


.sheet.wide{max-width:760px}
.arrnote{background:var(--blueLL);border-radius:11px;padding:13px 15px;margin-bottom:12px;

.as-p{font-size:12.5px;font-weight:600;color:var(--g700);letter-spacing:-.2px}

.as-t{font-size:12.5px;font-weight:600;color:var(--blue)}
.arrseg input,.arrseg select{font-family:var(--font);font-size:13px;padding:8px 9px;
  border-radius:8px;border:1px solid var(--g200);background:var(--w);width:100%}
.arrseg input:focus,.arrseg select:focus{outline:2px solid var(--blue);outline-offset:-2px}
.fi-btns button.main{background:var(--blue);color:#fff}


.namerow{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.lbnote{font-size:12px;font-weight:500;color:var(--g400);margin-left:6px;letter-spacing:-.2px}
.loadbar{display:flex;align-items:center;gap:12px;background:var(--blueLL);border-radius:12px;
  padding:13px 15px;margin-bottom:10px;flex-wrap:wrap}

  border:0;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer;letter-spacing:-.4px}

.loadinput{width:100%;min-height:110px;font-family:var(--font);font-size:13px;padding:13px 14px;
  border-radius:12px;border:1px solid var(--g200);background:var(--w);color:var(--g900);
  letter-spacing:-.2px;resize:vertical;word-break:break-all;line-height:1.6}
.loadinput:focus{outline:2px solid var(--blue);outline-offset:-2px}
.loadnote{background:var(--amberL);border-radius:11px;padding:12px 14px;margin-top:10px;
  font-size:13px;color:#7A5F22;letter-spacing:-.3px;line-height:1.65}
.loadnote b{display:block;font-weight:700;color:#5E4715;margin-bottom:3px}


.planrow{background:var(--g50);border-radius:12px;padding:14px 15px;margin-bottom:8px}
.pr-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pr-h b{font-size:15.5px;font-weight:800;color:var(--g900);letter-spacing:-.5px}
.pr-low{font-size:11px;font-weight:700;background:#DCF2E4;color:#1E7A44;padding:2px 7px;border-radius:5px}
.pr-price{margin-left:auto;font-size:18px;font-weight:800;color:var(--blue);letter-spacing:-.7px}
.pr-price em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--g400);margin-left:4px}
.pr-note{font-size:13px;color:var(--g600);letter-spacing:-.3px;margin-top:5px}
.pr-meta{font-size:12.5px;color:var(--g500);letter-spacing:-.2px;margin-top:4px;line-height:1.55}
.pr-meta.sub{color:var(--g400)}
.pr-btns{display:flex;gap:6px;margin-top:10px}
.pr-btns button{font-family:var(--font);font-size:12.5px;font-weight:600;background:var(--blueL);
  border:0;color:var(--blueD);padding:8px 13px;border-radius:8px;cursor:pointer;letter-spacing:-.2px}
.pr-btns button.rm{background:var(--g100);color:var(--g500)}
.pr-btns button.rm:hover{background:var(--redL);color:var(--red)}


.cmpgrid{display:grid;gap:9px}
@media(min-width:700px){.cmpgrid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.cmpcard{background:var(--w);border-radius:var(--r);padding:19px;border:2px solid var(--g200)}
.cmpcard.low{border-color:var(--blue);background:var(--blueLL)}
.cc-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.cc-h b{font-size:16px;font-weight:800;color:var(--g900);letter-spacing:-.5px}
.cc-h span{font-size:11px;font-weight:700;background:var(--blue);color:#fff;padding:2px 8px;border-radius:5px}
.cc-note{font-size:13px;color:var(--g500);letter-spacing:-.3px;margin-bottom:11px;line-height:1.55}
.cc-price{font-size:26px;font-weight:800;color:var(--g900);letter-spacing:-1.2px;line-height:1.2}
.cmpcard.low .cc-price{color:var(--blueD)}
.cc-price em{font-style:normal;font-size:13px;font-weight:600;color:var(--g400);margin-left:5px;letter-spacing:-.2px}
.cc-sub{font-size:13px;color:var(--g500);letter-spacing:-.3px;margin-top:3px}
.cc-city{font-size:12.5px;color:var(--g400);letter-spacing:-.2px;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--g100);line-height:1.55}

/* 빌더 · 추천 표시 */
.planrow.pick{background:#FFFBEB;box-shadow:inset 0 0 0 2px #E8B931}
.pr-pick{font-size:11px;font-weight:700;background:#E8B931;color:#fff;padding:2px 8px;border-radius:5px}
.pr-btns button.pk{background:#FDF3D5;color:#8A6A1E}
.pr-btns button.pk.on{background:#E8B931;color:#fff}

/* 견적서 · 추천 카드 */
.cmpcard{position:relative}
.cmpcard.pick{border-color:#E8B931;background:#FFFCF2;
  box-shadow:0 6px 24px rgba(232,185,49,.22)}
.cc-ribbon{position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  background:#E8B931;color:#fff;font-size:12px;font-weight:800;letter-spacing:-.2px;
  padding:5px 14px;border-radius:100px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(232,185,49,.35)}
.cmpcard.pick .cc-h{margin-top:8px}
.cmpcard.pick .cc-price{color:#8A6A1E}
.cc-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.cc-tag.low{background:var(--g100);color:var(--g500)}
.cmpcard.low .cc-tag.low{background:var(--blue);color:#fff}
.cmpgrid.haspick{padding-top:14px}
@media(min-width:700px){
  .cmpgrid.haspick .cmpcard.pick{transform:scale(1.04);z-index:2}
}
.pickwhy{background:#FFFBEB;border-radius:12px;padding:16px 18px;margin-top:14px;
  border-left:4px solid #E8B931}
.pickwhy b{display:block;font-size:14.5px;font-weight:700;color:#8A6A1E;
  letter-spacing:-.4px;margin-bottom:5px}
.pickwhy p{font-size:14px;color:#7A5F22;letter-spacing:-.35px;line-height:1.7}
@media print{
  .cmpcard.pick{transform:none;box-shadow:none;border:2px solid #8A6A1E}
  .cc-ribbon{background:#8A6A1E;box-shadow:none}
}

.prevcost{margin-top:10px}

.pc-h{font-size:12.5px;font-weight:700;color:var(--amber);margin-bottom:6px}

.pc-row span{color:var(--g500)}

  cursor:pointer;padding:6px 0 0;min-height:0}
.prevcost{background:#FFFBEB;border-radius:11px;padding:13px 15px}


.startline{display:flex;align-items:center;gap:10px;background:var(--g50);border-radius:11px;
  padding:12px 14px;margin-top:10px;flex-wrap:wrap}

  box-shadow:0 2px 14px rgba(20,32,46,.18)}

  display:flex;align-items:center;gap:14px}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tb-main span{font-size:11px}
  .tb-need{display:none}
  .tb-money b{font-size:15.5px}
  .tb-money em{font-size:11px}

.logrow .l4{display:flex;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--g100);flex-wrap:wrap}

   숙박 입력 — 카드형
   ══════════════════════════════════════════ */
.stayrow{background:var(--w);border:1px solid var(--g200);border-radius:16px;
  padding:15px 17px;margin-bottom:9px}
.stayrow.zero{background:var(--g50);opacity:.94}

.sr-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}

  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stayrow.zero .sr-no{background:var(--g300)}
.sr-city{font-size:16.5px;font-weight:800;letter-spacing:-.5px}
.sr-area{font-size:12.5px;color:var(--g400);letter-spacing:-.2px}
.lg-io{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.lg-io.in{background:#DCF2E4;color:#1E7A44}
.lg-io.out{background:#FFE8CC;color:#9A5B0A}
.sr-acts{margin-left:auto;display:flex;gap:4px}
.sr-acts button{width:27px;height:27px;border:0;border-radius:8px;background:var(--g100);

  min-height:0;line-height:1;font-family:var(--font)}
.sr-acts button:hover:not(:disabled){background:var(--blueL);color:var(--blueD)}
.sr-acts button:disabled{opacity:.3;cursor:default}

/* 입력 줄 — 모든 칸 높이 통일 */
.sr-main{display:grid;grid-template-columns:92px 1fr 148px;gap:9px;margin-bottom:9px}
.sr-main:last-of-type{margin-bottom:0}
@media(max-width:760px){.sr-main{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.sr-main{grid-template-columns:1fr}}

.sf{display:block;min-width:0}
.sf>span{display:block;font-size:11px;font-weight:700;color:var(--g400);
  margin-bottom:4px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf>input,.sf>select{width:100%;height:40px;font-size:14px;padding:0 11px;
  border-radius:10px;border:1px solid var(--g200);background:var(--w);
  color:var(--g900);letter-spacing:-.3px}
.sf>input:focus,.sf>select:focus{outline:2px solid var(--blue);outline-offset:-2px;border-color:transparent}
.sf>input:disabled,.sf>select:disabled{background:var(--g50);color:var(--g300)}

.sf.rqcost.rq>input{border:1.5px solid var(--red);background:#FFF7F8}

  border-radius:10px;cursor:pointer;min-height:0;padding:0}
.mealtog button.on.bb{background:#DCF2E4;border-color:#2E9E5B;color:#1E7A44}
.mealtog button.on.ro{background:#FEE2E2;border-color:#F04452;color:#C0353F}
.mealslot select{width:100%;height:40px;font-size:14px;padding:0 11px;border-radius:10px;
  border:1px solid #BFD4F5;background:var(--blueLL);color:var(--blueD);font-weight:700}

/* 접히는 시각 영역 */
.sr-extra{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;
  padding-top:11px;border-top:1px dashed var(--g200)}

.sr-zero{font-size:12.5px;color:var(--g400);letter-spacing:-.3px;padding:2px 0}

/* 마지막 줄 */
.sr-foot{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--g100);font-size:12.5px;color:var(--g500);flex-wrap:wrap}
.sr-lnk{font-family:var(--font);font-size:12px;font-weight:700;color:var(--blue);
  background:none;border:0;cursor:pointer;padding:0;min-height:0;text-decoration:none}

.sr-sum{margin-left:auto;font-size:12.5px;color:var(--g500);white-space:nowrap}

.sd-loc{font-size:11.5px;font-weight:600;color:var(--g500);background:var(--g100);
  padding:3px 8px;border-radius:6px}
.sd-loc:empty{display:none}


/* ══════════════════════════════════════════
   도시 간 이동
   ══════════════════════════════════════════ */
.legrow{background:var(--w);border:1px solid var(--g200);border-radius:14px;
  padding:13px 16px;margin-bottom:8px}
.lg-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lg-route{font-size:15px;font-weight:800;letter-spacing:-.4px}
.lg-date{font-size:12.5px;color:var(--g400)}
.lg-modes{margin-left:auto;display:flex;gap:3px;background:var(--g100);
  padding:3px;border-radius:10px}
.lg-modes .mb{font-family:var(--font);font-size:12.5px;font-weight:700;
  background:none;border:0;color:var(--g500);padding:6px 13px;border-radius:8px;
  cursor:pointer;min-height:0;letter-spacing:-.3px}

  box-shadow:0 1px 3px rgba(25,31,40,.10)}

.lg-info{font-size:12.5px;color:var(--g500);letter-spacing:-.2px;flex:1;min-width:130px}

.lg-b .rqfare input{width:100%;height:38px;font-size:14px;padding:0 11px;
  border-radius:10px;border:1px solid var(--g200)}
.lg-sum{font-size:12.5px;color:var(--g500);white-space:nowrap}

.ip-fuzzy{background:#FFF8E6;border-radius:9px;padding:10px 12px;margin-top:9px;

/* 날짜 · 시각 입력칸 글꼴 통일

  font-family:var(--font)!important;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.2px}
input[type=date]::-webkit-datetime-edit,
input[type=time]::-webkit-datetime-edit,
input[type=date]::-webkit-datetime-edit-text,

.sf-hint{font-style:normal;font-size:10px;font-weight:600;color:var(--g300);margin-left:4px}

.sf-per{display:block;font-style:normal;font-size:11px;color:var(--g500);

.tp-box{background:var(--w);border:1px solid var(--g200);border-radius:12px;
  padding:13px 15px;margin-top:10px}
.tp-h{display:block;font-size:12px;font-weight:800;color:var(--g500);margin-bottom:9px}

.tp-n{flex:1;color:var(--g900);font-weight:600}

/* 호텔명으로 등록 정보 찾기 */
/* 호텔 목록에서 몇 번째인지 — 링크를 짧게 담기 위해 씁니다 */
function hotelIndex(city, name){
  var rec = HOTELS[city];
  if(!rec || !name) return -1;
  var key = String(name).split(' · ')[0].trim();
  for(var i = 0; i < rec.list.length; i++){
    var h = rec.list[i];
    if(h.n === key || h.n.indexOf(key) === 0 || key.indexOf(h.n.split(' (')[0]) === 0) return i;
  }
  return -1;
}

/* 순번으로 호텔을 되찾습니다 */
function hotelByIndex(city, idx){
  var rec = HOTELS[city];
  if(!rec || idx == null || idx < 0 || idx >= rec.list.length) return null;
  return rec.list[idx];
}

function hotelInfo(city, name){
  var rec = HOTELS[city];
  if(!rec || !name) return null;
  var key = String(name).split(' · ')[0].trim();
  for(var i = 0; i < rec.list.length; i++){
    var h = rec.list[i];
    if(h.n === key || h.n.indexOf(key) === 0 || key.indexOf(h.n.split(' (')[0]) === 0) return h;
  }
  return null;
}

var FLIGHTS_USER = null;
function flightList(){ return FLIGHTS_USER && FLIGHTS_USER.length ? FLIGHTS_USER : FLIGHTS; }

/* ── 날짜 유틸 ── */
function ymdKey(d){
  return String(d.getFullYear()) + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
}
function keyToYmd(k){
  if(!k || k.length !== 8) return null;
  return new Date(Number(k.slice(0,4)), Number(k.slice(4,6)) - 1, Number(k.slice(6,8)));
}
function fmtKeyShort(k){
  if(!k || k.length !== 8) return '';
  return k.slice(0,4) + '.' + k.slice(4,6) + '.' + k.slice(6,8);
}
function dowNum(d){ var w = d.getDay(); return w === 0 ? 7 : w; }
function dayNames(code){
  if(!code) return '';
  var N = ['','월','화','수','목','금','토','일'];
  if(code.length === 7) return '매일';
  return code.split('').map(function(c){ return N[Number(c)] || ''; }).join('·');
}

/* ── 편명 + 날짜 → 해당 구간 ── */
function findFlight(no){
  var k = String(no || '').toUpperCase().replace(/\s/g, '');
  var list = flightList();
  for(var i = 0; i < list.length; i++) if(list[i].no === k) return list[i];
  return null;
}

function flightAt(no, date){
  var f = findFlight(no);
  if(!f) return null;
  var base = {no: f.no, air: f.air, from: f.from, to: f.to, dir: f.dir, term: f.term || ''};
  var segs = f.seg || [];
  if(!segs.length) return null;

  if(!date){
    /* 날짜가 없으면 첫 구간을 참고용으로 */
    var s0 = segs[0];
    return Object.assign({}, base, {dep: s0.dep, arr: s0.arr, nd: s0.nd || 0,
      days: s0.days, status: 'nodate', seg: s0});
  }

  var key = ymdKey(date), w = String(dowNum(date));
  /* 1. 날짜가 구간 안에 있고 운항요일도 맞는 경우 */
  for(var i = 0; i < segs.length; i++){
    var sg = segs[i];
    if(key >= sg.f && key <= sg.t && (!sg.days || sg.days.indexOf(w) > -1))
      return Object.assign({}, base, {dep: sg.dep, arr: sg.arr, nd: sg.nd || 0,
        days: sg.days, status: 'ok', seg: sg});
  }
  /* 2. 구간 안이지만 운항요일이 아닌 경우 */
  for(var j = 0; j < segs.length; j++){
    var sg2 = segs[j];
    if(key >= sg2.f && key <= sg2.t)
      return Object.assign({}, base, {dep: sg2.dep, arr: sg2.arr, nd: sg2.nd || 0,
        days: sg2.days, status: 'offday', seg: sg2});
  }
  /* 3. 어느 구간에도 없는 경우 — 가장 가까운 구간을 참고로 */
  var near = null, gap = Infinity;
  segs.forEach(function(sg3){
    var a = Math.abs(Number(key) - Number(sg3.f)), b = Math.abs(Number(key) - Number(sg3.t));
    var g = Math.min(a, b);
    if(g < gap){ gap = g; near = sg3; }
  });
  return Object.assign({}, base, {dep: near.dep, arr: near.arr, nd: near.nd || 0,
    days: near.days, status: 'outside', seg: near});
}

/* 상태 문구 */
function flightStatusMsg(f, date){
  if(!f) return '';
  if(f.status === 'ok') return '';
  if(f.status === 'nodate') return '날짜를 입력하면 해당 구간 시각이 반영됩니다';
  if(f.status === 'offday')
    return fmtDate(date) + '은 운항일이 아닙니다 (' + dayNames(f.days) + ' 운항)';
  if(f.status === 'outside')
    return fmtDate(date) + '은 등록된 운항구간에 없습니다 · 시각을 직접 확인해 주세요';
  return '';
}

/* 편의 함수 — 특정 날짜에 뜨는 항공편 목록 */
function flightsOn(dir, date){
  return flightList().filter(function(f){ return f.dir === dir; }).map(function(f){
    return flightAt(f.no, date);
  }).filter(Boolean);
}

/* 프리셋 목록 — 그날 운항 + 해당 도시 노선 우선 */
function presetOptions(dir){
  var date = parseDate(gv(dir === 'out' ? 'foutDate' : 'finDate'));
  var city = (dir === 'out') ? gv('foutTo').trim() : gv('finFrom').trim();
  var head = date
    ? (fmtDate(date) + (city ? ' · ' + city : '') + ' 운항편 불러오기')
    : '날짜를 먼저 입력하면 그날 운항편만 나옵니다';
  var out = '<option value="">' + head + '</option>';
  var list = flightList().filter(function(f){ return f.dir === dir; });

  function opt(d, mark){
    return '<option value="' + d.no + '">' + d.no + ' · ' + d.from + ' → ' + d.to +
      ' (' + (d.dep || '?') + ' → ' + (d.arr || '?') + (d.nd ? ' +' + d.nd + '일' : '') + ')' +
      (mark ? ' · ' + mark : '') + '</option>';
  }
  function cityOf(f){ return dir === 'out' ? f.to : f.from; }

  if(!date){
    var byAir = {};
    list.forEach(function(f){ (byAir[f.air] = byAir[f.air] || []).push(f); });
    Object.keys(byAir).forEach(function(air){
      out += '<optgroup label="' + air + '">';
      byAir[air].forEach(function(f){
        var d = flightAt(f.no, null);
        out += '<option value="' + f.no + '">' + f.no + ' · ' + f.from + ' → ' + f.to +
          (d ? ' (' + d.dep + ' → ' + d.arr + ')' : '') + '</option>';
      });
      out += '</optgroup>';
    });
    return out;
  }

  /* 해당 도시 / 그 외로 나눕니다 */
  var mine = [], mineOff = [], other = [], otherOff = [];
  list.forEach(function(f){
    var d = flightAt(f.no, date);
    if(!d) return;
    var isCity = city && cityOf(f) === city;
    if(d.status === 'ok'){ (isCity ? mine : other).push(d); }
    else { (isCity ? mineOff : otherOff).push(d); }
  });

  if(mine.length){
    out += '<optgroup label="' + esc(city) + ' · 이 날짜 운항">';
    mine.forEach(function(d){ out += opt(d, dayNames(d.days)); });
    out += '</optgroup>';
  }
  if(mineOff.length){
    out += '<optgroup label="' + esc(city) + ' · 이 날짜 운항 안 함">';
    mineOff.forEach(function(d){
      out += opt(d, d.status === 'offday' ? dayNames(d.days) + ' 운항' : '구간 밖');
    });
    out += '</optgroup>';
  }
  if(!mine.length && !mineOff.length && city){
    out += '<optgroup label="' + esc(city) + ' 직항 없음 · 경유편은 직접 입력하세요"></optgroup>';
  }
  if(other.length){
    out += '<optgroup label="다른 도시 · 이 날짜 운항 (경유 검토용)">';
    other.forEach(function(d){ out += opt(d, dayNames(d.days)); });
    out += '</optgroup>';
  }
  if(otherOff.length){
    out += '<optgroup label="다른 도시 · 참고">';
    otherOff.forEach(function(d){
      out += opt(d, d.status === 'offday' ? dayNames(d.days) + ' 운항' : '구간 밖');
    });
    out += '</optgroup>';
  }
  return out;
}

function gv(id){ var el = document.getElementById(id); return el ? el.value : ''; }
function sv(id, v){ var el = document.getElementById(id); if(el) el.value = v; }

function loadFlight(dir){
  var pre = dir === 'out' ? 'fout' : 'fin';
  var no = gv(pre + 'Preset');
  if(!no) return;
  var date = parseDate(gv(pre + 'Date'));
  var f = flightAt(no, date);
  if(!f){ toast('해당 편명의 운항 정보가 없습니다'); return; }
  sv(pre + 'Air', f.air);
  sv(pre + 'No', f.no);
  sv(pre + 'From', f.from);
  sv(pre + 'To', f.to);
  sv(pre + 'Dep', f.dep || '');
  sv(pre + 'Arr', f.arr || '');
  var nd = f.nd;
  if(nd == null){ var g = ndByFlightNo(f.no); nd = (g == null) ? (dir === 'in' ? 1 : 0) : g; }
  sv(pre + 'Nd', String(nd));
  sv(pre + 'Preset', '');
  if(dir === 'out' && date && !START_MANUAL) sv('qstart', ymd(addDays(date, f.nd || 0)));
  refreshPresets();
  syncPlan(); calc();
  var warn = flightStatusMsg(f, date);
  toast(f.air + ' ' + f.no + '을 불러왔습니다' + (f.arr ? '' : ' · 도착시각 미등록'));
  if(warn) setTimeout(function(){ toast('주의 · ' + warn); }, 1900);
}

function clearFlight(dir){
  var pre = dir === 'out' ? 'fout' : 'fin';
  ['Air','No','From','To','Dep','Arr','Memo','Date'].forEach(function(k){ sv(pre + k, ''); });
  sv(pre + 'Nd', dir === 'out' ? '0' : '1');
  sv(pre + 'Preset', '');
  refreshPresets();
  syncPlan(); calc();
}

function refreshPresets(){
  var a = document.getElementById('foutPreset'), b = document.getElementById('finPreset');
  if(a) a.innerHTML = presetOptions('out');
  if(b) b.innerHTML = presetOptions('in');
}

function ymd(d){
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

/* 항공 정보 읽기 — 전부 입력값 기준 */
function readFlights(){
  function pack(pre){
    var date = parseDate(gv(pre + 'Date'));
    if(!date) return null;
    var nd = Number(gv(pre + 'Nd')) || 0;
    return {
      air: gv(pre + 'Air').trim(), no: gv(pre + 'No').trim().toUpperCase(),
      from: gv(pre + 'From').trim(), to: gv(pre + 'To').trim(),
      date: date, dep: gv(pre + 'Dep'), arr: gv(pre + 'Arr'), nd: nd,
      memo: gv(pre + 'Memo').trim(),
      arrDate: addDays(date, nd)
    };
  }
  return {out: pack('fout'), back: pack('fin')};
}

/* 표시용 이름 */
function flightLabel(f){
  if(!f) return '';
  var t = (f.air ? f.air + ' ' : '') + (f.no || '');
  return t.trim() || '항공편';
}

/* 총 여행 일수 (한국 출발 ~ 한국 도착) */
function tripDuration(){
  var f = readFlights();
  var plan = buildPlan();
  var nights = plan.rows.reduce(function(a, x){ return a + x.nights; }, 0);
  if(!f.out || !f.back) return {nights: nights, days: nights + 1, label: nights + '박 ' + (nights + 1) + '일'};
  var ms = f.back.arrDate - f.out.date;
  var days = Math.round(ms / 86400000) + 1;
  return {nights: nights, days: days,
          label: nights + '박 ' + days + '일',
          note: nights + '박 현지 숙박 · 기내 1박 포함 총 ' + days + '일'};
}

/* ══════════════════════════════════════════
   유럽 지도 렌더러
   국경선: Natural Earth 공개 데이터 기반
   ══════════════════════════════════════════ */

function buildMapSVG(cities){
  var pts = [];
  cities.forEach(function(c){
    var g = CITY_GEO[c];
    if(g) pts.push({name: c, lon: g[0], lat: g[1]});
  });
  if(!pts.length) return '';

  var W = 800, H = 600;

  /* ── 자동 확대: 도시 범위 + 여유 ── */
  var lo0 = 999, lo1 = -999, la0 = 999, la1 = -999;
  pts.forEach(function(p){
    if(p.lon < lo0) lo0 = p.lon;
    if(p.lon > lo1) lo1 = p.lon;
    if(p.lat < la0) la0 = p.lat;
    if(p.lat > la1) la1 = p.lat;
  });
  var spanLon = lo1 - lo0, spanLat = la1 - la0;
  /* 최소 범위 보장 — 한 도시만 있어도 주변이 보이도록 */
  var minLon = 5.5, minLat = 4;
  if(spanLon < minLon){ var c = (lo0 + lo1) / 2; lo0 = c - minLon / 2; lo1 = c + minLon / 2; }
  if(spanLat < minLat){ var c2 = (la0 + la1) / 2; la0 = c2 - minLat / 2; la1 = c2 + minLat / 2; }
  /* 여백 — 라벨이 잘리지 않게 */
  var mLon = (lo1 - lo0) * 0.30, mLat = (la1 - la0) * 0.24;
  lo0 -= mLon; lo1 += mLon; la0 -= mLat; la1 += mLat;

  /* 화면 비율에 맞춰 보정 (메르카토르 위도 보정 포함) */
  var latMid = (la0 + la1) / 2;
  var kx = Math.cos(latMid * Math.PI / 180);
  var wDeg = (lo1 - lo0) * kx, hDeg = la1 - la0;
  var target = W / H;
  if(wDeg / hDeg < target){
    var need = hDeg * target / kx;
    var cx = (lo0 + lo1) / 2;
    lo0 = cx - need / 2; lo1 = cx + need / 2;
  } else {
    var need2 = (lo1 - lo0) * kx / target;
    var cy = (la0 + la1) / 2;
    la0 = cy - need2 / 2; la1 = cy + need2 / 2;
  }

  function X(lon){ return (lon - lo0) / (lo1 - lo0) * W; }
  function Y(lat){ return (la1 - lat) / (la1 - la0) * H; }

  /* ── 국경선 그리기 ── */
  var land = '', border = '';
  Object.keys(EU_GEO).forEach(function(name){
    EU_GEO[name].split('|').forEach(function(poly){
      var cs = poly.split(' ');
      var d = '', vis = false;
      for(var i = 0; i < cs.length; i++){
        var p = cs[i].split(',');
        var lon = parseFloat(p[0]), lat = parseFloat(p[1]);
        var x = X(lon), y = Y(lat);
        /* 화면 밖 좌표는 잘라서 성능 확보 */
        if(x > -400 && x < W + 400 && y > -400 && y < H + 400) vis = true;
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
      }
      if(!vis) return;
      land += '<path d="' + d + 'Z"/>';
    });
  });

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" ' +
          'class="euromap" role="img" aria-label="여행 도시 지도">';
  s += '<defs>' +
       '<clipPath id="mc"><rect width="' + W + '" height="' + H + '" rx="14"/></clipPath>' +
       '<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" ' +
       'orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B64DA"/></marker>' +
       '</defs>';
  s += '<g clip-path="url(#mc)">';
  s += '<rect width="' + W + '" height="' + H + '" fill="#DCEAF8"/>';   /* 바다 */
  s += '<g fill="#EFF3F0" stroke="#C3D2DF" stroke-width="0.9" stroke-linejoin="round">' + land + '</g>';

  /* ── 가까운 마커 벌리기 ── */
  var scr = pts.map(function(p){ return {name: p.name, x: X(p.lon), y: Y(p.lat), ox: X(p.lon), oy: Y(p.lat)}; });
  var MIN = 34;
  for(var pass = 0; pass < 60; pass++){
    var moved = false;
    for(var a = 0; a < scr.length; a++){
      for(var b = a + 1; b < scr.length; b++){
        var A = scr[a], B = scr[b];
        var ddx = B.x - A.x, ddy = B.y - A.y;
        var d = Math.sqrt(ddx * ddx + ddy * ddy);
        if(d >= MIN) continue;
        moved = true;
        if(d < 0.01){ ddx = 1; ddy = 0.6; d = 1.17; }
        var push = (MIN - d) / 2 + 0.6;
        var ux = ddx / d, uy = ddy / d;
        A.x -= ux * push; A.y -= uy * push;
        B.x += ux * push; B.y += uy * push;
      }
    }
    if(!moved) break;
  }
  /* 화면 안으로 되돌리기 */
  scr.forEach(function(p){
    p.x = Math.max(22, Math.min(W - 22, p.x));
    p.y = Math.max(22, Math.min(H - 22, p.y));
  });

  /* ── 라벨 위치 계산 (겹침 회피) ── */
  var placed = [];
  function labelPos(x, y, w){
    var cand = [
      {dx: 0, dy: -26, anchor: 'middle'},   /* 위 */
      {dx: 0, dy: 34, anchor: 'middle'},    /* 아래 */
      {dx: 19, dy: 5, anchor: 'start'},     /* 오른쪽 */
      {dx: -19, dy: 5, anchor: 'end'},      /* 왼쪽 */
      {dx: 16, dy: -20, anchor: 'start'},
      {dx: -16, dy: -20, anchor: 'end'},
      {dx: 16, dy: 28, anchor: 'start'},
      {dx: -16, dy: 28, anchor: 'end'}
    ];
    for(var c = 0; c < cand.length; c++){
      var o = cand[c];
      var lx = x + o.dx, ly = y + o.dy;
      var x0 = o.anchor === 'middle' ? lx - w / 2 : (o.anchor === 'start' ? lx : lx - w);
      var box = {x0: x0 - 3, y0: ly - 15, x1: x0 + w + 3, y1: ly + 5};
      if(box.x0 < 4 || box.x1 > W - 4 || box.y0 < 4 || box.y1 > H - 4) continue;
      var hit = false;
      for(var k = 0; k < placed.length; k++){
        var q = placed[k];
        if(box.x0 < q.x1 && box.x1 > q.x0 && box.y0 < q.y1 && box.y1 > q.y0){ hit = true; break; }
      }
      if(!hit){ placed.push(box); return {x: lx, y: ly, anchor: o.anchor}; }
    }
    return {x: x, y: y - 26, anchor: 'middle'};
  }

  /* ── 이동 경로 ── */
  for(var i = 0; i < scr.length - 1; i++){
    var a = scr[i], b = scr[i + 1];
    var x1 = a.x, y1 = a.y, x2 = b.x, y2 = b.y;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if(len < 2) continue;
    var t = Math.min(15 / len, 0.42);
    var sx = x1 + dx * t, sy = y1 + dy * t;
    var ex = x2 - dx * t, ey = y2 - dy * t;
    var mx = (sx + ex) / 2 - dy * 0.13, my = (sy + ey) / 2 + dx * 0.13;
    s += '<path d="M' + sx.toFixed(1) + ',' + sy.toFixed(1) + ' Q' + mx.toFixed(1) + ',' + my.toFixed(1) +
         ' ' + ex.toFixed(1) + ',' + ey.toFixed(1) + '" fill="none" stroke="#1B64DA" stroke-width="2.4" ' +
         'stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#ar)"/>';
  }

  /* ── 도시 마커 + 라벨 ── */
  var markers = '', labels = '', leaders = '';
  scr.forEach(function(p, i){
    var x = p.x, y = p.y;
    /* 이동한 마커는 실제 위치와 가는 선 연결 */
    var shift = Math.hypot(x - p.ox, y - p.oy);
    if(shift > 6){
      leaders += '<circle cx="' + p.ox.toFixed(1) + '" cy="' + p.oy.toFixed(1) + '" r="2.5" fill="#1B64DA"/>' +
        '<line x1="' + p.ox.toFixed(1) + '" y1="' + p.oy.toFixed(1) + '" x2="' + x.toFixed(1) +
        '" y2="' + y.toFixed(1) + '" stroke="#1B64DA" stroke-width="1.2" stroke-dasharray="2 2" opacity=".6"/>';
    }
    markers += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="13" fill="#3182F6" ' +
               'stroke="#fff" stroke-width="3"/>' +
               '<text x="' + x.toFixed(1) + '" y="' + (y + 4.5).toFixed(1) + '" text-anchor="middle" ' +
               'font-size="13" font-weight="800" fill="#fff" ' +
               'font-family="Pretendard, -apple-system, sans-serif">' + (i + 1) + '</text>';
    var w = p.name.length * 15 + 8;
    var L = labelPos(x, y, w);
    labels += '<text x="' + L.x.toFixed(1) + '" y="' + L.y.toFixed(1) + '" text-anchor="' + L.anchor +
              '" font-size="16" font-weight="800" fill="#14202E" ' +
              'font-family="Pretendard, -apple-system, sans-serif" ' +
              'stroke="#DCEAF8" stroke-width="4.5" paint-order="stroke" stroke-linejoin="round">' +
              escXml(p.name) + '</text>';
  });
  s += leaders + labels + markers;
  s += '</g></svg>';
  return s;
}
function escXml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
