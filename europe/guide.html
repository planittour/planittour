/* 도시 인덱스 테이블 (순서 고정 · 변경 시 기존 링크 깨짐)
   CITY_LIST가 뒤에 정의되므로 처음 호출될 때 만듭니다 */
var CITY_INDEX = null;
function cityIndex(){
  if(CITY_INDEX) return CITY_INDEX;
  /* 전체 도시 목록 순서 = 링크 인코딩 기준
     ⚠ ALL_CITIES 순서를 바꾸면 기존 링크가 깨집니다. 추가는 맨 뒤에 하세요. */
  var arr = [], idx = {};
  ALL_CITIES.forEach(function(c){
    if(idx[c[0]] != null) return;
    idx[c[0]] = arr.length;
    arr.push({country: c[1], city: c[0]});
  });
  CITY_INDEX = {arr: arr, idx: idx};
  return CITY_INDEX;
}
function cityToId(name){ var v = cityIndex().idx[name]; return v == null ? -1 : v; }
function idToCity(id){ var v = cityIndex().arr[id]; return v ? v.city : ''; }
function idToCountry(id){ var v = cityIndex().arr[id]; return v ? v.country : ''; }

/* 투어 · 픽업 · 스냅 키 → 코드 */
function optionCode(name){
  var out = '';
  Object.keys(TOURS).forEach(function(c){
    TOURS[c].forEach(function(t, i){
      if(c + ' · ' + t.n === name) out = 'T' + cityToId(c) + '.' + i;
    });
  });
  if(!out) TRANSFERS.forEach(function(t, i){ if(t.n === name) out = 'P' + i; });
  if(!out) Object.keys(SNAPS).forEach(function(c){
    if(c + ' · 스냅 촬영' === name) out = 'S' + cityToId(c);
  });
  return out || ('X' + name);
}
function codeToOption(code){
  if(!code) return null;
  var k = code.charAt(0), rest = code.slice(1);
  if(k === 'T'){
    var p = rest.split('.');
    var city = idToCity(Number(p[0]));
    var t = (TOURS[city] || [])[Number(p[1])];
    return t ? {name: city + ' · ' + t.n, group: '투어', price: t.p, perRoom: false} : null;
  }
  if(k === 'P'){
    var tr = TRANSFERS[Number(rest)];
    return tr ? {name: tr.n, group: '교통', price: tr.p, perRoom: false} : null;
  }
  if(k === 'S'){
    var c2 = idToCity(Number(rest));
    return SNAPS[c2] ? {name: c2 + ' · 스냅 촬영', group: '스냅', price: SNAPS[c2].p, perRoom: true} : null;
  }
  return {name: rest, group: '기타', price: 0, perRoom: false};
}

function dateToS(d){
  if(!d) return '';
  return String(d.getFullYear()).slice(2) +
    ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
}
function sToDate(s){
  if(!s || s.length !== 6) return null;
  return new Date(2000 + Number(s.slice(0, 2)), Number(s.slice(2, 4)) - 1, Number(s.slice(4, 6)));
}
function timeToS(t){ return t ? t.replace(':', '') : ''; }
function sToTime(s){ return s && s.length === 4 ? s.slice(0, 2) + ':' + s.slice(2) : ''; }

}

function encodePayload(o){

    var c = r.slice();
    if(c[4] === 'BB') c[4] = '';
    if(c[5] === '15:00') c[5] = '';
    if(c[6] === '11:00') c[6] = '';
    return trimTail(c);

function packTrip(){
  var money = calc();
  var plan = money.plan;
  var fl = readFlights();
  var start = plan.start;

  var o = {};
  o.n = customerName();
  var n2 = (gv('fn2') || '').trim();
  if(n2 && (gv('fn') || '').trim()) o.n2 = [(gv('fn') || '').trim(), n2];
  o.p = money.pax;
  o.s = dateToS(start);
  o.q = [
    document.getElementById('qno').value,
    (document.getElementById('qvalid').value || '').trim() || defaultValid(),
    money.sale,
    expiryKey(),
    staffName()
  ];
  /* 호텔 제외 원가 — 재견적 시 호텔비 변동 비교용 (고객 화면에 표시되지 않음) */
  o.xh = money.exHotel;
  o.xhc = money.hotelCost;
  /* 항공료 — 1인 요금 */
  if(money.airPer) o.af = money.airPer;
  /* 이동 수단 — 기차가 아닌 구간만 담습니다 */
  var lm = {};
  Object.keys(LEG_MODE).forEach(function(k){ if(LEG_MODE[k] !== 'train') lm[k] = LEG_MODE[k]; });
  if(Object.keys(lm).length) o.lm = lm;
  /* 숙박: [도시id, 박수, 호텔순번, 객실, 식사, 체크인, 체크아웃, 직접입력 호텔명]

     호텔 상세(위치 · 조식 · 와이파이)는 파일 안 HOTELS 목록에 있으므로
     링크에는 순번만 담습니다. 링크가 절반 가까이 짧아집니다.
     목록에 없는 호텔은 마지막 칸에 이름을 그대로 넣습니다. */
  o.st = plan.rows.map(function(x){
    var idx = hotelIndex(x.city, x.hotel);
    var custom = (idx < 0) ? stayHotel(x) : '';
    return [cityToId(x.city), x.nights, idx, x.room || '', x.meal || 'BB',
            x.ci || '', x.co || '', custom];
  });
  /* 항공: [편명, 항공사, 출발지, 도착지, 날짜, 출발, 도착, 도착일차, 메모] */
  function packF(f){
    if(!f) return null;
    return [f.no || '', f.air || '', f.from || '', f.to || '',
            dateToS(f.date), timeToS(f.dep), timeToS(f.arr), f.nd || 0, f.memo || ''];
  }
  o.f = [packF(fl.out), packF(fl.back)];
  /* 투어: [시작일로부터 며칠째, 코드] */
  o.t = PLACED.map(function(x){
    var d = keyToDate(x.key);
    var off = (start && d) ? Math.round((d - start) / 86400000) : 0;
    return [off, optionCode(x.name)];
  });
  /* 이동 순서 조정값 */
  var mo = [];
  Object.keys(MOVE_ORDER).forEach(function(k){
    var d = keyToDate(k);
    if(d && start) mo.push([Math.round((d - start) / 86400000), MOVE_ORDER[k]]);
  });
  if(mo.length) o.m = mo;
  /* 특전 */
  var pk = pickedPerks();
  if(pk.length) o.k = pk.map(function(id){ return id.replace('p',''); }).join('');
  var pn = (document.getElementById('perkNote').value || '').trim();
  if(pn) o.kn = pn;
  /* 비교안 — 요약만 담습니다 (링크 길이 절약) */
  if(typeof PLANS !== 'undefined' && PLANS.length && !SKIP_PLANS){
    o.pl = PLANS.map(function(p){
      return [p.label, p.note, p.per, p.sale, p.cities, p.nights];
    });
    if(PICK >= 0 && PICK < PLANS.length){
      o.pk = PICK;
      var why = (gv('pickWhy') || '').trim();
      if(why) o.pw = why;
    }
  }

  return encodePayload(o);
}

/* ── 디코딩 → 견적서용 데이터 재구성 ── */
function unpackTrip(){
  var raw = null;
  try{
    var m = /[#?&]d=([^&]+)/.exec(location.hash + location.search);
    if(!m) return null;
    raw = decodePayload(m[1]);
  }catch(e){ return null; }
  if(!raw) return null;

  var start = sToDate(raw.s);
  var pax = raw.p || 1;

  /* 숙박 복원 */
  var rows = (raw.st || []).map(function(x){
    var city = idToCity(x[0]);
    /* 호텔 순번으로 목록에서 상세 정보를 찾아옵니다 */
    var h = hotelByIndex(city, x[2]);
    var inf = (h && h.info) || {};
    return {city: city, nights: x[1],
            hotel: h ? h.n : (x[7] || ''),
            room: x[3] || '', meal: x[4] || 'BB', ci: x[5] || '', co: x[6] || '',
            loc: (h && h.loc) || '',
            bf: inf.bf || '', wifi: inf.wifi || '', hnote: inf.note || ''};
  });
  var cur = start ? new Date(start.getTime()) : null;
  var legs = [];
  rows.forEach(function(x, i){
    if(cur){
      x.inDate = new Date(cur.getTime());
      x.outDate = addDays(cur, x.nights);
      cur = x.outDate;
      if(i < rows.length - 1) legs.push({from: x.city, to: rows[i + 1].city, date: new Date(x.outDate.getTime())});
    }
  });

  /* 항공 복원 */
  function unF(a){
    if(!a) return null;
    var d = sToDate(a[4]);
    if(!d) return null;
    return {no: a[0], air: a[1], from: a[2], to: a[3], date: d,
            dep: sToTime(a[5]), arr: sToTime(a[6]), nd: a[7] || 0, memo: a[8] || '',
            arrDate: addDays(d, a[7] || 0)};
  }
  var flOut = unF((raw.f || [])[0]), flBack = unF((raw.f || [])[1]);

  /* 투어 복원 */
  var placed = (raw.t || []).map(function(x){
    var o = codeToOption(x[1]);
    if(!o) return null;
    o.date = start ? addDays(start, x[0]) : null;
    o.off = x[0];
    return o;
  }).filter(Boolean);
  var moveOrder = {};
  (raw.m || []).forEach(function(x){ moveOrder[x[0]] = x[1]; });

    for(var i = 0; i <= nights; i++){
      var d = addDays(start, i);

      rows.forEach(function(x){

        ev.push({k:'항공', t: ((flOut.air ? flOut.air + ' ' : '') + flOut.no).trim() +
          (flOut.to ? ' · ' + flOut.to : '') + ' 도착' + (flOut.arr ? ' ' + flOut.arr : '') +
          (flOut.memo ? ' · ' + flOut.memo : '')});
      /* 체크아웃 */
      rows.forEach(function(x){
        if(x.outDate && +d === +x.outDate)
          ev.push({k:'숙박', t: x.city + ' 체크아웃', co: x.co || ''});

      /* 이동 · 투어 (순서 반영) */
      legs.forEach(function(g){
        if(+d === +g.date){
          moves.push({k:'이동', t: g.from + ' → ' + g.to + ' 열차 이동'});
          if(cities.indexOf(g.from) < 0) cities.push(g.from);
          if(cities.indexOf(g.to) < 0) cities.push(g.to);
        }

      placed.forEach(function(p){
        if(p.date && +d === +p.date){
          var meta = findTourMeta(p.name);
          items.push({k: p.group, t: p.name.split(' · ').pop(),
                      sub: meta && meta.t.m ? meta.t.m : ''});

        for(var k = 0; k < mv.length + it.length; k++){

      rows.forEach(function(x){
        if(x.inDate && +d === +x.inDate){
          /* 견적 일정표용 — 위치 · 객실 · 식사만
             체크인 시각 등 투숙 정보는 확정서에만 나갑니다 */
          var det = [];
          if(x.loc) det.push(x.loc);
          if(x.room) det.push(x.room);
          if(x.meal) det.push(mealLabel(x.meal));
          ev.push({k:'숙박', t: x.city + ' 체크인' + (x.hotel ? ' · ' + x.hotel : ''),

                   ci: x.ci || '', co: x.co || ''});

           nights + '박 ' + totalDays + '일';
  } else if(start && nights){

      expired: isExpired(qq[3]), staff: qq[4] || '',
      span: span, issued: '',
      mapCities: rows.map(function(x){ return x.city; }),
      fl: {
        out: flOut ? {no: flOut.no, air: flOut.air, from: flOut.from, to: flOut.to,
                      date: fmtDate(flOut.date), dep: flOut.dep, arr: flOut.arr,
                      arrDate: fmtDate(flOut.arrDate), memo: flOut.memo} : null,
        back: flBack ? {no: flBack.no, air: flBack.air, from: flBack.from, to: flBack.to,
                        date: fmtDate(flBack.date), dep: flBack.dep, arr: flBack.arr,
                        arrDate: fmtDate(flBack.arrDate), memo: flBack.memo} : null
      },
      sc: sc, tours: tours, perks: perks, perkNote: raw.kn || '', plans: plans, pickWhy: pickWhy,
      rows: rows, airPer: airPer, airTotal: airPer * pax
    }
  };
}

/* ══════════════════════════════════════════
   기본값 자동 배치
   ══════════════════════════════════════════ */
function autoPlaceEnabled(){
  var el = document.getElementById('autoPlace');
  return !el || el.checked;
}

/* 그날이 온종일 자유일정인지 — 이동·체크인·체크아웃·항공이 하나도 없어야 함 */
function isFreeDay(day, fl){
  if(day.moves.length > 0) return false;
  if(day.fixed.length > 0) return false;
  if(fl.out && +day.d === +fl.out.arrDate) return false;
  if(fl.back && +day.d === +fl.back.date) return false;
  return true;
}

/* 그 도시에 실제로 머무는 날인지 */
function staysIn(day, city){
  if(!city) return false;
  if(day.city === city) return true;
  return (day.cities || []).indexOf(city) > -1;
}

/* 일요일 진행 불가 투어인지 */
function isSundayBlocked(name){
  var meta = findTourMeta(name);
  return !!(meta && meta.t.note && meta.t.note.indexOf('일요일 불가') > -1);
}

function applyAutoPlace(){
  var sc = buildDays();
  if(!sc) return;
  var fl = readFlights();
  var days = sc.days;

  /* ── 0. 기존 자동 항목 재검사 — 조건이 깨진 것은 제거 ──
     일정을 바꾸면 예전에 배치된 투어가 남는 문제를 막습니다.
     담당자가 직접 넣은 항목(auto 아님)은 건드리지 않습니다. */
  PLACED = PLACED.filter(function(p){
    if(!p.auto) return true;
    var day = days.filter(function(d){ return d.key === p.key; })[0];
    if(!day) return false;
    if(p.group === '교통'){
      /* 픽업 — 도착일이 아니거나 도시가 바뀌면 제거 */
      var isArr = fl.out && +day.d === +fl.out.arrDate;
      if(!isArr) return false;
      var tr = TRANSFERS.filter(function(t){ return t.n === p.name; })[0];
      if(tr && tr.noAuto) return false;
      return !!(tr && staysIn(day, tr.city));
    }
    /* 투어 — 자유일정이 아니거나 그 도시가 아니면 제거 */
    var city = p.name.split(' · ')[0];
    if(!isFreeDay(day, fl)) return false;
    if(!staysIn(day, city)) return false;
    if(isSundayBlocked(p.name) && day.d.getDay() === 0) return false;
    return true;
  });

  if(!autoPlaceEnabled()) return;

  /* ── 1. 현지 도착일 픽업 ── */
  days.forEach(function(day){
    if(!fl.out || +day.d !== +fl.out.arrDate) return;
    TRANSFERS.forEach(function(t){
      if(t.noAuto) return;              /* 자동 배치 제외 항목 */
      if(!staysIn(day, t.city)) return;
      if(hasAuto(day.key, t.n)) return;
      if(PLACED.some(function(p){ return p.name === t.n; })) return;
      if(TOUR_MANUAL.indexOf(t.n) >= 0) return;
      PLACED.push({key: day.key, name: t.n, group: '교통', price: t.p,
                   perRoom: false, auto: true});
    });
  });

  /* ── 2. 온종일 자유일정에만 기본 투어 ── */
  Object.keys(AUTO_TOUR).forEach(function(city){
    var tn = AUTO_TOUR[city];
    var key = city + ' · ' + tn;
    /* 이미 어딘가 배치되어 있으면 건너뜀 */
    if(PLACED.some(function(p){ return p.name === key; })) return;
    /* 텍스트로 직접 넣으신 투어라면 자동으로 다시 넣지 않습니다 */
    if(TOUR_MANUAL.indexOf(tn) >= 0) return;
    var t2 = (TOURS[city] || []).filter(function(x){ return x.n === tn; })[0];
    if(!t2) return;
    var sunBlocked = isSundayBlocked(key);

    /* 그 도시의 자유일정 후보 — 일요일 불가면 일요일 제외 */
    var cands = days.filter(function(d){
      if(!isFreeDay(d, fl)) return false;
      if(!staysIn(d, city)) return false;
      if(hasAuto(d.key, key)) return false;
      if(PLACED.some(function(p){ return p.key === d.key && p.name === key; })) return false;
      return true;
    });
    var pick = cands.filter(function(d){ return !(sunBlocked && d.d.getDay() === 0); })[0];
    /* 일요일뿐이면 배치하지 않습니다 */
    if(!pick) return;

    PLACED.push({key: pick.key, name: key, group: '투어', price: t2.p,
                 perRoom: false, auto: true});
  });
}

/* ══════════════════════════════════════════
   항공 스케줄 파일 불러오기
   - 인천공항 정규스케줄 엑셀을 그대로 읽습니다
   - 도착시각은 엑셀에 없으므로 불러온 뒤 채워 넣습니다
   ══════════════════════════════════════════ */

var IMPORTED = [];   /* 도착시각 입력 대기 목록 */

/* 헤더 이름으로 열 위치 찾기 */
function findCol(head, keys){
  for(var i = 0; i < head.length; i++){
    var h = String(head[i] || '').replace(/\s/g, '');
    for(var k = 0; k < keys.length; k++) if(h.indexOf(keys[k]) > -1) return i;
  }
  return -1;
}

/* 운항요일 열들 → "1357" 형태 */
function parseDays(row, dayCols){
  var out = '';
  for(var i = 0; i < 7; i++){
    var c = dayCols[i];
    if(c < 0) continue;
    var v = String(row[c] == null ? '' : row[c]).trim();
    if(v && v !== '-' && v !== '0') out += String(i + 1);
  }
  return out;
}

/* "2026.03.30~2026.08.31" → {f:"20260330", t:"20260831"} */
function parsePeriod(v){
  var m = String(v || '').match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\s*[~\-]\s*(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(!m) return null;
  function p(y, mo, d){ return y + ('0' + mo).slice(-2) + ('0' + d).slice(-2); }
  return {f: p(m[1], m[2], m[3]), t: p(m[4], m[5], m[6])};
}
function parseTime(v){
  if(v == null) return '';
  if(typeof v === 'number'){   /* 엑셀 시간 직렬값 */
    var mins = Math.round(v * 24 * 60);
    return ('0' + Math.floor(mins / 60)).slice(-2) + ':' + ('0' + (mins % 60)).slice(-2);
  }
  var m = String(v).match(/(\d{1,2})\s*[:시]?\s*(\d{2})/);
  return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
}

/* 공항코드 → 도시명 */
var IATA_CITY = {
  FCO:'로마', MXP:'밀라노', LIN:'밀라노', VCE:'베니스', CDG:'파리', ORY:'파리',
  LHR:'런던', LGW:'런던', BCN:'바르셀로나', MAD:'마드리드', LIS:'리스본', OPO:'포르투',
  ZRH:'취리히', GVA:'제네바', PRG:'프라하', VIE:'비엔나', FRA:'프랑크푸르트',
  MUC:'뮌헨', AMS:'암스테르담', IST:'이스탄불', DXB:'두바이', DOH:'도하',
  HEL:'헬싱키', ICN:'인천'
};
function cityOf(code){
  var c = String(code || '').trim().toUpperCase();
  return IATA_CITY[c] || c;
}

/* ── 엑셀 · CSV 불러오기 ── */
function importSchedule(input){
  var file = input.files[0];
  if(!file) return;
  var name = file.name.toLowerCase();
  if(/\.(xlsx|xls)$/.test(name)){
    if(typeof XLSX === 'undefined'){
      alert('엑셀 읽기 기능을 불러오지 못했습니다.\n인터넷 연결을 확인하시거나, 엑셀에서 CSV로 저장해 불러와 주세요.');
      input.value = ''; return;
    }
    var fr = new FileReader();
    fr.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var sh = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sh, {header:1, raw:true, defval:''});
        handleRows(rows);
      }catch(err){ alert('엑셀을 읽지 못했습니다.\n' + err.message); }
      input.value = '';
    };
    fr.readAsArrayBuffer(file);
  } else {
    var fr2 = new FileReader();
    fr2.onload = function(){
      try{
        var lines = String(fr2.result).replace(/^\ufeff/, '').split(/\r?\n/);
        handleRows(lines.map(splitCSVLine));
      }catch(err){ alert('파일을 읽지 못했습니다.'); }
      input.value = '';
    };
    fr2.readAsText(file, 'utf-8');
  }
}
function splitCSVLine(line){
  var out = [], cur = '', q = false;
  for(var i = 0; i < line.length; i++){
    var c = line[i];
    if(q){
      if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if(c === '"') q = true;
      else if(c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

/* 행 데이터 → 구간 구조 */
function handleRows(rows){
  if(!rows || rows.length < 2){ alert('내용이 없는 파일입니다.'); return; }
  /* 헤더 행 찾기 */
  var hi = -1;
  for(var i = 0; i < Math.min(rows.length, 12); i++){
    var joined = rows[i].join('');
    if(/운항편명|편명|FLIGHT/i.test(joined) && /운항기간|기간|출발시간|출발시각/.test(joined)){ hi = i; break; }
  }
  if(hi < 0){ alert('표의 제목 줄을 찾지 못했습니다.\n\n인천공항 정규스케줄 엑셀 또는\n"편명 / 출발시간 / 목적지 / 요일 / 운항기간" 열이 있는 파일을 넣어주세요.'); return; }

  var head = rows[hi];
  var cNo = findCol(head, ['운항편명','편명']);
  var cAir = findCol(head, ['항공사']);
  var cDep = findCol(head, ['출발시간','출발시각','출발']);
  var cTo = findCol(head, ['목적지','도착지','도착공항']);
  var cTerm = findCol(head, ['터미널']);
  var cPeriod = findCol(head, ['운항기간','기간']);
  var dayLabels = ['월','화','수','목','금','토','일'];
  var dayCols = dayLabels.map(function(d){
    for(var k = 0; k < head.length; k++){
      if(String(head[k]).replace(/\s/g,'') === d) return k;
    }
    return -1;
  });

  if(cNo < 0 || cDep < 0){ alert('편명 또는 출발시간 열을 찾지 못했습니다.'); return; }

  /* 편명별로 구간 모으기 */
  var map = {}, skipped = 0;
  rows.slice(hi + 1).forEach(function(r){
    if(!r || !r.length) return;
    var no = String(r[cNo] || '').trim().toUpperCase().replace(/\s/g,'');
    if(!/^[A-Z]{2}\d{1,4}$/.test(no)){ if(no) skipped++; return; }
    var per = cPeriod >= 0 ? parsePeriod(r[cPeriod]) : null;
    var dep = parseTime(r[cDep]);
    if(!dep){ skipped++; return; }
    var days = parseDays(r, dayCols);
    var to = cTo >= 0 ? cityOf(r[cTo]) : '';
    var air = cAir >= 0 ? String(r[cAir] || '').trim() : '';
    if(!map[no]) map[no] = {no: no, air: air, from: '인천', to: to, dir: 'out',
                            term: cTerm >= 0 ? String(r[cTerm] || '').trim() : '', seg: []};
    if(air && !map[no].air) map[no].air = air;
    if(to && !map[no].to) map[no].to = to;
    map[no].seg.push({f: per ? per.f : '', t: per ? per.t : '',
                      dep: dep, arr: '', nd: 0, days: days});
  });

  var out = Object.keys(map).map(function(k){ return map[k]; });
  if(!out.length){ alert('읽을 수 있는 항공편이 없습니다.'); return; }

  /* 기존 데이터의 도착시각을 최대한 이어받기 */
  out.forEach(function(f){
    var old = findFlight(f.no);
    f.seg.forEach(function(sg){
      if(!old || !old.seg) return;
      for(var i = 0; i < old.seg.length; i++){
        var o = old.seg[i];
        if(o.dep === sg.dep && o.arr){ sg.arr = o.arr; sg.nd = o.nd || 0; break; }
      }
    });
  });

  IMPORTED = out;
  openArrivalSheet(skipped);
}

/* ── 도착시각 입력 화면 ── */
function openArrivalSheet(skipped){
  var n = IMPORTED.reduce(function(a, f){ return a + f.seg.length; }, 0);
  var need = IMPORTED.reduce(function(a, f){
    return a + f.seg.filter(function(s){ return !s.arr; }).length; }, 0);
  var h = '<div class="arrnote">' + IMPORTED.length + '개 편명 · ' + n + '개 운항구간을 읽었습니다.' +
    (skipped ? ' (' + skipped + '행 건너뜀)' : '') +

/* ── 내보내기 ── */
function downloadCSV(name, text){
  var blob = new Blob(['\ufeff' + text], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvCell(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
var SCHED_HEAD = '편명,항공사,출발지,도착지,방향,시작일,종료일,출발시각,도착시각,도착일차,운항요일';
function exportSchedule(){
  var rows = [];
  flightList().forEach(function(f){
    (f.seg || []).forEach(function(sg){
      rows.push([f.no, f.air, f.from, f.to, f.dir === 'in' ? '도착' : '출발',
                 sg.f, sg.t, sg.dep, sg.arr, sg.nd || 0, sg.days].map(csvCell).join(','));
    });
  });
  downloadCSV('항공스케줄_' + new Date().toISOString().slice(0,10) + '.csv',
              SCHED_HEAD + '\n' + rows.join('\n'));
  toast('현재 스케줄을 내려받았습니다');
}
function importSavedCSV(input){
  var file = input.files[0];
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var lines = String(r.result).replace(/^\ufeff/, '').split(/\r?\n/).filter(function(x){ return x.trim(); });
      var map = {};
      lines.slice(1).forEach(function(line){
        var v = splitCSVLine(line).map(function(x){ return x.trim(); });
        var no = (v[0] || '').toUpperCase();
        if(!/^[A-Z]{2}\d{1,4}$/.test(no)) return;
        if(!map[no]) map[no] = {no: no, air: v[1], from: v[2], to: v[3],
                                dir: (v[4] || '').indexOf('도착') > -1 ? 'in' : 'out', seg: []};
        map[no].seg.push({f: v[5], t: v[6], dep: v[7], arr: v[8], nd: Number(v[9]) || 0, days: v[10]});
      });
      var out = Object.keys(map).map(function(k){ return map[k]; });
      if(!out.length){ toast('읽을 수 있는 스케줄이 없습니다'); input.value=''; return; }
      FLIGHTS_USER = out;
      refreshPresets();
      syncFlightStatus(out.length);
      toast(out.length + '개 편명을 불러왔습니다');
    }catch(e){ toast('CSV를 읽지 못했습니다'); }
    input.value = '';
  };
  r.readAsText(file, 'utf-8');
}
function resetFlights(){
  FLIGHTS_USER = null;
  refreshPresets();
  syncFlightStatus(0);
  toast('기본 데이터로 되돌렸습니다');
}
function syncFlightStatus(n){
  var el = document.getElementById('fiStatus');
  if(el){
    el.className = n > 0 ? 'ok' : '';
    el.textContent = n > 0 ? ('불러온 스케줄 ' + n + '편 사용 중') : '기본 데이터 사용 중';
  }
  var fw = document.getElementById('flightWarn');
  if(fw && n > 0) fw.innerHTML = '';
}

function packGuide(){
  var o = {};
  var name = customerName();
  if(name) o.n = name;
  var n2a = (gv('fn') || '').trim(), n2b = (gv('fn2') || '').trim();
  if(n2a && n2b) o.n2 = [n2a, n2b];
  /* 숨긴 섹션 */
  var off = {};
  Object.keys(GUIDE_STATE.offSecs).forEach(function(k){
    if((GUIDE_STATE.offSecs[k] || []).length) off[k] = GUIDE_STATE.offSecs[k];
  });
  if(Object.keys(off).length) o.x = off;
  /* 채운 값 */
  var f = {};
  Object.keys(GUIDE_STATE.fills).forEach(function(k){
    var v = (GUIDE_STATE.fills[k] || '').trim();
    if(v) f[k] = v;
  });
  if(Object.keys(f).length) o.f = f;
  var st = staffName();
  if(st) o.s = st;
  if(!Object.keys(o).length) return '';
  return LZString.compressToEncodedURIComponent(JSON.stringify(o));
}

function unpackGuide(){
  try{
    var m = /[#?&]g=([^&]+)/.exec(location.hash + location.search);
    if(!m) return null;
    var j = LZString.decompressFromEncodedURIComponent(m[1]);
    return j ? JSON.parse(j) : null;
  }catch(e){ return null; }
}

  });

  /* 담당자 */
  if(g.s){
    document.querySelectorAll('.gstaff').forEach(function(el){ el.textContent = g.s; });

function navSectionState(id){
  /* 안내문을 만들지 않으면 그 섹션은 아예 표시하지 않습니다 */
  if(id === 'sec-guide'){
    var any = pickedStages().some(function(n){ return n >= 1 && n <= 4; });
    if(!any) return {hide: 1};
  }
  /* 반환 — done 완료 / need 미입력 개수 / '' 해당없음 */
  function cnt(sel){ return document.querySelectorAll(sel).length; }
  try{
    if(id === 'sec-cust'){
      var need = 0;
      if(!customerName()) need++;
      if(!(gv('qpax') || '').trim()) need++;
      return need ? {n: need} : {ok: 1};
    }
    if(id === 'sec-city'){
      var c = tripCityList().length;
      return c ? {ok: 1, label: c + '개'} : {n: 1};
    }
    if(id === 'sec-air'){
      var a = 0;
      if(!gv('foutDate')) a++;
      if(!gv('finDate')) a++;
      return a ? {n: a} : {ok: 1};
    }
    if(id === 'sec-stay'){
      if(!LEGS.length) return {n: 1};
      var miss = 0, nights = 0;
      document.querySelectorAll('#stayrows .stayrow').forEach(function(r){
        var el = r.querySelectorAll('input,select');
        var nt = Number(el[0].value) || 0;
        nights += nt;
        if(nt > 0 && !(Number(el[2].value) || 0)) miss++;
      });
      if(!nights) return {n: 1};
      return miss ? {n: miss} : {ok: 1, label: nights + '박'};
    }
    if(id === 'sec-tour'){
      var t = PLACED.length;
      return t ? {ok: 1, label: t + '건'} : {};
    }
    if(id === 'sec-plans'){
      return PLANS.length ? {ok: 1, label: PLANS.length + '안'} : {};
    }
    if(id === 'sec-perk'){
      var p = document.querySelectorAll('.perkx:checked').length;
      return p ? {ok: 1, label: p + '개'} : {};
    }
    if(id === 'sec-margin'){
      return (Number(gv('mper')) || 0) ? {ok: 1} : {n: 1};
    }
    if(id === 'sec-log'){
      return LOG.length ? {ok: 1, label: LOG.length + '건'} : {};
    }
  }catch(e){}
  return {};
}

      em.textContent = st.label || '\u2713';
      em.className = 'nv-st ok' + (st.label ? ' lb' : '');
    } else {
      em.textContent = '';
      em.className = 'nv-st';
    }
  });
}
function goSec(id){
  var el = document.getElementById(id);
  if(!el) return;
  var y = el.getBoundingClientRect().top + window.pageYOffset - 70;
  window.scrollTo({top: y, behavior: 'smooth'});
}
function syncNavActive(){
  /* 화면 상단(140px)을 지난 섹션 중 가장 아래 것을 현재 위치로 봅니다.
     보이지 않는 섹션(display:none)은 건너뜁니다. */
  var cur = '', best = -1e9;
  NAV_ITEMS.forEach(function(x){
    var el = document.getElementById(x.id);
    if(!el || !el.offsetParent) return;      /* 숨겨진 섹션 제외 */
    var top = el.getBoundingClientRect().top - 140;
    if(top <= 0 && top > best){ best = top; cur = x.id; }
  });
  /* 아직 아무 섹션도 지나지 않았으면 첫 번째 */
  if(!cur){
    for(var i = 0; i < NAV_ITEMS.length; i++){
      var e2 = document.getElementById(NAV_ITEMS[i].id);
      if(e2 && e2.offsetParent){ cur = NAV_ITEMS[i].id; break; }
    }
  }
  document.querySelectorAll('.nv-item').forEach(function(b){
    var id = b.getAttribute('data-sec');
    var el2 = document.getElementById(id);
    b.classList.toggle('on', id === cur);
    b.classList.toggle('off', !(el2 && el2.offsetParent));
  });
}

/* ══════════════════════════════════════════
   여러 안 비교 — 현재 입력을 안으로 저장
   ══════════════════════════════════════════ */
var PLANS = [];   /* [{label, note, code, sale, per, pax, span, cost, margin}] */
var PICK = -1;    /* 추천안 인덱스 · -1이면 추천 없음 */

function snapshotPlan(label, note){
  var money = calc();
  if(!money.sale){ toast('금액이 입력되지 않았습니다'); return null; }
  return {
    label: label || ('안 ' + String.fromCharCode(65 + PLANS.length)),
    note: note || '',
    code: packTrip(),
    sale: money.sale, cost: money.cost, margin: money.margin,
    pax: money.pax, per: Math.round(money.sale / money.pax),
    span: document.getElementById('tripspan').textContent,
    nights: money.nights,
    cities: money.plan.rows.filter(function(x){ return x.nights > 0; })
              .map(function(x){ return x.city + ' ' + x.nights + '박'; }).join(' · '),
    tours: PLACED.length
  };
}

function addPlan(){
  if(PLANS.length >= 3){ toast('최대 3개까지 비교할 수 있습니다'); return; }
  var def = ['A안 · 기본', 'B안 · 상향', 'C안 · 알뜰'][PLANS.length] || ('안 ' + (PLANS.length + 1));
  var label = prompt('이 안의 이름을 정해주세요', def);
  if(label === null) return;
  var note = prompt('간단한 설명 (선택)\n예: 4성급 호텔 · 투어 3건', '');
  var p = snapshotPlan(label.trim() || def, (note || '').trim());
  if(!p) return;
  PLANS.push(p);
  /* 3개가 모이면 중간 가격 안을 추천 후보로 제안 */
  if(PLANS.length === 3 && PICK < 0){
    var sorted = PLANS.map(function(x, i){ return {i: i, per: x.per}; })
                      .sort(function(a, b){ return a.per - b.per; });
    PICK = sorted[1].i;
  }
  renderPlans();
  toast('"' + p.label + '"을 저장했습니다' +
    (PLANS.length === 3 ? ' · 중간 가격 안을 추천으로 지정했습니다' : ''));
}

function removePlan(i){
  PLANS.splice(i, 1);
  if(PICK === i) PICK = -1;
  else if(PICK > i) PICK--;
  renderPlans();
}
function pickPlan(i){
  PICK = (PICK === i) ? -1 : i;
  renderPlans();
  toast(PICK < 0 ? '추천 표시를 해제했습니다' : ('"' + PLANS[i].label + '"을 추천안으로 지정했습니다'));
}
function clearPlans(){
  if(!PLANS.length) return;
  if(!confirm('저장한 안을 모두 지울까요?')) return;
  PLANS = []; PICK = -1; renderPlans();
}
function restorePlan(i){
  var p = PLANS[i];
  if(!p) return;
  document.getElementById('loadLink').value = p.code;
  loadQuote();
}

function renderPlans(){
  var host = document.getElementById('planrows');
  if(!host) return;
  if(!PLANS.length){
    host.innerHTML = '<div class="empty-log">저장한 안이 없습니다. 견적을 작성한 뒤 "현재 내용을 안으로 저장"을 눌러주세요</div>';
    syncPlanBadge(); return;
  }
  var min = Math.min.apply(null, PLANS.map(function(p){ return p.per; }));
  host.innerHTML = PLANS.map(function(p, i){
    var isPick = (i === PICK);
    return '<div class="planrow' + (isPick ? ' pick' : '') + '"><div class="pr-h"><b>' + esc(p.label) + '</b>' +
      (isPick ? '<span class="pr-pick">추천</span>' : '') +
      (p.per === min && PLANS.length > 1 ? '<span class="pr-low">최저가</span>' : '') +
      '<span class="pr-price">' + won(p.per) + '<em>1인</em></span></div>' +
      (p.note ? '<div class="pr-note">' + esc(p.note) + '</div>' : '') +
      '<div class="pr-meta">' + esc(p.cities || '도시 미입력') +
        (p.tours ? ' · 투어 ' + p.tours + '건' : '') + '</div>' +
      '<div class="pr-meta sub">총액 ' + won(p.sale) + ' · ' + p.pax + '명 · 수익 ' + won(p.margin) + '</div>' +
      '<div class="pr-btns">' +
      '<button type="button" class="pk' + (isPick ? ' on' : '') + '" onclick="pickPlan(' + i + ')">' +
        (isPick ? '추천 해제' : '추천으로 지정') + '</button>' +
      '<button type="button" onclick="restorePlan(' + i + ')">이 안으로 편집</button>' +
      '<button type="button" class="rm" onclick="removePlan(' + i + ')">삭제</button>' +
      '</div></div>';
  }).join('');
  syncPlanBadge();
}
function syncPlanBadge(){
  var el = document.getElementById('stPlan');
  if(!el) return;
  el.className = PLANS.length ? 'st ok' : 'st';

/* ══════════════════════════════════════════
   예약 조회 결과 붙여넣기 → 호텔 정보 자동 입력
   ══════════════════════════════════════════ */
function parseBookingText(t){
  var txt = String(t || '').replace(/\r/g, '');
  function pick(labels, stopWords){
    for(var i = 0; i < labels.length; i++){
      var re = new RegExp(labels[i] + '\\s*[\\t:]\\s*([^\\t\\n]+)');
      var m = re.exec(txt);
      if(m){
        var v = m[1].trim();
        if(stopWords) stopWords.forEach(function(w){
          var idx = v.indexOf(w);
          if(idx > 0) v = v.slice(0, idx).trim();
        });
        return v;
      }
    }
    return '';
  }
  var out = {};
  /* 호텔명 — 영문 + (한글) 형태 */
  var hn = pick(['호텔\\s*명', '호텔명', 'Hotel\\s*Name'], ['객실타입','객실 타입','식사']);
  if(hn){
    var mm = /^([^(]+)/.exec(hn);
    out.hotel = (mm ? mm[1] : hn).trim();
    var kr = /\(([^)]+)\)/.exec(hn);
    if(kr) out.hotelKr = kr[1].trim();
  }
  /* 객실 타입 */
  out.room = pick(['객실\\s*타입', 'Room\\s*Type'], ['식사','체크인']);
  /* 식사 */
  var meal = pick(['식사', 'Meal'], ['체크인','체크아웃']);
  if(meal){
    var lm = meal.toLowerCase();
    if(/breakfast|조식/.test(lm)) out.meal = 'BB';
    else if(/half\s*board/.test(lm)) out.meal = 'HB';
    else if(/full\s*board/.test(lm)) out.meal = 'FB';
    else if(/all\s*inclusive/.test(lm)) out.meal = 'AI';
    else if(/room\s*only|없음|불포함/.test(lm)) out.meal = 'RO';
    out.mealRaw = meal;
  }
  /* 날짜 */
  function pickDate(labels){
    var v = pick(labels, ['체크아웃','투숙','객실수']);
    var m2 = /(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/.exec(v);
    if(!m2) return '';
    return m2[1] + '-' + ('0'+m2[2]).slice(-2) + '-' + ('0'+m2[3]).slice(-2);
  }
  out.ci = pickDate(['체크인', 'Check\\s*-?in']);
  out.co = pickDate(['체크아웃', 'Check\\s*-?out']);
  /* 박수 */
  var nt = /(\d+)\s*Night/i.exec(txt) || /투숙\s*기간\s*[\t:]\s*(\d+)/.exec(txt);
  if(nt) out.nights = Number(nt[1]);
  else if(out.ci && out.co){
    var a = new Date(out.ci), b = new Date(out.co);
    out.nights = Math.round((b - a) / 86400000);
  }
  /* 객실수 */
  var rm = /(\d+)\s*Room/i.exec(txt) || /객실수\s*[\t:]\s*(\d+)/.exec(txt);
  if(rm) out.rooms = Number(rm[1]);
  /* 요금 — "최종 객실 요금" 우선 */
  var pr = /최종\s*객실\s*요금[^\d]*([\d,]+)\s*원/.exec(txt) ||
           /객실\s*요금[^\d]*([\d,]+)\s*원/.exec(txt) ||
           /([\d,]{6,})\s*원/.exec(txt);
  if(pr) out.total = Number(pr[1].replace(/,/g, ''));
  if(out.total && out.nights) out.perNight = Math.round(out.total / out.nights);
  /* 취소 규정 */
  var cx = /취소정책[^\t\n]*[\t:]\s*([^\t\n]+)/.exec(txt);
  if(cx){
    var cv = cx[1].trim();
    ['알아두실사항','알아두실 사항','비고','참고'].forEach(function(w){
      var idx = cv.indexOf(w);
      if(idx > 0) cv = cv.slice(0, idx).trim();
    });
    out.cancel = cv;
  }
  /* 도시세 안내 감지 */
  if(/extra\s+\d+\s+per\s+person\s+per\s+night|city\s*tax|도시세/i.test(txt)) out.cityTax = true;
  return out;
}

var PASTE_LEG = '';
function openPaste(city, legId){
  PASTE_LEG = legId || '';
  document.getElementById('pasteCity').value = city || '';
  document.getElementById('pasteText').value = '';
  document.getElementById('pasteResult').innerHTML = '';

}
function closePaste(){ document.getElementById('pasteModal').classList.remove('on'); }

function previewPaste(){
  var r = parseBookingText(document.getElementById('pasteText').value);
  var host = document.getElementById('pasteResult');
  if(!r.hotel && !r.total){
    host.innerHTML = '<div class="pv-empty">읽을 수 있는 내용이 없습니다. 예약 조회 화면의 표를 전체 선택해 복사한 뒤 붙여넣어 주세요.</div>';
    return null;
  }
  var h = '<div class="pv-box"><b>읽어온 내용</b><dl class="kv">';
  function row(k, v){ if(v) h += '<div><dt>' + k + '</dt><dd>' + esc(String(v)) + '</dd></div>'; }
  row('호텔', r.hotel + (r.hotelKr ? ' (' + r.hotelKr + ')' : ''));
  row('객실', r.room);
  row('식사', r.mealRaw ? (r.mealRaw + ' → ' + mealLabel(r.meal || 'BB')) : '');
  row('기간', (r.ci && r.co) ? (r.ci + ' ~ ' + r.co + ' · ' + (r.nights || '?') + '박') : '');
  row('객실수', r.rooms ? (r.rooms + '실') : '');
  row('총액', r.total ? won(r.total) : '');
  row('숙박 총액', r.total ? won(r.total) + (r.rooms > 1 ? ' · ' + r.rooms + '실' : '') : '');
  row('1박당', r.perNight ? won(r.rooms > 1 ? Math.round(r.perNight / r.rooms) : r.perNight) : '');
  row('취소규정', r.cancel);
  h += '</dl>';
  if(r.cityTax) h += '<div class="pv-warn">도시세(숙박세) 별도 징수 안내가 감지되었습니다. 고객에게 불포함 사항으로 안내됩니다.</div>';
  if(r.rooms && r.rooms > 1) h += '<div class="pv-warn">' + r.rooms + '실 기준 요금입니다. 1박 원가는 1실 기준으로 넣어 주세요.</div>';
  h += '</div>';
  host.innerHTML = h;
  return r;
}

function applyPaste(){
  var r = previewPaste();
  if(!r){ toast('읽을 내용이 없습니다'); return; }
  var city = document.getElementById('pasteCity').value;
  var rows = document.querySelectorAll('#stayrows .stayrow');
  var target = null;
  if(PASTE_LEG) target = document.querySelector('#stayrows .stayrow[data-leg="' + PASTE_LEG + '"]');
  if(!target){
    for(var i = 0; i < rows.length; i++){
      if(rows[i].getAttribute('data-city') === city){ target = rows[i]; break; }
    }
  }
  if(!target){ toast('해당 도시 입력칸을 찾지 못했습니다'); return; }
  var el = target.querySelectorAll('input,select');
  if(r.nights) el[0].value = r.nights;
  /* 원가 칸은 1실 · 전체 숙박 총액을 받습니다.
     예약내역이 여러 객실이면 1실 기준으로 나눕니다. */
  if(r.total){
    el[2].value = (r.rooms > 1) ? Math.round(r.total / r.rooms) : r.total;
  }
  /* 목록에 있는 호텔이면 드롭다운에서 자동 선택 */
  var matched = false;
  if(r.hotel){
    var norm = function(t){ return String(t).toLowerCase().replace(/[^a-z0-9가-힣]/g, ''); };
    var want = norm(r.hotel);
    for(var k = 1; k < el[1].options.length; k++){
      var opt = norm(el[1].options[k].value.split(' · ')[0].split(' (')[0]);
      if(!opt) continue;
      if(want.indexOf(opt) === 0 || opt.indexOf(want) === 0){
        el[1].selectedIndex = k; matched = true; break;
      }
    }
  }
  var hn = target.querySelector('.sd-hname');
  if(hn) hn.value = matched ? '' : (r.hotel ? r.hotel + (r.hotelKr ? ' (' + r.hotelKr + ')' : '') : '');
  if(matched) onHotelChange(el[1]);
  /* 총액을 넣었으니 1박당 금액을 다시 계산합니다 */
  onTotalInput(el[2]);
  var rm = target.querySelector('.sd-room');
  if(rm && r.room) rm.value = r.room;
  if(r.meal){
    var ml = target.querySelector('.sd-meal');
    if(ml) ml.value = r.meal;
    var tog = target.querySelector('.mealtog');
    if(tog && (r.meal === 'BB' || r.meal === 'RO')){
      tog.querySelectorAll('button').forEach(function(b){
        b.classList.toggle('on', b.classList.contains(r.meal === 'BB' ? 'bb' : 'ro'));
      });
    } else if(tog){
      var link = target.querySelector('.mealmore');
      if(link) toggleMealMode(link);
      var ml2 = target.querySelector('.sd-meal');
      if(ml2) ml2.value = r.meal;
    }
  }
  closePaste();
  readLegInputs();
  renderLegs();
  syncPlan(); calc();
  toast(city + ' 정보를 입력했습니다');
}

/* ══════════════════════════════════════════
   견적 불러오기 — 발행한 링크를 다시 입력 상태로
   ══════════════════════════════════════════ */
function parseQuoteLink(text){
  var t = String(text || '').trim();
  var m = /[#?&]d=([^&\s]+)/.exec(t);
  var code = m ? m[1] : t;
  try{
    return decodePayload(code);
  }catch(e){ return null; }
}

var PREV_COST = null;
function renderPrevCost(){

function loadQuote(){
  var raw = parseQuoteLink(document.getElementById('loadLink').value);
  if(!raw){ alert('견적 링크를 읽지 못했습니다.\n\n발행된 견적서 주소 전체를 붙여넣어 주세요.'); return; }
  if(!confirm('현재 입력한 내용이 모두 바뀝니다. 불러올까요?')) return;

  /* 고객 정보 */
  if(raw.n2 && raw.n2.length === 2){ sv('fn', raw.n2[0]); sv('fn2', raw.n2[1]); }
  else { sv('fn', String(raw.n || '').replace(/\s*님$/, '')); sv('fn2', ''); }
  syncNames();
  sv('qpax', String(raw.p || 2));

  /* 구간 복원 — 순서와 0박 유지 */
  LEGS = (raw.st || []).map(function(x){
    var city = idToCity(x[0]);
    var L = newLeg(city, x[1]);
    /* 호텔 순번으로 목록에서 되찾습니다 */
    var h = hotelByIndex(city, x[2]);
    if(h) L.hotel = h.n + ' · ' + h.g;
    else L.hname = x[7] || '';
    L.room = x[3] || ''; L.meal = x[4] || 'BB';
    L.total = 0;
    L.ci = x[5] || DEFAULT_CI; L.co = x[6] || DEFAULT_CO;
    return L;
  });
  LEG_ORDER_MANUAL = true;
  syncPickerFromLegs();
  renderLegs();

  /* 현지 시작일 */
  var start = sToDate(raw.s);
  if(start) sv('qstart', ymd(start));

  /* 항공 */
  function unF(a, pre){
    if(!a) return;
    sv(pre + 'No', a[0] || ''); sv(pre + 'Air', a[1] || '');
    sv(pre + 'From', a[2] || ''); sv(pre + 'To', a[3] || '');
    var d = sToDate(a[4]); if(d) sv(pre + 'Date', ymd(d));
    sv(pre + 'Dep', sToTime(a[5])); sv(pre + 'Arr', sToTime(a[6]));
    sv(pre + 'Nd', String(a[7] || 0)); sv(pre + 'Memo', a[8] || '');
  }
  unF((raw.f || [])[0], 'fout');
  unF((raw.f || [])[1], 'fin');

  setTimeout(function(){
    syncPlan();

    /* 투어 배치 복원 */
    PLACED = [];
    AUTO_REMOVED = {};
    (raw.t || []).forEach(function(x){
      var o = codeToOption(x[1]);
      if(!o || !start) return;
      var d = addDays(start, x[0]);
      PLACED.push({key: dateKey(d), name: o.name, group: o.group,
                   price: o.price, perRoom: o.perRoom});
    });
    MOVE_ORDER = {};
    (raw.m || []).forEach(function(x){
      if(start) MOVE_ORDER[dateKey(addDays(start, x[0]))] = x[1];
    });
    /* 불러온 일정은 자동배치 끔 — 원본 그대로 유지 */
    var ap = document.getElementById('autoPlace');
    if(ap) ap.checked = false;

    /* 특전 */
    if(raw.k != null){
      var on = String(raw.k).split('');
      document.querySelectorAll('.perkx').forEach(function(b){
        b.checked = on.indexOf(b.value.replace('p','')) > -1;
        b.closest('.perkrow').classList.toggle('on', b.checked);
      });
      syncPerkBadge();
    }
    if(raw.kn) sv('perkNote', raw.kn);

    /* 견적번호 · 유효기간 */
    var qq = raw.q || [];
    if(qq[0]) sv('qno', nextVersionNo(qq[0]));
    if(qq[1]) sv('qvalid', qq[1]);

    renderPlanner(); calc();
    document.getElementById('loadLink').value = '';
    closeLoad();
    PREV_COST = {hotel: raw.xhc || 0, exHotel: raw.xh || 0, sale: (raw.q || [])[2] || 0};
    renderPrevCost();
    toast('견적을 불러왔습니다 · 원가는 다시 입력해 주세요');
    setTimeout(function(){
      alert('불러오기 완료\n\n' +
        '· 호텔 1박 원가와 열차 요금은 링크에 담기지 않아 비어 있습니다.\n' +
        '· 견적번호는 수정본으로 자동 변경되었습니다.\n' +
        '· 자동 배치는 꺼진 상태입니다 (원본 일정 유지).');
    }, 400);
  }, 60);
}

/* PT-260807-01 → PT-260807-01-R2 */
function nextVersionNo(no){
  var m = /^(.*?)-R(\d+)$/.exec(no);
  if(m) return m[1] + '-R' + (Number(m[2]) + 1);
  return no + '-R2';
}

/* ══════════════════════════════════════════
   텍스트로 일정 입력
   예) 10/10 출발 파리2-인터라켄2-밀라노2-베니스1-피렌체1-로마3
   ══════════════════════════════════════════ */

/* 가장 가까운 미래 날짜로 해석 */
function parseLooseDate(txt){
  var m = /(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/.exec(txt);
  if(m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  m = /(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/.exec(txt);
  if(!m) return null;
  var mo = Number(m[1]), d = Number(m[2]);
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var y = today.getFullYear();
  var cand = new Date(y, mo - 1, d);
  if(cand < today) cand = new Date(y + 1, mo - 1, d);
  return cand;
}

/* ══════════════════════════════════════════
   도시명 찾기

   순서 — 정확 일치 → 약어 → 앞부분 일치 → 오탈자 보정
   ══════════════════════════════════════════ */

/* 자주 쓰는 약어. 긴 것부터 찾으므로 마요 · 그델도 정확히 잡힙니다. */
var CITY_ABBR = {
  "파":"파리", "니":"니스",
  "취":"취리히", "루":"루체른", "인":"인터라켄",
  "그린":"그린델발트", "그델":"그린델발트", "체":"체르마트",
  "밀":"밀라노", "베":"베니스", "피":"피렌체", "로":"로마",
  "나":"나폴리", "포":"포지타노", "아":"아말피",
  "프":"프라하", "잘":"잘츠부르크", "할":"할슈타트",
  "비":"비엔나", "빈":"비엔나", "부":"부다페스트",
  "마":"마드리드", "바":"바르셀로나", "세":"세비야",
  "그":"그라나다", "그린":"그린델발트", "마요":"마요르카", "테":"테네리페",
  "리":"리스본", "포르":"포르투",
  "런":"런던"
};

/* 두 글자열이 몇 글자 다른지 (오탈자 판정용) */
function editDistance(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  var prev = [], cur = [], i, j;
  for(j = 0; j <= b.length; j++) prev[j] = j;
  for(i = 1; i <= a.length; i++){
    cur[0] = i;
    for(j = 1; j <= b.length; j++){
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j-1] + 1,
        prev[j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1)
      );
    }
    for(j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

/* 오탈자로 보이는 도시를 찾습니다.
   짧은 이름은 약어와 겹칠 수 있어 4글자 이상만 봅니다. */
function fuzzyCity(q){
  if(q.length < 3) return null;
  /* 약어로 등록된 말은 보정하지 않습니다 */
  if(CITY_ABBR[q]) return null;

  /* 글자 수에 따라 허용 오차를 정합니다.
     3글자는 1글자, 4글자 이상은 2글자까지 봅니다. */
  var allow = q.length >= 4 ? 2 : 1;

  var cands = [];
  ALL_CITIES.forEach(function(c){
    var d = editDistance(q, c[0]);
    if(d <= allow) cands.push({city: c[0], d: d});
  });
  if(!cands.length) return null;

  cands.sort(function(a, b){ return a.d - b.d; });
  /* 가장 가까운 후보가 여럿이면 판단하지 않습니다 */
  var top = cands.filter(function(x){ return x.d === cands[0].d; });
  return top.length === 1 ? top[0].city : null;
}

var LAST_FUZZY = [];   /* 오탈자로 고친 목록 — 미리보기에 표시합니다 */
var TOUR_LINES = [];   /* 두 번째 줄부터의 투어 입력 */
var TOUR_PARSED = [];  /* 해석 결과 — 미리보기에서 선택할 수 있습니다 */
var TOUR_MANUAL = [];  /* 텍스트로 직접 넣은 투어 — 자동 배치가 건너뜁니다 */

function matchCity(name){
  var q = String(name).trim();
  if(!q) return null;

  /* 1. 정확히 일치 */
  if(CITY_DB[q]) return q;

  /* 2. 약어 — 긴 것부터 */
  if(CITY_ABBR[q]) return CITY_ABBR[q];

  var lower = q.toLowerCase();

  /* 3. 영문 정확 일치 */
  var hit = null;
  ALL_CITIES.forEach(function(c){
    if(hit) return;
    if(c[4].toLowerCase() === lower) hit = c[0];
  });
  if(hit) return hit;

  /* 4. 앞부분 일치 — 두 글자 이상일 때만 봅니다 */
  if(q.length >= 2){
    ALL_CITIES.forEach(function(c){
      if(hit) return;
      if(c[0].indexOf(q) === 0 || (c[0].length >= 2 && q.indexOf(c[0]) === 0) ||
         (lower.length >= 3 && c[4].toLowerCase().indexOf(lower) === 0)) hit = c[0];
    });
  }
  if(hit) return hit;

  /* 5. 오탈자 보정 */
  var fz = fuzzyCity(q);
  if(fz){
    LAST_FUZZY.push({typed: q, city: fz});
    return fz;
  }
  return null;
}

/* 텍스트 → {date, stops:[{city, nights}], unknown:[]} */
/* ══════════════════════════════════════════
   투어 줄 해석

   일정 줄 아래에 투어를 한 줄씩 적을 수 있습니다.
     6/6 밀1 베3 피1 로3
     6/7 베니스투어
     첫날 밀라노픽업
     마지막날 로마샌딩
   ══════════════════════════════════════════ */

/* 이름이 비슷한 투어를 모두 찾습니다 */
function findTours(word){
  var q = String(word || '').replace(/\s+/g, '');
  if(!q) return [];
  var hits = [];

  /* 도시 이름이 앞에 붙었으면 그 도시 안에서 먼저 찾습니다 */
  Object.keys(TOURS).forEach(function(city){
    TOURS[city].forEach(function(t, i){
      var name = t.n.replace(/\s+/g, '');
      var score = 0;
      if(name === q) score = 100;
      else if(name.indexOf(q) === 0) score = 80;
      else if(name.indexOf(q) >= 0) score = 60;
      else {
        /* "베니스투어" 처럼 도시 + 낱말로 나뉘는 경우 */
        var c = q.replace(city.replace(/\s+/g, ''), '');
        if(c !== q && c.length >= 1){
          if(name.indexOf(c) >= 0) score = 50;
          else if(c === '투어' || c === '시티투어') score = 30;
        }
        /* "돌로미티투어" 처럼 이름 중간의 낱말로 찾는 경우 */
        if(!score){
          var w = q.replace(/투어$|입장권$|셔틀$/, '');
          if(w.length >= 2 && name.indexOf(w) >= 0) score = 45;
        }
      }
      if(score) hits.push({city: city, idx: i, tour: t, score: score});
    });
  });

  /* 픽업 · 샌딩 */
  TRANSFERS.forEach(function(t, i){
    var name = t.n.replace(/\s+/g, '');
    var cityKey = (t.city || '').replace(/\s+/g, '');
    var score = 0;
    if(name.indexOf(q) >= 0) score = 70;
    else if(cityKey && q.indexOf(cityKey) === 0){
      var rest = q.replace(cityKey, '');
      if(/픽업|샌딩|트랜스퍼|이동/.test(rest)) score = 55;
    }
    if(score) hits.push({city: t.city, idx: i, transfer: t, score: score});
  });

  hits.sort(function(a, b){ return b.score - a.score; });
  return hits.slice(0, 6);
}

/* "첫날" "마지막날" "3일차" "6/7" 을 날짜로 */
function parseDayToken(tok, start, totalNights){
  var t = String(tok || '').trim();
  if(!t || !start) return null;
  if(/^첫날|^첫째날|^도착일/.test(t)) return new Date(start.getTime());
  if(/^마지막날|^막날|^출국일|^귀국일/.test(t)){
    return addDays(start, totalNights);
  }
  var m = /^(\d+)\s*일차$/.exec(t);
  if(m) return addDays(start, Number(m[1]) - 1);
  var d = parseLooseDate(t);
  if(d){
    /* 연도가 없으면 여행 기간에 맞춥니다 */
    var y = start.getFullYear();
    var cand = new Date(y, d.getMonth(), d.getDate());
    if(cand < start) cand = new Date(y + 1, d.getMonth(), d.getDate());
    return cand;
  }
  return null;
}

/* 일정표가 쓰는 날짜 키 (2027-6-7 형식) */
function planKey(d){
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

/* 그 날 어느 도시에 있는지 */
function cityOnDate(plan, date){
  if(!plan || !plan.days) return null;
  var key = planKey(date);
  for(var i = 0; i < plan.days.length; i++){
    if(planKey(plan.days[i].d) === key){
      return {cities: plan.days[i].cities || [plan.days[i].city],
              moving: (plan.days[i].cities || []).length > 1};
    }
  }
  return null;
}

/* 투어 줄 전체를 읽습니다 */
function parseTourLines(lines, plan, start, totalNights){
  var out = [];
  lines.forEach(function(raw){
    var line = String(raw || '').trim();
    if(!line) return;

    /* 앞부분을 날짜로, 나머지를 투어 이름으로 */
    var m = /^(\S+)\s+(.+)$/.exec(line);
    if(!m){ out.push({raw: line, error: '날짜와 투어 이름을 함께 적어주세요'}); return; }

    var date = parseDayToken(m[1], start, totalNights);
    if(!date){ out.push({raw: line, error: '날짜를 읽지 못했습니다'}); return; }

    var word = m[2].trim();
    var hits = findTours(word);
    if(!hits.length){ out.push({raw: line, date: date, word: word, error: '해당하는 투어를 찾지 못했습니다'}); return; }

    /* 그날 머무는 도시와 맞는지 */
    var where = cityOnDate(plan, date);
    var item = {raw: line, date: date, word: word, hits: hits, pick: 0};
    if(where){
      var ok = hits.filter(function(h){ return where.cities.indexOf(h.city) >= 0; });
      if(ok.length){
        item.hits = ok.concat(hits.filter(function(h){ return ok.indexOf(h) < 0; }));
        item.pick = 0;
        if(where.moving) item.warn = '도시 간 이동일입니다. 투어를 진행할 시간이 되는지 확인해 주세요';
      } else {
        item.warn = '이 날은 ' + where.cities.join(' · ') + ' 일정입니다. 투어 도시가 맞는지 확인해 주세요';
      }
    }
    out.push(item);
  });
  return out;
}

function parseItineraryText(txt){
  var raw = String(txt || '').trim();
  if(!raw) return null;
  /* 첫 줄은 일정, 나머지는 투어입니다 */
  var lines = raw.split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  var t = lines.shift() || '';
  TOUR_LINES = lines;
  LAST_FUZZY = [];
  var out = {date: null, stops: [], unknown: []};

  /* 날짜 먼저 */
  out.date = parseLooseDate(t);
  /* 날짜 부분 제거 */
  t = t.replace(/\d{4}\s*[.\-\/년]\s*\d{1,2}\s*[.\-\/월]\s*\d{1,2}\s*[일]?/g, ' ');
  t = t.replace(/\d{1,2}\s*[.\-\/월]\s*\d{1,2}\s*[일]?/g, ' ');
  t = t.replace(/출발|시작|귀국|도착/g, ' ');

  /* "파리 2박" 처럼 도시와 숫자 사이 공백이 있으면 먼저 붙입니다 */
  t = t.replace(/([가-힣A-Za-z][가-힣A-Za-z\s]*?)\s+(\d+)\s*박/g, function(_, a, b){
    return a.replace(/\s+/g, '') + b + '박';
  });
  /* 구분자 통일 */
  t = t.replace(/[,·>→~\/|+]+/g, '-').replace(/\s*-\s*/g, '-').replace(/\s+/g, '-');
  var parts = t.split('-').filter(function(x){ return x.trim(); });

  parts.forEach(function(p){
    p = p.trim();
    /* "파리2" "파리 2박" "파리2박" */
    var m = /^(.+?)\s*(\d+)\s*박?$/.exec(p);
    var name, n;
    if(m){ name = m[1].trim(); n = Number(m[2]); }
    else { name = p.replace(/박$/, '').trim(); n = 0; }
    if(!name) return;
    var city = matchCity(name);
    if(!city){ out.unknown.push(name); return; }
    out.stops.push({city: city, nights: n});
  });
  out.fuzzy = LAST_FUZZY.slice();
  return out;
}

/* 미리보기 */
/* 아직 입력 전이라 임시로 날짜별 도시를 계산합니다 */
function previewPlan(r){
  var start = r.date ? new Date(r.date.getTime()) : new Date();
  /* 첫 도시 도착일 = 한국 출발 다음날로 보되, 항공 정보가 있으면 그걸 씁니다 */
  var nd = Number(gv('foutNd'));
  if(isNaN(nd)) nd = 0;
  var cur = addDays(start, nd);
  var days = [], first = new Date(cur.getTime());
  r.stops.forEach(function(x, i){
    for(var k = 0; k < Math.max(1, x.nights); k++){
      var d = addDays(cur, k);
      var found = null;
      days.forEach(function(dd){ if(planKey(dd.d) === planKey(d)) found = dd; });
      if(found){ if(found.cities.indexOf(x.city) < 0) found.cities.push(x.city); }
      else days.push({d: d, city: x.city, cities: [x.city]});
    }
    cur = addDays(cur, x.nights);
    /* 이동일에는 두 도시가 함께 있습니다 */
    if(i < r.stops.length - 1){
      var md = new Date(cur.getTime());
      var f2 = null;
      days.forEach(function(dd){ if(planKey(dd.d) === planKey(md)) f2 = dd; });
      var nxt = r.stops[i + 1].city;
      if(f2){ if(f2.cities.indexOf(nxt) < 0) f2.cities.push(nxt); }
      else days.push({d: md, city: nxt, cities: [nxt]});
    }
  });
  return {days: days, start: first};
}

/* 투어 후보를 보여주고 고르게 합니다 */
function renderTourPreview(){
  if(!TOUR_PARSED.length) return '';
  var h = '<div class="tp-box"><b class="tp-h">투어 · 픽업</b>';
  TOUR_PARSED.forEach(function(it, i){
    h += '<div class="tp-row' + (it.error ? ' bad' : '') + '">';
    h += '<span class="tp-d">' + (it.date ? fmtDate(it.date) : '?') + '</span>';
    if(it.error){
      h += '<span class="tp-e">' + esc(it.raw) + ' — ' + it.error + '</span>';
    } else if(it.hits.length === 1){
      var t = it.hits[0].tour || it.hits[0].transfer;
      h += '<span class="tp-n">' + esc(t.n) + '</span>' +
           '<span class="tp-p">' + won(t.p) + '</span>';
    } else {
      h += '<span class="tp-multi">' +
        it.hits.slice(0, 4).map(function(x, k){
          var t = x.tour || x.transfer;
          return '<button type="button" class="tp-opt' + (k === it.pick ? ' on' : '') +
            '" onclick="pickTour(' + i + ',' + k + ')">' + esc(t.n) +
            '<em>' + won(t.p) + '</em></button>';
        }).join('') + '</span>';
    }
    h += '</div>';
    if(it.warn) h += '<div class="tp-warn">' + esc(it.warn) + '</div>';
  });
  return h + '</div>';
}

function pickTour(i, k){
  if(TOUR_PARSED[i]) TOUR_PARSED[i].pick = k;
  var host = document.getElementById('itinPreview');
  if(!host) return;
  /* 선택만 바꾸고 다시 그립니다 */
  var box = host.querySelector('.tp-box');
  if(box) box.outerHTML = renderTourPreview();
}

function previewItinText(){
  var r = parseItineraryText(document.getElementById('itinText').value);
  var host = document.getElementById('itinPreview');
  if(!r || (!r.stops.length && !r.date)){
    host.innerHTML = '<div class="ip-none">읽을 수 있는 내용이 없습니다. 예) 10/10 출발 파리2-인터라켄2-로마3</div>';
    return null;
  }
  var total = r.stops.reduce(function(a, x){ return a + x.nights; }, 0);
  var h = '<div class="ip-box">';
  if(r.date){
    h += '<div class="ip-row"><span>한국 출발</span><b>' + fmtDate(r.date) + ' (' +
      r.date.getFullYear() + '년)</b></div>';
  } else {
    h += '<div class="ip-row warnrow"><span>한국 출발</span><b>날짜를 찾지 못했습니다</b></div>';
  }
  if(r.stops.length){
    h += '<div class="ip-row"><span>일정</span><b>' +
      r.stops.map(function(x){
        return esc(x.city) + ' ' + (x.nights ? x.nights + '박' : '<i class="ip-pass">경유</i>');
      }).join(' → ') + '</b></div>';
    h += '<div class="ip-row"><span>IN · OUT</span><b>' +
      esc(r.stops[0].city) + ' IN → ' + esc(r.stops[r.stops.length - 1].city) + ' OUT</b></div>';
    h += '<div class="ip-row"><span>합계</span><b>' + total + '박 · ' + r.stops.length + '개 구간</b></div>';
  }
  if(r.fuzzy && r.fuzzy.length){
    h += '<div class="ip-fuzzy">' +
      r.fuzzy.map(function(x){
        return esc(x.typed) + ' → <b>' + esc(x.city) + '</b>';
      }).join(' · ') + ' 로 인식했습니다</div>';
  }
  /* 투어 줄 해석 — 임시 일정을 만들어 도시를 맞춰봅니다 */
  TOUR_PARSED = [];
  if(TOUR_LINES.length && r.stops.length && r.date){
    var tmpPlan = previewPlan(r);
    TOUR_PARSED = parseTourLines(TOUR_LINES, tmpPlan, tmpPlan.start, total);
    h += renderTourPreview();
  }
  if(r.unknown.length){
    h += '<div class="ip-warn">찾지 못한 도시 · ' + r.unknown.map(esc).join(', ') +
      '<br>도시명을 정확히 적어주세요.</div>';
  }
  var added = r.stops.filter(function(x){ return !isMainCity(x.city); });
  if(added.length){
    h += '<div class="ip-note">주요 도시 목록에 없는 ' +
      added.map(function(x){ return esc(x.city); }).join(', ') + '은(는) 자동으로 추가됩니다.</div>';
  }
  h += '</div>';
  host.innerHTML = h;
  return r;
}

/* 미리보기에서 고른 투어를 일정에 넣습니다.
   자동 배치된 것과 겹치면 입력한 날짜를 우선합니다. */
function applyTourLines(){
  if(!TOUR_PARSED.length) return 0;
  var n = 0;
  /* 먼저 겹치는 자동 배치를 걷어냅니다 */
  var names = [];
  TOUR_PARSED.forEach(function(it){
    if(it.error || !it.hits || !it.hits.length) return;
    var pk = it.hits[it.pick] || it.hits[0];
    var tt = pk.tour || pk.transfer;
    if(tt) names.push(tt.n);
  });
  /* 자동 배치는 "도시 · 투어명" 형태라 도시 부분을 떼고 비교합니다 */
  function bare(x){ return String(x).split(' · ').pop().trim(); }
  TOUR_MANUAL = names.map(bare);
  PLACED = PLACED.filter(function(p){
    if(!p.auto) return true;
    return TOUR_MANUAL.indexOf(bare(p.name)) < 0;
  });
  TOUR_PARSED.forEach(function(it){
    if(it.error || !it.date || !it.hits || !it.hits.length) return;
    var pick = it.hits[it.pick] || it.hits[0];
    var t = pick.tour || pick.transfer;
    if(!t) return;
    var key = planKey(it.date);
    /* 이미 같은 것이 있으면 건너뜁니다 */
    if(PLACED.some(function(p){ return p.name === t.n; })) return;
    PLACED.push({key: key, name: t.n,
                 group: pick.transfer ? '교통' : '투어',
                 price: t.p, perRoom: false});
    n++;
  });
  return n;
}

function applyItinText(){
  var r = previewItinText();
  if(!r || !r.stops.length){ toast('일정을 읽지 못했습니다'); return; }

  /* 1. 목록에 없는 도시 추가 */
  r.stops.forEach(function(x){
    if(!isMainCity(x.city) && EXTRA_CITIES.indexOf(x.city) < 0) EXTRA_CITIES.push(x.city);
  });
  renderTabs();

  /* 2. 구간 생성 — 적은 순서 그대로 (같은 도시 반복 · 0박 지원) */
  LEGS = r.stops.map(function(x){ return newLeg(x.city, x.nights); });
  LEG_ORDER_MANUAL = true;
  syncPickerFromLegs();
  renderLegs();

  /* 3. 한국 출발일 → 항공 날짜 */
  if(r.date){
    RETURN_MANUAL = false;
    sv('foutDate', ymd(r.date));
  }

  setTimeout(function(){
    syncPlan(); renderPlanner();
    /* 4. 투어 배치 */
    var placed = applyTourLines();
    renderPlanner(); calc();
    var total = r.stops.reduce(function(a, y){ return a + y.nights; }, 0);
    toast(r.stops.length + '개 도시 · ' + total + '박' +
          (placed ? ' · 투어 ' + placed + '건' : '') + '을 입력했습니다');
    var pv = document.getElementById('itinPreview');
    if(pv) pv.innerHTML = '<div class="ip-done">입력 완료 · ' + r.stops.length + '개 도시 ' + total + '박' +
      '<em>항공 편명과 시각, 귀국편 날짜, 호텔 원가는 아래에서 직접 입력해 주세요</em></div>';
  }, 80);
}

function closeItin(){ /* 상시 노출 방식이라 닫을 창이 없습니다 */ }

/* ══════════════════════════════════════════
   견적 엔진 — 도시 선택 → 박수 → 날짜 → 요금
   ══════════════════════════════════════════ */

var DAY_KO = ['일','월','화','수','목','금','토'];

function parseDate(v){
  if(!v) return null;
  var p = v.split('-');
  if(p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function keyToDate(k){
  if(!k) return null;
  var p = k.split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
function fmtKey(k){ var d = keyToDate(k); return d ? fmtDate(d) : ''; }
function fmtDate(d){ return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAY_KO[d.getDay()] + ')'; }
function isWeekendFare(d){ var w = d.getDay(); return w === 0 || w === 6; }  /* 토·일 = 주말 요금 */

/* 선택한 도시 목록 (순서 유지) */
function tripCityList(){
  var arr = Array.prototype.map.call(
    document.querySelectorAll('#picker input:checked'),
    function(b){ return {country: b.getAttribute('data-country'), city: b.value}; });
  arr.sort(function(a, b){ return cityRank(a.country, a.city) - cityRank(b.country, b.city); });
  return arr;
}

/* ── 숙박 입력칸 자동 생성 ── */

/* ══════════════════════════════════════════
   항공 도시 자동 연결 · 도착일차 자동 판정
   ══════════════════════════════════════════ */

/* 항공사 코드 → 현지 도착일차 (0=당일, 1=익일)
   한국 밤 출발 노선은 익일 도착입니다 */
var AIRLINE_ND = {
  KE:0, OZ:0, AF:0, LH:0, BA:0, AZ:0, IB:0, LX:0, OS:0, TW:0, KL:0, TP:0,
  EK:1, AY:1, QR:0, TK:0, EY:1, SQ:1, CX:0, CA:0, MU:0, CZ:0
};
function ndByFlightNo(no){
  var m = /^([A-Z]{2})/.exec(String(no || '').toUpperCase().replace(/\s/g, ''));
  if(!m) return null;
  var v = AIRLINE_ND[m[1]];
  return (v == null) ? null : v;
}

/* 일정 첫 도시 → 가는 편 도착지 / 마지막 도시 → 오는 편 출발지 */
function syncFlightCities(){
  var a = firstCity(), b = lastCity();
  if(a){
    var toEl = document.getElementById('foutTo');
    if(toEl && toEl.value !== a){ toEl.value = a; refreshPresets(); }
  }
  if(b){
    var frEl = document.getElementById('finFrom');
    if(frEl && frEl.value !== b){ frEl.value = b; refreshPresets(); }
  }
  var oEl = document.getElementById('foutFrom');
  if(oEl && !oEl.value) oEl.value = '인천';
  var iEl = document.getElementById('finTo');
  if(iEl && !iEl.value) iEl.value = '인천';
  syncReturnDate();
}

/* 박수 합계로 귀국일 자동 계산
   현지 시작일 = 출발일 + 가는편 도착일차
   현지 출발일 = 현지 시작일 + 총 박수 */
var RETURN_MANUAL = false;
function syncReturnDate(){
  if(RETURN_MANUAL) return;
  var out = parseDate(gv('foutDate'));
  if(!out) return;
  var n = totalNights();
  if(!n) return;
  var nd = Number(gv('foutNd'));
  if(isNaN(nd)){ nd = ndByFlightNo(gv('foutNo')); nd = (nd == null) ? 0 : nd; }
  var localStart = addDays(out, nd);
  var back = addDays(localStart, n);
  var el = document.getElementById('finDate');
  if(el && el.value !== ymd(back)){
    el.value = ymd(back);
    refreshPresets();
  }
}
function toggleReturnManual(){
  RETURN_MANUAL = !RETURN_MANUAL;
  var btn = document.getElementById('retManual');
  if(btn) btn.textContent = RETURN_MANUAL ? '자동으로' : '직접 지정';
  if(!RETURN_MANUAL) syncReturnDate();
  syncPlan(); calc();
}

/* 편명 입력 시 도착일차 자동 판정 */
function onFlightNoInput(dir){
  var pre = dir === 'out' ? 'fout' : 'fin';
  var nd = ndByFlightNo(gv(pre + 'No'));
  if(nd != null){
    /* 오는 편은 유럽→한국이라 기본 익일 */
    sv(pre + 'Nd', String(dir === 'in' ? Math.max(nd, 1) : nd));
  }
  syncPlan();
}

/* ══════════════════════════════════════════
   숙박 줄 입력 처리
   ══════════════════════════════════════════ */

/* 호텔을 고르면 지도 링크와 위치 배지를 갱신합니다 */
function onHotelChange(sel){

/* 식사 조건 — 조식 / 불포함 토글 */
function setMeal(btn, v){

/* "다른 조건" — 드롭다운으로 전환합니다 */

function onMealSelect(sel){

/* 구글맵 검색 주소 — 호텔이 있으면 호텔명으로, 없으면 도시명으로 */
function mapUrl(city, hotel){
  var q = hotelName(hotel);
  return 'https://www.google.com/maps/search/' +
    encodeURIComponent(q ? (q + ' ' + city) : city);
}

/* 호텔명 정리 — 드롭다운 값에서 등급 표기를 뗍니다 */
function hotelName(v){ return v ? String(v).split(' · ')[0].trim() : ''; }
/* 직접 입력한 이름이 있으면 그것을, 없으면 목록 선택값을 씁니다 */
function stayHotel(x){ return (x.hname || hotelName(x.hotel) || ''); }

/* ══════════════════════════════════════════
   구간(leg) 기반 일정
   같은 도시를 다시 방문하거나, 0박 경유를 넣을 수 있습니다.
   예) 취리히0 - 인터라켄2 - 밀라노1 - 로마2 - 나폴리1 - 로마0
       → 취리히 IN, 로마 OUT, 실제 숙박 6박
   ══════════════════════════════════════════ */

/* LEGS = [{id, city, nights, hotel, hname, cost, room, meal, ci, co}] */
var LEGS = [];
var LEG_SEQ = 0;

function newLeg(city, nights){
  return {id: 'L' + (++LEG_SEQ), city: city, nights: Number(nights) || 0,
          hotel: '', hname: '', cost: 0, total: 0, room: '', meal: 'BB',
          ci: DEFAULT_CI, co: DEFAULT_CO};
}

/* 도시 선택 체크박스 ↔ LEGS 동기화
   체크된 도시가 LEGS에 없으면 추가, 체크 해제된 도시는 제거 */
function syncLegsFromPicker(){
  var picked = tripCityList().map(function(x){ return x.city; });
  /* 체크 해제된 도시 제거 */
  LEGS = LEGS.filter(function(l){ return picked.indexOf(l.city) > -1; });
  /* 새로 체크된 도시 추가 (동선 순서 뒤에) */
  picked.forEach(function(city){
    if(!LEGS.some(function(l){ return l.city === city; })) LEGS.push(newLeg(city, 0));
  });
  /* LEGS가 비어 있지 않고 순서가 없으면 동선 기준 정렬 */
  if(!LEG_ORDER_MANUAL) sortLegsByRoute();
}

var LEG_ORDER_MANUAL = false;
function sortLegsByRoute(){
  LEGS.sort(function(a, b){
    return cityRank(cityCountry(a.city), a.city) - cityRank(cityCountry(b.city), b.city);
  });
}

/* 체크박스 상태를 LEGS에 맞춤 (텍스트 입력 등에서 사용) */
function syncPickerFromLegs(){
  var want = {};
  LEGS.forEach(function(l){ want[l.city] = 1; });
  document.querySelectorAll('#picker input').forEach(function(b){
    b.checked = !!want[b.value];
  });
  update();
}

function legIndex(id){
  for(var i = 0; i < LEGS.length; i++) if(LEGS[i].id === id) return i;
  return -1;
}
function moveLeg(id, dir){
  var i = legIndex(id);
  var j = i + dir;
  if(i < 0 || j < 0 || j >= LEGS.length) return;
  var t = LEGS[i]; LEGS[i] = LEGS[j]; LEGS[j] = t;
  LEG_ORDER_MANUAL = true;
  renderLegs(); syncPlan(); calc();
}
function removeLeg(id){
  var i = legIndex(id);
  if(i < 0) return;
  var city = LEGS[i].city;
  LEGS.splice(i, 1);
  /* 그 도시가 더 이상 없으면 체크 해제 */
  if(!LEGS.some(function(l){ return l.city === city; })){
    var box = document.querySelector('#picker input[value="' + city + '"]');
    if(box) box.checked = false;
    update();
  }
  renderLegs(); syncPlan(); calc();
}
function duplicateLeg(id){
  var i = legIndex(id);
  if(i < 0) return;
  var src = LEGS[i];
  var copy = newLeg(src.city, 0);
  LEGS.splice(i + 1, 0, copy);
  LEG_ORDER_MANUAL = true;
  renderLegs(); syncPlan(); calc();
}
function addLegCity(city){
  LEGS.push(newLeg(city, 0));
  LEG_ORDER_MANUAL = true;
  var box = document.querySelector('#picker input[value="' + city + '"]');
  if(box && !box.checked){ box.checked = true; update(); }
  renderLegs(); syncPlan(); calc();
}

/* 입력값 → LEGS 반영 */
function readLegInputs(){
  document.querySelectorAll('#stayrows .stayrow').forEach(function(r){
    var i = legIndex(r.getAttribute('data-leg'));
    if(i < 0) return;
    var el = r.querySelectorAll('input,select');
    var L = LEGS[i];
    L.nights = Number(el[0].value) || 0;
    L.hotel = el[1].value;
    L.total = Number(el[2].value) || 0;
    L.cost = L.nights ? Math.round(L.total / L.nights) : 0;
    L.hname = ((r.querySelector('.sd-hname') || {}).value || '').trim();
    L.room = ((r.querySelector('.sd-room') || {}).value || '').trim();
    L.meal = (r.querySelector('.sd-meal') || {}).value || 'BB';
    L.ci = (r.querySelector('.sd-ci') || {}).value || DEFAULT_CI;
    L.co = (r.querySelector('.sd-co') || {}).value || DEFAULT_CO;
  });
}

/* ── 일정 계산 ── */
function buildPlan(){
  readLegInputs();
  var start = parseDate(document.getElementById('qstart').value);
  var rows = LEGS.map(function(l){
    return {id: l.id, city: l.city, nights: l.nights, hotel: l.hotel, cost: l.cost,
            total: l.total, hname: l.hname, room: l.room, meal: l.meal, ci: l.ci, co: l.co};
  });
  var cur = start, legs = [];
  rows.forEach(function(x, i){
    if(!cur) return;
    if(x.nights > 0){
      x.inDate = new Date(cur.getTime());
      x.outDate = addDays(cur, x.nights);
      cur = x.outDate;
    } else {
      /* 0박 경유 — 그날 지나가기만 합니다 */
      x.passDate = new Date(cur.getTime());
    }
    /* 다음 구간으로의 이동 */
    if(i < rows.length - 1){
      var next = rows[i + 1];
      if(x.city !== next.city){
        legs.push({from: x.city, to: next.city, date: new Date(cur.getTime())});
      }
    }
  });
  return {rows: rows, legs: legs, start: start, end: cur};
}

/* 첫 도시 · 마지막 도시 */
function firstCity(){ return LEGS.length ? LEGS[0].city : ''; }
function lastCity(){ return LEGS.length ? LEGS[LEGS.length - 1].city : ''; }
function totalNights(){
  return LEGS.reduce(function(a, l){ return a + (Number(l.nights) || 0); }, 0);
}

/* ── 숙박 입력 UI ── */
function renderLegs(){
  var host = document.getElementById('stayrows');
  if(!host) return;
  if(!LEGS.length){
    host.innerHTML = '<div class="empty-log">위에서 도시를 선택하거나 일정을 한 줄로 입력하면 여기에 나타납니다</div>';
    calc(); return;
  }
  host.innerHTML = LEGS.map(function(L, i){

    var opts = '<option value="">호텔 직접 입력 또는 미정</option>';

/* 예약 확인서 칸 열고 닫기 */
function togglePaste(id){
  var i = legIndex(id);
  if(i < 0) return;
  LEGS[i].pasteOpen = !LEGS[i].pasteOpen;
  var box = document.querySelector('.pastebox[data-leg="' + id + '"]');
  if(box){
    box.classList.toggle('open', LEGS[i].pasteOpen);
    var lab = box.querySelector('.pb-toggle i');
    if(lab) lab.textContent = LEGS[i].pasteOpen ? '접기' : '';
    if(LEGS[i].pasteOpen){
      var ta = box.querySelector('.pb-text');
      if(ta) setTimeout(function(){ ta.focus(); }, 80);
    }
  }
}

/* 줄 안에서 바로 읽어들입니다 */
function onInlinePaste(el, id){
  var box = el.closest('.pastebox');
  var out = box ? box.querySelector('.pb-result') : null;
  var txt = el.value;
  if(!out) return;
  if(!txt.trim()){ out.innerHTML = ''; return; }

  var r = parseBookingText(txt);
  if(!r.hotel && !r.total){
    out.innerHTML = '<div class="pb-none">읽을 수 있는 내용이 없습니다. 예약 확인서를 그대로 붙여넣어 주세요.</div>';
    return;
  }

  var row = document.querySelector('#stayrows .stayrow[data-leg="' + id + '"]');
  if(!row) return;
  var elx = row.querySelectorAll('input,select');

  /* 값 채우기 */
  if(r.nights) elx[0].value = r.nights;
  if(r.total) elx[2].value = (r.rooms > 1) ? Math.round(r.total / r.rooms) : r.total;

  var matched = false;
  if(r.hotel){
    var norm = function(t){ return String(t).toLowerCase().replace(/[^a-z0-9가-힣]/g, ''); };
    var want = norm(r.hotel);
    for(var k = 1; k < elx[1].options.length; k++){
      var opt = norm(elx[1].options[k].value.split(' · ')[0].split(' (')[0]);
      if(!opt) continue;
      if(want.indexOf(opt) === 0 || opt.indexOf(want) === 0){
        elx[1].selectedIndex = k; matched = true; break;
      }
    }
  }
  var hn = row.querySelector('.sd-hname');
  if(hn) hn.value = matched ? '' : (r.hotel ? r.hotel + (r.hotelKr ? ' (' + r.hotelKr + ')' : '') : '');
  var rm = row.querySelector('.sd-room');
  if(rm && r.room) rm.value = r.room;
  if(r.ci){ var ci = row.querySelector('.sd-ci'); if(ci && r.ciTime) ci.value = r.ciTime; }
  if(r.co){ var co = row.querySelector('.sd-co'); if(co && r.coTime) co.value = r.coTime; }
  if(matched) onHotelChange(elx[1]);
  onTotalInput(elx[2]);
  if(rm) checkRoomType(rm);

  /* 결과 표시 */
  var h = '<div class="pb-ok"><b>읽어들였습니다</b>';
  function line(k, v){ if(v) h += '<div class="pb-row"><span>' + k + '</span><b>' + esc(v) + '</b></div>'; }
  line('호텔', r.hotel + (r.hotelKr ? ' (' + r.hotelKr + ')' : ''));
  line('기간', (r.ci || '') + (r.co ? ' → ' + r.co : '') + (r.nights ? ' · ' + r.nights + '박' : ''));
  line('객실', (r.room || '') + (r.rooms > 1 ? ' · ' + r.rooms + '실' : ''));
  line('숙박 총액', r.total ? won(r.rooms > 1 ? Math.round(r.total / r.rooms) : r.total) +
       (r.rooms > 1 ? ' (1실 기준)' : '') : '');
  line('취소 규정', r.cancel);
  if(r.cityTax) h += '<div class="pb-note">도시세 별도 징수가 감지되었습니다. 불포함으로 안내됩니다.</div>';
  h += '</div>';
  out.innerHTML = h;
}

/* 침대가 분리된 객실인지 확인합니다 */
function checkRoomType(el){
  var row = el.closest('.stayrow');
  if(!row) return;
  var v = String(el.value || '').toLowerCase().replace(/\s+/g, '');
  /* 트윈 · 싱글 두 개 · 분리 침대 표현 */
  var bad = /twin|트윈|싱글베드2|singlebeds|2single|separatebed|분리침대|침대2개/.test(v);
  el.classList.toggle('bad', bad);
  var old = row.querySelector('.roomwarn');
  if(old) old.remove();
  if(!bad) return;
  var w = document.createElement('div');
  w.className = 'roomwarn';
  w.innerHTML = '<b>확인</b><span>침대가 분리된 <b>트윈</b> 객실입니다. ' +
    '신혼여행에는 보통 더블이나 킹을 배정합니다. 의도한 것이 맞는지 확인해 주세요.</span>';
  var main = el.closest('.sr-main');
  if(main) main.parentNode.insertBefore(w, main.nextSibling);
}

/* 역에서 호텔까지 길찾기 */
function routeUrl(city, hotel){
  var rec = HOTELS[city];
  var from = (rec && rec.area) ? (city + ' ' + rec.area.split(' · ')[0]) : (city + ' 중앙역');
  var to = hotelName(hotel) ? (hotelName(hotel) + ' ' + city) : city;
  return 'https://www.google.com/maps/dir/' +
    encodeURIComponent(from) + '/' + encodeURIComponent(to);
}

/* 총 숙박 원가를 넣으면 1박당 금액을 계산해 아래에 보여줍니다 */
function onTotalInput(el){
  var row = el.closest('.stayrow');
  if(!row) return;
  var i = legIndex(row.getAttribute('data-leg'));
  if(i < 0) return;
  var total = Number(el.value) || 0;
  LEGS[i].total = total;
  /* 계산에 쓰는 값은 1박당 객실 요금입니다 */
  var n = Number(LEGS[i].nights) || 0;
  LEGS[i].cost = n ? Math.round(total / n) : 0;
  syncPerNight(row, LEGS[i]);
  calc();
}

/* 1박당 · 1인당 금액 안내 */
function syncPerNight(row, L){
  var el = row.querySelector('.sf-per');
  if(!el) return;
  var n = Number(L.nights) || 0;
  var total = Number(L.total) || 0;
  if(!n || !total){ el.textContent = ''; return; }
  var pax = Math.max(1, Number(gv('qpax')) || 2);
  var rooms = Math.ceil(pax / 2);
  var perNight = Math.round(total / n);
  /* 입력한 총액은 객실 1개 기준입니다.
     실제 청구액은 객실 수만큼 곱하고, 1인 금액은 인원으로 나눕니다. */
  var allRooms = total * rooms;
  var perHead = Math.round(allRooms / pax);
  el.innerHTML = '1박 ' + won(perNight) +
    (rooms > 1 ? ' · ' + rooms + '실 <b>' + won(allRooms) + '</b>' : '');
}

function onNightsChange(el){
  var row = el.closest('.stayrow');
  var i = legIndex(row.getAttribute('data-leg'));
  if(i >= 0){
    LEGS[i].nights = Number(el.value) || 0;
    /* 총액은 그대로 두고 1박당 금액만 다시 나눕니다 */
    var n = LEGS[i].nights, t = Number(LEGS[i].total) || 0;
    LEGS[i].cost = n ? Math.round(t / n) : 0;
  }
  renderLegs();
  syncPlan(); calc();
}

/* ── 열차 요금 조회 ── */
function findTrain(a, b){
  for(var i = 0; i < TRAINS.length; i++){
    var t = TRAINS[i];
    if((t.a === a && t.b === b) || (t.a === b && t.b === a)) return t;
  }
  /* "취리히 공항" 처럼 뒤에 말이 붙은 구간도 찾습니다 */
  function base(x){ return String(x).replace(/\s*(공항|중앙역|역|중앙)\s*$/, '').trim(); }
  var A = base(a), B = base(b);
  for(var j = 0; j < TRAINS.length; j++){
    var t2 = TRAINS[j];
    var ta = base(t2.a), tb = base(t2.b);
    if((ta === A && tb === B) || (ta === B && tb === A)) return t2;
  }
  return null;
}

/* ── 열차 행 갱신 ── */

function syncPlan(){

  window.__prTimer = setTimeout(function(){ try{ renderPlanner(); }catch(e){} }, 60);

      '<div class="lg-b">' +

          (mode !== 'air' && t ? ' · ' + (we ? '주말' : '주중') + ' 요금' : '') + '</span>' +
        '<label class="rqfare"><input type="number" min="0" step="100" value="' + (fare || '') +
          '" placeholder="1인 원가" oninput="onFareInput(this)"></label>' +
